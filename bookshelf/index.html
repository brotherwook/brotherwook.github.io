 th,.page-content td{border:1px solid #ddcdac;padding:3px 7px}.page.cover{background:linear-gradient(160deg,#7a5230 0%,#6f4b2c 45%,#8a5a34 100%)}.page.cover .page-inner{display:flex;flex-direction:column;color:#fff8ec}.cover-kicker{font-size:12px;letter-spacing:.5px;color:rgba(255,240,220,.7)}.cover-thumb{flex:1;display:grid;place-items:center;min-height:0;margin:14px 0}.cover-thumb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 8px 26px rgba(0,0,0,.4)}.cover-ttl{font-size:22px;font-weight:800;line-height:1.3;text-shadow:0 2px 10px rgba(0,0,0,.3)}.cover-date{margin-top:8px;font-size:13px;color:rgba(255,240,220,.75)}.page.cover.back .page-inner{justify-content:center;text-align:center;gap:14px}.back-emoji{font-size:46px}.back-msg{font-size:15px;color:rgba(255,240,220,.85);line-height:1.7}.back-go{display:inline-block;margin-top:6px;padding:10px 18px;border-radius:12px;text-decoration:none;font-weight:700;color:#2a1f16;background:linear-gradient(90deg,#ffdf9e,#ffb04a)}#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9;font-size:12.5px;color:#efe3d5;background:rgba(40,30,22,.55);border:1px solid rgba(255,225,190,.14);border-radius:999px;padding:9px 18px;white-space:nowrap}#hint.hide{display:none}#empty{position:fixed;inset:0;z-index:8;display:none;place-items:center;text-align:center;color:#c9b299;font-size:15px}#credit{position:fixed;bottom:12px;right:14px;z-index:9;font-size:10.5px;color:rgba(233,219,197,.5)}#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#1c1611;color:#c9b299;font-size:14px;text-align:center}</style></head><body><div id=app></div><div id=title><h1>📚 나의 책장</h1><p>글 하나가 책 한 권이에요. 책에 마우스를 올리면 살짝 나오고, <b>클릭</b>하면 펼쳐집니다.</p></div><a id=back href=/>← 블로그로</a><div id=label></div><div id=flip-overlay><div id=flip-stage><div id=flipbook></div></div><div id=flip-bar><button id=fb-prev>◀ 이전</button>

</script><script>window.__BOOKS=[{content:`<h2 id="문제-상황">문제 상황</h2>
<p>NAS에 Docker로 올려둔 GitLab이 어느 날 갑자기 접속이 안 됐다. 로그인 페이지고 뭐고 <strong>모든 페이지가 403 Forbidden</strong>을 뱉었다. 어제까지 멀쩡했는데 말이다..</p>
<p>일단 반사적으로 &ldquo;재시작하면 되겠지&rdquo; 하고 컨테이너를 재시작했다. 그런데 안 됐다. 재시작만으로 안 풀리는 문제였던 거다. 결국 로그를 까보고 나서야 원인이 두 개나 겹쳐 있었다는 걸 알았다. 이 글은 그 삽질을 정리한 기록이다.</p>
<p>참고로 여기서 쓰는 이미지는 <code>sameersbn/gitlab</code> 기반이다. Synology 같은 NAS의 GitLab 패키지가 보통 이걸 쓴다. 공식 Omnibus 이미지(<code>gitlab/gitlab-ce</code>)랑은 구조가 좀 달라서, <strong><code>gitlab-ctl</code> 명령어가 아예 없다.</strong> 이거 모르고 컨테이너 안에 들어가서 <code>gitlab-ctl restart</code> 쳤다가 &ldquo;command not found&rdquo; 보고 당황했다..</p>
<p>그래서 재시작은 그냥 호스트(NAS 터미널)에서 컨테이너 통째로 하는 게 맞다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">docker restart synology_gitlab
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="1단계---로그부터-보자">1단계 - 로그부터 보자</h2>
<p><code>gitlab-ctl</code>이 없으니 로그도 직접 찾아 들어가야 한다. 먼저 컨테이너 로그를 봤더니 이런 게 무한 반복되고 있었다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">INFO spawned: &#39;unicorn&#39; with pid 788
</span></span><span class="line"><span class="cl">INFO success: unicorn entered RUNNING state, process has stayed up for &gt; than 1 seconds
</span></span><span class="line"><span class="cl">INFO exited: unicorn (exit status 1; not expected)
</span></span></code></pre></td></tr></table>
</div>
</div><p><code>unicorn</code>은 GitLab의 웹 애플리케이션 서버다. 이게 <strong>뜨자마자 1초 만에 죽고, supervisor가 다시 살리고, 또 죽고</strong>를 무한 반복하고 있었다. 웹이 제대로 뜰 리가 없다.</p>
<p><code>exit status 1</code>만으로는 진짜 원인이 안 보인다. 실제 에러는 unicorn 자체 로그에 찍혀 있어서, 컨테이너 안에 들어가서 두 개를 봤다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span><span class="lnt">7
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">docker <span class="nb">exec</span> -it synology_gitlab bash
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># unicorn 에러 로그</span>
</span></span><span class="line"><span class="cl">cat /home/git/gitlab/log/unicorn.stderr.log <span class="p">|</span> tail -50
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># GitLab production 로그</span>
</span></span><span class="line"><span class="cl">tail -50 /home/git/gitlab/log/production.log
</span></span></code></pre></td></tr></table>
</div>
</div><p>여기서 원인 두 개가 각각 튀어나왔다.</p>
<h2 id="원인-a---stale-pid-unicorn이-안-뜨는-이유">원인 A - stale PID (unicorn이 안 뜨는 이유)</h2>
<p><code>unicorn.stderr.log</code>에 이게 계속 찍혀 있었다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">Already running on PID:603 (or pid=/home/git/gitlab/tmp/pids/unicorn.pid is stale) (ArgumentError)
</span></span></code></pre></td></tr></table>
</div>
</div><p>번역하면 &ldquo;이미 PID 603으로 돌고 있거나, PID 파일이 오래된 거(stale)다&rdquo; 라는 뜻이다. 재시작 과정에서 unicorn이 깔끔하게 안 죽으면서 <strong>PID 파일만 남아버린</strong> 상황이다. 실제로 603번 프로세스는 없는데 파일이 남아 있으니, unicorn이 &ldquo;어? 이미 누가 돌고 있네?&rdquo; 하고 스스로 종료해버리는 거다.</p>
<p>해결은 허무할 정도로 간단하다. <strong>죽은 PID 파일만 지우면 된다.</strong></p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">rm /home/git/gitlab/tmp/pids/unicorn.pid
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="원인-b---rackattack-자동-밴-403의-진짜-범인">원인 B - Rack::Attack 자동 밴 (403의 진짜 범인)</h2>
<p><code>production.log</code>를 봤더니 이게 도배되고 있었다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">Rack_Attack: blacklist 172.17.0.1 GET /
</span></span><span class="line"><span class="cl">Rack_Attack: blacklist 172.17.0.1 GET /favicon.ico
</span></span></code></pre></td></tr></table>
</div>
</div><p>이게 403의 진짜 원인이었다. GitLab에는 <strong>Rack::Attack</strong>이라는 요청 차단 미들웨어가 있는데, 짧은 시간에 인증 실패(잘못된 비밀번호·토큰으로 git push/pull 시도 등)가 반복되면 그 IP를 자동으로 밴해버린다. 실제로 로그를 거슬러 올라가 보니 <code>git-receive-pack</code>에서 <code>401 Unauthorized</code>가 몇 번 나다가, 그 뒤로 전부 blacklist로 바뀌어 있었다.</p>
<p>여기서 이 구조의 함정이 하나 있다. NAS + Docker 환경에서는 <strong>모든 외부 요청이 <code>172.17.0.1</code>(Docker 브리지 네트워크의 게이트웨이) 하나로 보인다.</strong> 리버스 프록시나 NAS를 거쳐 들어오면 GitLab 입장에선 출발지 IP가 죄다 이 하나로 뭉뚱그려진다는 뜻이다.</p>
<p>그래서 어딘가에서 자격증명 하나가 잘못돼 인증 실패가 쌓이면, 그 IP가 밴되고 → 결과적으로 <strong>나를 포함한 모든 사용자가 403</strong>을 맞는다. NAS GitLab에서 꽤 흔하게 밟는 지뢰라고 한다.</p>
<h3 id="밴-풀기">밴 풀기</h3>
<p>밴 정보는 Redis에 저장된다. 이 환경에선 Redis가 별도 컨테이너(<code>synology_gitlab_redis</code>)로 돌고 있어서, 호스트에서 바로 접근했다.</p>
<p>먼저 rack attack 관련 키를 확인한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">docker <span class="nb">exec</span> -it synology_gitlab_redis redis-cli KEYS <span class="s2">&#34;*rack*&#34;</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>이렇게 나왔다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">1) &#34;cache:gitlab:rack::attack:allow2ban:ban:172.17.0.1&#34;
</span></span><span class="line"><span class="cl">2) &#34;cache:gitlab:exists?:myuser/myproject:267&#34;
</span></span><span class="line"><span class="cl">3) &#34;cache:gitlab:exists?:myuser/myproject.wiki:267&#34;
</span></span></code></pre></td></tr></table>
</div>
</div><p>1번이 범인이다. <strong>2, 3번은 프로젝트 존재 여부 캐시라 건드리면 안 된다.</strong> 1번만 지운다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">docker <span class="nb">exec</span> -it synology_gitlab_redis redis-cli DEL <span class="s2">&#34;cache:gitlab:rack::attack:allow2ban:ban:172.17.0.1&#34;</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p><code>(integer) 1</code>이 뜨면 삭제 성공이다. 혹시 실패 카운터(<code>count:...</code>)가 임계치 근처에 남아 있으면 몇 번 요청에 다시 밴될 수 있으니, 아래로 한 번 더 확인해서 남은 게 있으면 같이 지워주면 된다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">docker <span class="nb">exec</span> -it synology_gitlab_redis redis-cli KEYS <span class="s2">&#34;*allow2ban*&#34;</span>
</span></span></code></pre></td></tr></table>
</div>
</div><blockquote>
<p>⚠️ <code>FLUSHALL</code>이나 <code>FLUSHDB</code>는 쓰지 말자. 세션·캐시까지 몽땅 날아가서 다들 로그아웃되고 캐시가 재생성된다. 데이터 손상은 아니지만 굳이 그럴 필요가 없다. <code>*rack*</code> / <code>*allow2ban*</code> 패턴만 콕 집어서 지우는 게 안전하다.</p>
</blockquote>
<h2 id="복구-순서-정리">복구 순서 정리</h2>
<p>정리하면 이 순서로 하면 된다.</p>
<ol>
<li>컨테이너 안에서 stale PID 삭제: <code>rm /home/git/gitlab/tmp/pids/unicorn.pid</code></li>
<li>Rack::Attack 밴 키 삭제 (위 Redis 명령)</li>
<li><code>exit</code> 후 <code>docker restart synology_gitlab</code></li>
<li><strong>1~3분 기다린다</strong> (sameersbn 이미지는 부팅 때 마이그레이션 체크를 해서 완전히 뜨는 데 시간이 좀 걸린다. 재시작 직후 바로 접속하면 502가 뜨는데 정상이다..)</li>
<li><code>docker logs --tail 20 synology_gitlab</code>로 unicorn이 <code>RUNNING</code> 상태를 유지하는지 확인</li>
</ol>
<p>이렇게 하니 다시 접속됐다.</p>
<h2 id="재발-방지">재발 방지</h2>
<p>밴은 어디까지나 결과다. 근본은 &ldquo;인증 실패가 반복됐다&quot;는 거니까, 거기서부터 손봐야 한다.</p>
<p><strong>1) 인증 실패의 원인부터 찾기 (가장 확실)</strong>
옛날 remote URL이나 저장된 자격증명으로 계속 재시도하는 클라이언트가 있는지 의심해보자. 로컬 PC, CI 스크립트, cron 스케줄러 중에 만료된 토큰이나 잘못된 계정으로 push/pull을 반복하는 놈이 범인일 확률이 높다. <code>production.log</code>에서 <code>401</code>이 <strong>어느 프로젝트·어느 요청</strong>에서 나는지 보면 범인을 특정할 수 있다.</p>
<p><strong>2) 신뢰 IP 화이트리스트 (내부망 전용일 때 추천)</strong>
내부망에서만 쓰는 NAS라면, Docker 내부 대역을 Rack::Attack 화이트리스트에 넣어두면 이 자동 밴 자체가 안 걸린다. sameersbn 이미지 기준으로 컨테이너 환경변수에 추가하면 된다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">GITLAB_RACK_ATTACK_WHITELIST=127.0.0.1,172.17.0.0/16
</span></span></code></pre></td></tr></table>
</div>
</div><p>추가 후 컨테이너 재생성하면 적용된다. 다만 <strong>인터넷에 노출된 GitLab이면 이건 비추다.</strong> 브루트포스 보호를 사실상 꺼버리는 셈이라, 어디까지나 내부망 전용일 때만 권한다.</p>
<p><strong>3) 응급 복구 명령은 저장해두기</strong>
또 밴 걸리면 이 두 줄이면 끝난다. 어디 메모장에라도 박아두자.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">docker <span class="nb">exec</span> synology_gitlab_redis redis-cli KEYS <span class="s2">&#34;*allow2ban*&#34;</span>
</span></span><span class="line"><span class="cl">docker <span class="nb">exec</span> synology_gitlab_redis redis-cli DEL <span class="s2">&#34;해당 ban 키&#34;</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="여담">여담</h2>
<p>두 문제(stale PID + Rack::Attack 밴)가 하필 같이 터져서 원인 찾는 데 시간을 꽤 썼다. 재시작만으로 안 될 때는 역시 로그부터 봐야 한다는 걸 또 배웠다..</p>
<p>그리고 이번에 새삼 느낀 건데, NAS에 붙어 있는 GitLab 이미지가 상당히 오래된 버전인 경우가 많다. 내부망 전용이면 당장 문제는 없지만, 혹시 외부에 열려 있다면 알려진 취약점이 꽤 쌓여 있을 수 있으니 VPN 뒤에 두는 식으로 접근 제어를 한 번쯤 점검해보는 걸 추천한다.</p>
`,date:"2026.09.21",summary:`문제 상황 NAS에 Docker로 올려둔 GitLab이 어느 날 갑자기 접속이 안 됐다. 로그인 페이지고 뭐고 모든 페이지가 403 Forbidden을 뱉었다. 어제까지 멀쩡했는데 말이다..
일단 반사적으로 “재시작하면 되겠지” 하고 컨테이너를 재시작했다. 그런데 안 됐다. 재시작만으로 안 풀리는 문제였던 거다. 결국 로그를 까보고 나서야 원인이 두 개나 겹쳐 있었다는 걸 알았다. 이 글은 그 삽질을 정리한 기록이다.
참고로 여기서 쓰는 이미지는 sameersbn/gitlab 기반이다. Synology 같은 NAS의 GitLab 패키지가 보통 이걸 쓴다. 공식 Omnibus 이미지(gitlab/gitlab-ce)랑은 구조가 좀 달라서, gitlab-ctl 명령어가 아예 없다. 이거 모르고 컨테이너 안에 들어가서 gitlab-ctl restart 쳤다가 “command not found” 보고 당황했다..
`,thumb:"/images/book-default.svg",title:"[GitLab] NAS GitLab이 갑자기 403 Forbidden.. Rack::Attack 자동 밴 풀기",url:"/posts/nas-gitlab-403-rack-attack/"},{content:`<h2 id="서버-이벤트를-브라우저에-실시간으로-띄우고-싶다">서버 이벤트를 브라우저에 실시간으로 띄우고 싶다</h2>
<p>서버에서 어떤 일이 생길 때마다(이미지가 하나 만들어졌다든가) 그걸 <strong>브라우저 화면에 실시간으로 잠깐 띄우고</strong> 싶었다. 화면 구석에 작게, 최신 것이 위로 쌓이면서 몇 초 뒤 사라지는 그런 알림.</p>
<p>폴링(주기적으로 서버에 물어보기)으로도 되지만, &ldquo;생기는 즉시&quot;가 중요하면 <strong>WebSocket</strong>이 맞다. 서버가 연결된 브라우저로 <strong>먼저 밀어(push)</strong> 줄 수 있으니까. 만들면서 정리한 것들을 적어둔다.</p>
<h2 id="하나의-소켓-여러-종류의-이벤트--msg_type-라우팅">하나의 소켓, 여러 종류의 이벤트 — msg_type 라우팅</h2>
<p>실시간 채널을 열면 곧 여러 종류의 메시지가 오간다. 이미지 알림, 상태 변경, 하트비트.. 이걸 <strong>소켓마다 따로 열지 말고, 하나의 소켓에 메시지 종류를 실어 보내는</strong> 게 깔끔하다. 그래서 메시지에 항상 <code>msg_type</code> 필드를 둔다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-json" data-lang="json"><span class="line"><span class="cl"><span class="p">{</span> <span class="nt">&#34;msg_type&#34;</span><span class="p">:</span> <span class="s2">&#34;image&#34;</span><span class="p">,</span> <span class="nt">&#34;img_path&#34;</span><span class="p">:</span> <span class="s2">&#34;/data/sample.jpg&#34;</span><span class="p">,</span> <span class="nt">&#34;channel&#34;</span><span class="p">:</span> <span class="mi">3</span> <span class="p">}</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>브라우저 쪽은 <code>msg_type</code>을 보고 핸들러로 **분기(dispatch)**한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span><span class="lnt">12
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-javascript" data-lang="javascript"><span class="line"><span class="cl"><span class="nx">socket</span><span class="p">.</span><span class="nx">onmessage</span> <span class="o">=</span> <span class="p">(</span><span class="nx">e</span><span class="p">)</span> <span class="p">=&gt;</span> <span class="p">{</span>
</span></span><span class="line"><span class="cl">  <span class="kr">const</span> <span class="nx">data</span> <span class="o">=</span> <span class="nx">JSON</span><span class="p">.</span><span class="nx">parse</span><span class="p">(</span><span class="nx">e</span><span class="p">.</span><span class="nx">data</span><span class="p">);</span>
</span></span><span class="line"><span class="cl">  <span class="k">switch</span> <span class="p">(</span><span class="nx">data</span><span class="p">.</span><span class="nx">msg_type</span><span class="p">)</span> <span class="p">{</span>
</span></span><span class="line"><span class="cl">    <span class="k">case</span> <span class="s2">&#34;image&#34;</span><span class="o">:</span>
</span></span><span class="line"><span class="cl">      <span class="k">if</span> <span class="p">(</span><span class="k">typeof</span> <span class="nx">onImage</span> <span class="o">===</span> <span class="s2">&#34;function&#34;</span><span class="p">)</span> <span class="nx">onImage</span><span class="p">(</span><span class="nx">data</span><span class="p">);</span>  <span class="c1">// 이 페이지에 핸들러가 있을 때만
</span></span></span><span class="line"><span class="cl">      <span class="k">break</span><span class="p">;</span>
</span></span><span class="line"><span class="cl">    <span class="k">case</span> <span class="s2">&#34;status&#34;</span><span class="o">:</span>
</span></span><span class="line"><span class="cl">      <span class="nx">onStatus</span><span class="p">(</span><span class="nx">data</span><span class="p">);</span>
</span></span><span class="line"><span class="cl">      <span class="k">break</span><span class="p">;</span>
</span></span><span class="line"><span class="cl">    <span class="c1">// 새 이벤트는 여기 한 줄씩 늘리면 된다
</span></span></span><span class="line"><span class="cl">  <span class="p">}</span>
</span></span><span class="line"><span class="cl"><span class="p">};</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>여기서 <code>typeof ... === &quot;function&quot;</code> 가드가 유용했다. 소켓 연결 코드는 <strong>모든 페이지 공통</strong>으로 두고, <code>onImage</code> 같은 핸들러는 <strong>그게 필요한 페이지에서만</strong> 정의하는 식이다. 그러면 알림을 띄울 화면에서만 그 case가 실제로 동작하고, 다른 페이지에선 조용히 무시된다.</p>
<h2 id="스택-토스트--핵심은-아이템마다-개별-타이머">스택 토스트 — 핵심은 &ldquo;아이템마다 개별 타이머&rdquo;</h2>
<p>화면에 띄우는 부분. 요구는 이랬다.</p>
<ul>
<li>최신 알림이 <strong>아래에 쌓이고</strong>, 기존 건 위로 밀린다</li>
<li><strong>최대 5개</strong>까지만, 넘으면 가장 오래된 것 제거</li>
<li>각 알림은 <strong>3초 뒤 자동으로 사라짐</strong></li>
<li>마우스를 올리면 <strong>× 버튼</strong>이 떠서 3초 전에 직접 닫을 수 있음</li>
</ul>
<p>여기서 제일 중요한 게 **&ldquo;타이머를 하나로 두지 말고, 아이템마다 따로 둔다&rdquo;**는 것이다. 흔히 하는 실수가 전역 타이머 하나를 두고 새 알림이 올 때마다 리셋하는 건데, 그러면 알림들이 제각각 3초를 못 채우고 한꺼번에 사라지거나 꼬인다. <strong>각 아이템이 자기 타이머를 들고</strong> 있어야 한다.</p>

</span></span></span><span class="line"><span class="cl"><span class="p">}</span>

</span></span><span class="line"><span class="cl"><span class="kd">function</span> <span class="nx">remove</span><span class="p">(</span><span class="nx">item</span><span class="p">)</span> <span class="p">{</span>
</span></span><span class="line"><span class="cl">  <span class="k">if</span> <span class="p">(</span><span class="o">!</span><span class="nx">item</span><span class="p">)</span> <span class="k">return</span><span class="p">;</span>
</span></span><span class="line"><span class="cl">  <span class="k">if</span> <span class="p">(</span><span class="nx">item</span><span class="p">.</span><span class="nx">_timer</span><span class="p">)</span> <span class="nx">clearTimeout</span><span class="p">(</span><span class="nx">item</span><span class="p">.</span><span class="nx">_timer</span><span class="p">);</span>  <span class="c1">// 수동으로 닫을 때 타이머도 정리(중복 실행 방지)
</span></span></span><span class="line"><span class="cl">  <span class="nx">item</span><span class="p">.</span><span class="nx">remove</span><span class="p">();</span>
</span></span><span class="line"><span class="cl"><span class="p">}</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>닫기(× 클릭)나 로드 실패로 미리 제거할 때 <strong>타이머를 꼭 <code>clearTimeout</code></strong> 해줘야 한다. 안 그러면 이미 사라진 요소를 타이머가 또 지우려 하거나, 타이머 콜백이 엉뚱하게 도는 자잘한 버그가 생긴다. <code>× 버튼</code>은 CSS에서 평소엔 숨겨두고 <code>.notify-item:hover .notify-close { display:block }</code> 로 hover 때만 띄우면 된다.</p>
<h2 id="서버가-준-경로는-브라우저-url이-아니다">서버가 준 &ldquo;경로&quot;는 브라우저 URL이 아니다</h2>
<p>메시지의 <code>img_path</code>는 보통 <strong>서버 파일시스템 경로</strong>(<code>/data/sample.jpg</code> 같은)로 온다. 브라우저는 이 경로로 파일을 못 읽는다. <strong>웹으로 서빙되는 URL로 변환</strong>해줘야 한다. 서버가 특정 디렉토리를 특정 URL 접두어로 서빙하고 있다면, 그 접두어로 치환하는 식이다.</p>

<pre tabindex="0" class="chroma"><code class="language-javascript" data-lang="javascript"><span class="line"><span class="cl"><span class="kd">function</span> <span class="nx">toPublicUrl</span><span class="p">(</span><span class="nx">p</span><span class="p">)</span> <span class="p">{</span>
</span></span><span class="line"><span class="cl">  <span class="c1">// 예: 서버의 /data/  디렉토리를 /media/ URL 로 서빙 중이라면
</span></span></span><span class="line"><span class="cl">  <span class="k">return</span> <span class="nx">p</span><span class="p">.</span><span class="nx">replace</span><span class="p">(</span><span class="sr">/^\\/data\\//</span><span class="p">,</span> <span class="s2">&#34;/media/&#34;</span><span class="p">);</span>
</span></span><span class="line"><span class="cl"><span class="p">}</span>
</span></span></code></pre></td></tr></table>

</div><p>이건 프로젝트마다 다르니 &ldquo;서버 경로 → 서빙 URL&rdquo; 매핑 규칙을 한 군데 함수로 두는 게 좋다. 이 변환을 깜빡하면 이미지가 전부 깨져서 나온다.. (그리고 <code>onerror</code>로 즉시 제거하게 해두면 깨진 이미지가 화면에 안 남는다.)</p>
<h2 id="테스트-클라이언트-하나면-개발이-편하다">테스트 클라이언트 하나면 개발이 편하다</h2>

<pre tabindex="0" class="chroma"><code><span class="lnt"> 1

<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="kn">import</span> <span class="nn">asyncio</span><span class="o">,</span> <span class="nn">json</span><span class="o">,</span> <span class="nn">sys</span><span class="o">,</span> <span class="nn">websockets</span>

</span></span><span class="line"><span class="cl">    <span class="k">async</span> <span class="k">with</span> <span class="n">websockets</span><span class="o">.</span><span class="n">connect</span><span class="p">(</span><span class="n">uri</span><span class="p">)</span> <span class="k">as</span> <span class="n">ws</span><span class="p">:</span>      <span class="c1"># 연결은 한 번만 열고 재사용</span>
</span></span><span class="line"><span class="cl">        <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="n">count</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">            <span class="k">await</span> <span class="n">ws</span><span class="o">.</span><span class="n">send</span><span class="p">(</span><span class="n">json</span><span class="o">.</span><span class="n">dumps</span><span class="p">(</span><span class="n">msg</span><span class="p">))</span>

</span></span><span class="line"><span class="cl">                <span class="k">await</span> <span class="n">asyncio</span><span class="o">.</span><span class="n">sleep</span><span class="p">(</span><span class="n">interval</span><span class="p">)</span>

</span></span><span class="line"><span class="cl"><span class="k">if</span> <span class="vm">__name__</span> <span class="o">==</span> <span class="s2">&#34;__main__&#34;</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">    <span class="n">count</span>    <span class="o">=</span> <span class="nb">int</span><span class="p">(</span><span class="n">sys</span><span class="o">.</span><span class="n">argv</span><span class="p">[</span><span class="mi">1</span><span class="p">])</span>   <span class="k">if</span> <span class="nb">len</span><span class="p">(</span><span class="n">sys</span><span class="o">.</span><span class="n">argv</span><span class="p">)</span> <span class="o">&gt;</span> <span class="mi">1</span> <span class="k">else</span> <span class="mi">1</span>
</span></span><span class="line"><span class="cl">    <span class="n">interval</span> <span class="o">=</span> <span class="nb">float</span><span class="p">(</span><span class="n">sys</span><span class="o">.</span><span class="n">argv</span><span class="p">[</span><span class="mi">2</span><span class="p">])</span> <span class="k">if</span> <span class="nb">len</span><span class="p">(</span><span class="n">sys</span><span class="o">.</span><span class="n">argv</span><span class="p">)</span> <span class="o">&gt;</span> <span class="mi">2</span> <span class="k">else</span> <span class="mf">1.0</span>
</span></span><span class="line"><span class="cl">    <span class="n">asyncio</span><span class="o">.</span><span class="n">run</span><span class="p">(</span><span class="n">main</span><span class="p">(</span><span class="n">count</span><span class="p">,</span> <span class="n">interval</span><span class="p">))</span>
</span></span></code></pre></td></tr></table>
</div>

</div><p>포인트는 <strong>연결을 한 번만 열고 그 위로 반복 전송</strong>하는 것. 매 전송마다 새로 connect하면 실제 동작과도 다르고 느리다. 이 스크립트 하나로 &ldquo;여러 개가 쌓이는지&rdquo;, &ldquo;5개 넘으면 오래된 게 빠지는지&rdquo;, &ldquo;3초 뒤 사라지는지&quot;를 전부 눈으로 확인했다.</p>
<h2 id="정리">정리</h2>
<ul>
<li>실시간 &ldquo;생기는 즉시&quot;는 폴링 말고 <strong>WebSocket push</strong>. 여러 이벤트는 <strong>하나의 소켓 + <code>msg_type</code> 라우팅</strong>으로.</li>
<li>공통 소켓 코드 + 페이지별 핸들러는 <strong><code>typeof fn === &quot;function&quot;</code> 가드</strong>로 느슨하게 연결.</li>
<li>스택 토스트는 <strong>아이템마다 개별 타이머</strong>, 수동 제거 시 <strong><code>clearTimeout</code>으로 정리</strong>, 초과분은 오래된 것부터.</li>
<li>메시지의 <strong>서버 경로는 서빙 URL로 변환</strong>해야 하고, <code>onerror</code>로 깨진 이미지 정리.</li>
<li><strong>작은 테스트 클라이언트</strong>(횟수·간격 인자, 연결 재사용)를 만들어두면 실시간 개발이 훨씬 편하다.</li>
</ul>
<p>실시간 알림은 &ldquo;소켓 열고 그리기&quot;만 생각하기 쉬운데, 실제로 손이 많이 간 건 <strong>여러 개가 각자의 수명을 갖게 하는 부분</strong>(개별 타이머·정리)이었다. 그리고 테스트 클라이언트 하나 만들어둔 게 이 자잘한 동작들을 검증하는 데 제일 큰 도움이 됐다.</p>
`,date:"2026.09.20",summary:`서버 이벤트를 브라우저에 실시간으로 띄우고 싶다 서버에서 어떤 일이 생길 때마다(이미지가 하나 만들어졌다든가) 그걸 브라우저 화면에 실시간으로 잠깐 띄우고 싶었다. 화면 구석에 작게, 최신 것이 위로 쌓이면서 몇 초 뒤 사라지는 그런 알림.
폴링(주기적으로 서버에 물어보기)으로도 되지만, “생기는 즉시"가 중요하면 WebSocket이 맞다. 서버가 연결된 브라우저로 먼저 밀어(push) 줄 수 있으니까. 만들면서 정리한 것들을 적어둔다.
하나의 소켓, 여러 종류의 이벤트 — msg_type 라우팅 실시간 채널을 열면 곧 여러 종류의 메시지가 오간다. 이미지 알림, 상태 변경, 하트비트.. 이걸 소켓마다 따로 열지 말고, 하나의 소켓에 메시지 종류를 실어 보내는 게 깔끔하다. 그래서 메시지에 항상 msg_type 필드를 둔다.
`,thumb:"/images/book-default.svg",title:"[WebSocket] 서버가 브라우저로 실시간 알림 push하기 — msg_type 라우팅과 스택 토스트",url:"/posts/websocket-realtime-push-toast/"},{content:`<h2 id="목록에-잡동사니가-너무-많다">목록에 잡동사니가 너무 많다</h2>
<p>네트워크 설정 화면에서 NIC(랜카드)를 고르게 했는데, 목록에 <code>eth0</code> 같은 진짜 유선 카드 말고도 <strong><code>docker0</code>, <code>veth...</code>, <code>br-...</code>, <code>tailscale0</code>, <code>wlan0</code></strong> 같은 게 잔뜩 떴다. Docker 브리지, 컨테이너 가상 인터페이스, VPN, 무선랜.. 사용자가 골라야 하는 건 <strong>물리 유선 NIC 하나</strong>인데 잡동사니에 파묻힌 것.</p>
<p>그래서 &ldquo;진짜 물리 인터페이스만&rdquo; 남기는 필터가 필요했다. 방법은 두 가지인데, 하나는 실용적이고 하나는 더 견고하다.</p>
<h2 id="방법-1-접두어-블록리스트-빠르고-실용적">방법 1: 접두어 블록리스트 (빠르고 실용적)</h2>
<p>가상·무선 인터페이스는 이름 접두어가 대체로 정해져 있다. 그걸 걸러내는 방식.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span><span class="lnt">7
</span><span class="lnt">8
</span><span class="lnt">9
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="n">IGNORE_PREFIXES</span> <span class="o">=</span> <span class="p">(</span>
</span></span><span class="line"><span class="cl">    <span class="s2">&#34;lo&#34;</span><span class="p">,</span> <span class="s2">&#34;docker&#34;</span><span class="p">,</span> <span class="s2">&#34;br-&#34;</span><span class="p">,</span> <span class="s2">&#34;veth&#34;</span><span class="p">,</span> <span class="s2">&#34;virbr&#34;</span><span class="p">,</span>   <span class="c1"># 루프백 · Docker · 브리지 · 가상 페어</span>
</span></span><span class="line"><span class="cl">    <span class="s2">&#34;tailscale&#34;</span><span class="p">,</span> <span class="s2">&#34;wg&#34;</span><span class="p">,</span> <span class="s2">&#34;tun&#34;</span><span class="p">,</span> <span class="s2">&#34;tap&#34;</span><span class="p">,</span> <span class="s2">&#34;zt&#34;</span><span class="p">,</span> <span class="s2">&#34;ppp&#34;</span><span class="p">,</span>  <span class="c1"># VPN · 터널</span>
</span></span><span class="line"><span class="cl">    <span class="s2">&#34;wl&#34;</span><span class="p">,</span> <span class="s2">&#34;wifi&#34;</span><span class="p">,</span>                              <span class="c1"># 무선랜</span>
</span></span><span class="line"><span class="cl"><span class="p">)</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="k">def</span> <span class="nf">is_ignored</span><span class="p">(</span><span class="n">name</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">    <span class="n">base</span> <span class="o">=</span> <span class="n">name</span><span class="o">.</span><span class="n">split</span><span class="p">(</span><span class="s2">&#34;:&#34;</span><span class="p">)[</span><span class="mi">0</span><span class="p">]</span>          <span class="c1"># eth0:1 같은 alias 는 &#39;:&#39; 앞 원본 이름 기준</span>
</span></span><span class="line"><span class="cl">    <span class="k">return</span> <span class="n">base</span><span class="o">.</span><span class="n">startswith</span><span class="p">(</span><span class="n">IGNORE_PREFIXES</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>간단하고 대부분 잘 걸러진다. 다만 <strong>새로운 가상 인터페이스 종류가 나오면 목록에서 놓칠 수 있다</strong>는 게 약점이다. <code>eth0:1</code> 같은 alias는 <code>:</code> 앞의 원본 이름으로 판단해야 한다는 것도 놓치기 쉽다.</p>
<h2 id="방법-2-sysclassnet-으로-판별-더-견고">방법 2: /sys/class/net 으로 판별 (더 견고)</h2>
<p>이름에 의존하지 않고 커널이 알려주는 정보를 쓰는 방법. 리눅스는 <code>/sys/class/net/&lt;이름&gt;</code>을 <strong>심볼릭 링크</strong>로 두는데, 가상 인터페이스는 이게 <code>.../devices/virtual/...</code>을 가리킨다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="c1"># virtual 이면 가상(veth, docker, bridge, tun, lo ...) → 제외</span>
</span></span><span class="line"><span class="cl">readlink -f /sys/class/net/eth0    <span class="c1"># /sys/devices/pci.../net/eth0   ← 물리</span>
</span></span><span class="line"><span class="cl">readlink -f /sys/class/net/docker0 <span class="c1"># /sys/devices/virtual/net/docker0 ← 가상</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>이 한 방으로 docker·veth·bridge·tun·tap·loopback이 <strong>한꺼번에</strong> 걸러진다. 이름 목록을 관리할 필요가 없어서 새 종류가 나와도 자동으로 잡힌다. 무선은 <code>/sys/class/net/&lt;이름&gt;/wireless</code>(또는 <code>phy80211</code>) 존재로 구분한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="kn">import</span> <span class="nn">os</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="k">def</span> <span class="nf">is_physical_wired</span><span class="p">(</span><span class="n">name</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">    <span class="n">path</span> <span class="o">=</span> <span class="sa">f</span><span class="s2">&#34;/sys/class/net/</span><span class="si">{</span><span class="n">name</span><span class="si">}</span><span class="s2">&#34;</span>
</span></span><span class="line"><span class="cl">    <span class="c1"># 1) 가상 인터페이스 제외</span>
</span></span><span class="line"><span class="cl">    <span class="k">if</span> <span class="s2">&#34;/devices/virtual/&#34;</span> <span class="ow">in</span> <span class="n">os</span><span class="o">.</span><span class="n">path</span><span class="o">.</span><span class="n">realpath</span><span class="p">(</span><span class="n">path</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">        <span class="k">return</span> <span class="kc">False</span>
</span></span><span class="line"><span class="cl">    <span class="c1"># 2) 무선 제외</span>
</span></span><span class="line"><span class="cl">    <span class="k">if</span> <span class="n">os</span><span class="o">.</span><span class="n">path</span><span class="o">.</span><span class="n">exists</span><span class="p">(</span><span class="sa">f</span><span class="s2">&#34;</span><span class="si">{</span><span class="n">path</span><span class="si">}</span><span class="s2">/wireless&#34;</span><span class="p">)</span> <span class="ow">or</span> <span class="n">os</span><span class="o">.</span><span class="n">path</span><span class="o">.</span><span class="n">exists</span><span class="p">(</span><span class="sa">f</span><span class="s2">&#34;</span><span class="si">{</span><span class="n">path</span><span class="si">}</span><span class="s2">/phy80211&#34;</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">        <span class="k">return</span> <span class="kc">False</span>
</span></span><span class="line"><span class="cl">    <span class="k">return</span> <span class="kc">True</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>개인적으로는 <strong>방법 2를 추천</strong>한다. 이름 규칙은 배포판·드라이버마다 바뀔 수 있지만, &ldquo;virtual이냐&quot;는 커널 기준이라 훨씬 안정적이다. 다만 구형 코드가 <code>ifconfig</code> 파싱으로 이름만 들고 있는 상황이면, 우선 방법 1로 막고 점진적으로 방법 2로 옮기는 것도 현실적인 선택이다. (나는 서버·클라이언트 양쪽에 같은 블록리스트를 두는 이중 방어부터 넣고 갔다.)</p>
<h2 id="필터링하면서-딸려온-버그-둘">필터링하면서 딸려온 버그 둘</h2>
<p>필터를 넣을 때, 필터 자체보다 <strong>주변 로직</strong>에서 문제가 났다. 비슷한 상황이면 같이 점검해볼 만하다.</p>
<p><strong>① 기본 선택값이 걸러질 NIC로 잡힌다.</strong> &ldquo;목록의 첫 번째를 기본 선택&quot;으로 두는 코드가 <strong>필터 바깥</strong>에 있으면, 걸러져야 할 가상 NIC가 먼저 나올 때 그게 기본값으로 잡힌다. 기본값 대입을 <strong>필터 안쪽</strong>으로 옮겨야 한다.</p>
<p><strong>② 남는 게 0개일 때 뒤가 터진다.</strong> 필터가 너무 세서 표시할 NIC가 하나도 안 남으면, &ldquo;선택된 NIC로 뭔가 하는&rdquo; 후속 코드가 빈 값으로 예외를 던진다. 그리고 그 예외 때문에 <strong>그 뒤 초기화(예: 다른 설정 로드)까지 통째로 건너뛴다.</strong> &ldquo;빈 목록&quot;을 정상 케이스로 보고 가드를 넣어야 한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="n">nics</span> <span class="o">=</span> <span class="p">[</span><span class="n">n</span> <span class="k">for</span> <span class="n">n</span> <span class="ow">in</span> <span class="n">all_nics</span> <span class="k">if</span> <span class="n">is_physical_wired</span><span class="p">(</span><span class="n">n</span><span class="p">)]</span>
</span></span><span class="line"><span class="cl"><span class="n">default</span> <span class="o">=</span> <span class="n">nics</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="k">if</span> <span class="n">nics</span> <span class="k">else</span> <span class="s2">&#34;&#34;</span>    <span class="c1"># 필터 결과에서 기본값, 없으면 빈 값</span>
</span></span><span class="line"><span class="cl"><span class="k">if</span> <span class="n">default</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">    <span class="n">select</span><span class="p">(</span><span class="n">default</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="c1"># else: 빈 목록도 정상 흐름으로 (뒤 초기화가 안 끊기게)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="정리">정리</h2>
<ul>
<li>NIC 목록에서 <strong>물리 유선만</strong> 남기려면 가상(docker/veth/br/tun/lo)·무선(wl)을 걸러야 한다.</li>
<li><strong>접두어 블록리스트</strong>는 빠르지만 새 종류를 놓칠 수 있다. <code>eth0:1</code> alias는 <code>:</code> 앞 이름 기준.</li>
<li><strong><code>/sys/class/net/&lt;이름&gt;</code>이 <code>virtual</code>을 가리키는지</strong>로 보면 이름에 안 기대고 견고하게 걸러진다. 무선은 <code>wireless</code>/<code>phy80211</code>로.</li>
<li>필터 넣을 땐 <strong>기본 선택값을 필터 안쪽</strong>에서 잡고, <strong>빈 목록을 정상 케이스로</strong> 가드.</li>
</ul>
<p>필터 조건 한 줄보다, 그 필터가 바꾼 &ldquo;기본값&quot;과 &ldquo;빈 목록&rdquo; 처리가 더 자주 사고를 냈다. 목록을 거를 땐 <strong>거른 뒤의 흐름</strong>까지 같이 봐야 한다는 걸 배운 작업이었다.</p>
`,date:"2026.09.18",summary:`목록에 잡동사니가 너무 많다 네트워크 설정 화면에서 NIC(랜카드)를 고르게 했는데, 목록에 eth0 같은 진짜 유선 카드 말고도 docker0, veth..., br-..., tailscale0, wlan0 같은 게 잔뜩 떴다. Docker 브리지, 컨테이너 가상 인터페이스, VPN, 무선랜.. 사용자가 골라야 하는 건 물리 유선 NIC 하나인데 잡동사니에 파묻힌 것.
그래서 “진짜 물리 인터페이스만” 남기는 필터가 필요했다. 방법은 두 가지인데, 하나는 실용적이고 하나는 더 견고하다.
방법 1: 접두어 블록리스트 (빠르고 실용적) 가상·무선 인터페이스는 이름 접두어가 대체로 정해져 있다. 그걸 걸러내는 방식.
`,thumb:"/images/book-default.svg",title:"[Linux] 목록에서 진짜 물리 NIC만 걸러내기 — docker·veth·wifi 제외",url:"/posts/linux-filter-physical-nic/"},{content:`<h2 id="루트-디스크가-꽉-찼다">루트 디스크가 꽉 찼다</h2>
<p>Docker는 이미지·컨테이너·볼륨을 전부 <code>/var/lib/docker</code> 아래에 쌓는다. 이게 보통 루트 디스크(<code>/</code>)에 있는데, 이미지 몇 개 받고 빌드 좀 하다 보면 순식간에 수십~수백 GB로 불어난다. 루트 디스크는 작게 잡아두는 경우가 많아서.. 어느 날 <code>no space left on device</code>를 보게 된다.</p>
<p>해결은 <strong>Docker의 저장 위치를 큰 별도 디스크(예: <code>/data</code>)로 옮기는 것</strong>이다. 방법이 두 가지 있는데, 옮기는 과정에서 놓치기 쉬운 것들이 있어 정리해둔다.</p>
<h2 id="방법-1-data-root-docker-네이티브-추천">방법 1: data-root (Docker 네이티브, 추천)</h2>
<p>Docker가 공식으로 지원하는 방법. <code>/etc/docker/daemon.json</code>에 저장 위치만 알려주면 된다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-json" data-lang="json"><span class="line"><span class="cl"><span class="p">{</span>
</span></span><span class="line"><span class="cl">  <span class="nt">&#34;data-root&#34;</span><span class="p">:</span> <span class="s2">&#34;/data/docker&#34;</span>
</span></span><span class="line"><span class="cl"><span class="p">}</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>개인적으로 이 방식을 추천한다. Docker가 이해하는 설정이라 깔끔하고, <code>docker info</code>에서 <code>Docker Root Dir</code>로 바로 확인된다.</p>
<h2 id="방법-2-bind-mount">방법 2: bind mount</h2>
<p><code>/var/lib/docker</code> 경로는 그대로 두되, 그 경로에 다른 디스크를 bind mount로 얹는 방식. Docker 설정은 안 건드린다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">mount --bind /data/docker /var/lib/docker
</span></span><span class="line"><span class="cl"><span class="c1"># 영구 적용은 /etc/fstab 에: /data/docker /var/lib/docker none bind 0 0</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>둘 다 되지만, &ldquo;Docker가 아는 경로&quot;를 원하면 1번, &ldquo;경로는 유지하고 저장만 다른 디스크&quot;면 2번이다.</p>
<h2 id="이동-절차--순서와-rsync-옵션이-핵심">이동 절차 — 순서와 rsync 옵션이 핵심</h2>
<p>어느 방법이든 <strong>기존 데이터를 먼저 옮겨야</strong> 한다. 여기서 두 가지가 중요하다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="c1"># 1. Docker 완전 정지 (데몬까지)</span>
</span></span><span class="line"><span class="cl">sudo systemctl stop docker docker.socket
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 2. 데이터 복사 — 옵션이 중요하다</span>
</span></span><span class="line"><span class="cl">sudo rsync -aHAX /var/lib/docker/ /data/docker/
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 3. data-root 설정(방법1) 또는 bind mount(방법2) 적용</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 4. 재기동</span>
</span></span><span class="line"><span class="cl">sudo systemctl start docker
</span></span></code></pre></td></tr></table>
</div>
</div><p><code>rsync</code>의 <strong><code>-aHAX</code></strong> 가 포인트다.</p>
<ul>
<li><code>-a</code> : 권한·소유·타임스탬프 보존</li>
<li><strong><code>-H</code> : 하드링크 보존</strong> — overlay2 스토리지 드라이버는 레이어들끼리 <strong>하드링크를 잔뜩</strong> 쓴다. 이걸 보존 안 하면 복사본 용량이 부풀거나 레이어가 깨질 수 있다.</li>
<li><code>-A</code> : ACL, <code>-X</code> : 확장 속성(xattr) 보존</li>
</ul>
<p>그냥 <code>cp -a</code>나 <code>rsync -a</code>로 옮기면 하드링크가 풀려서 문제가 생길 수 있으니, <code>-aHAX</code>는 꼭 챙기는 게 좋다.</p>
<h2 id="검증하고-될-때까지-원본은-남겨둔다">검증하고, 될 때까지 원본은 남겨둔다</h2>
<p>옮긴 뒤 <strong>바로 지우지 말고</strong> 원본을 <code>.old</code>로 남긴 채 확인부터 한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">docker image ls -a <span class="p">|</span> wc -l        <span class="c1"># 이미지가 예전 개수만큼 있는지</span>
</span></span><span class="line"><span class="cl">docker info <span class="p">|</span> grep <span class="s2">&#34;Docker Root Dir&#34;</span>   <span class="c1"># /data/docker 로 바뀌었는지</span>
</span></span><span class="line"><span class="cl">findmnt /var/lib/docker           <span class="c1"># (bind 방식이면) 마운트 확인</span>
</span></span><span class="line"><span class="cl">du -sh /data/docker               <span class="c1"># 수십~수백 GB 나와야 정상</span>
</span></span><span class="line"><span class="cl">df -h /var/lib /data
</span></span></code></pre></td></tr></table>
</div>
</div><p>이미지 개수가 맞고 용량이 제대로 잡히면 성공이다. 그때 원본(<code>/var/lib/docker.old</code> 등)을 지운다. 이동 중 실패에 대비해 <strong>rsync 실패 시 롤백</strong>하는 가드를 스크립트에 넣어두면 마음이 편하다.</p>
<h2 id="삽질-pipefail-때문에-검증이-깨졌다">삽질: pipefail 때문에 검증이 깨졌다</h2>
<p>이동 스크립트에 이미지 개수를 세는 안전장치를 넣었는데, 이런 코드였다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="nb">set</span> -euo pipefail
</span></span><span class="line"><span class="cl"><span class="nv">IMG_BEFORE</span><span class="o">=</span><span class="k">$(</span>docker image ls -aq 2&gt;/dev/null <span class="p">|</span> wc -l <span class="o">||</span> <span class="nb">echo</span> -1<span class="k">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>의도는 &ldquo;docker가 안 떠 있으면 <code>-1</code>로 두고 이 검증은 건너뛴다&quot;였다. 그런데 나중에 <code>[ &quot;$IMG_BEFORE&quot; -ge 0 ]</code>에서 <strong><code>integer expression expected</code></strong> 에러가 났다.</p>
<p>원인은 **<code>pipefail</code>**이었다. docker 데몬이 아직 안 떠서 <code>docker image ls -aq</code>가 실패해도 <code>wc -l</code>은 성공하며 <code>0</code>을 출력한다. 그런데 pipefail이 파이프라인 전체를 실패로 보니까 <code>|| echo -1</code>이 <strong>추가로</strong> 실행돼서 <code>-1</code>도 출력됐다. 결과적으로 변수엔 <code>0</code>도 <code>-1</code>도 아닌 <strong><code>&quot;0\\n-1&quot;</code> 두 줄</strong>이 들어갔고, 그걸 정수 비교하려니 터진 것.</p>
<p>파이프라인을 <code>if</code> 조건으로 옮기면 pipefail 실패가 <code>else</code>로 깔끔히 빠지고 변수엔 항상 한 줄만 들어간다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="k">if</span> <span class="nv">IMG_BEFORE</span><span class="o">=</span><span class="k">$(</span>docker image ls -aq 2&gt;/dev/null <span class="p">|</span> wc -l<span class="k">)</span><span class="p">;</span> <span class="k">then</span>
</span></span><span class="line"><span class="cl">    <span class="nb">echo</span> <span class="s2">&#34;이동 전 이미지 개수: </span><span class="nv">$IMG_BEFORE</span><span class="s2">&#34;</span>
</span></span><span class="line"><span class="cl"><span class="k">else</span>
</span></span><span class="line"><span class="cl">    <span class="nv">IMG_BEFORE</span><span class="o">=</span>-1   <span class="c1"># 데몬이 응답 안 하면 검증 건너뛰기</span>
</span></span><span class="line"><span class="cl"><span class="k">fi</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>(이 <code>pipefail</code> 함정은 <a href="/posts/bash-set-euo-pipefail-traps/">set -euo pipefail 함정 글</a>에서 더 자세히 다뤘다.)</p>
<h2 id="정리">정리</h2>
<ul>
<li><code>/var/lib/docker</code>가 루트를 꽉 채우면 <strong>큰 디스크로 저장 위치를 옮긴다.</strong> <code>daemon.json</code>의 <strong><code>data-root</code></strong>(추천) 또는 <strong>bind mount</strong>.</li>
<li>이동은 <strong>Docker 정지 → <code>rsync -aHAX</code> → 설정/마운트 → 재기동</strong>. <code>-H</code>(하드링크)는 overlay2 때문에 필수.</li>
<li><strong>검증(이미지 개수·<code>Docker Root Dir</code>·용량) 후에 원본을 지운다.</strong> 실패 롤백 가드는 덤.</li>
<li>안전장치 짤 때 <code>cmd | wc -l || echo -1</code> 류는 <strong>pipefail에 물려</strong> 두 줄이 나올 수 있으니 <code>if</code>로 감싸자.</li>
</ul>
<p>디스크 옮기는 단순한 작업 같지만, <code>rsync</code> 옵션 하나(<code>-H</code>)와 pipefail 하나에 발목이 잡혔다. 저장 위치를 옮길 땐 &ldquo;데이터 무결성&quot;과 &ldquo;검증 스크립트&rdquo; 둘 다 신경 써야 한다는 걸 다시 확인했다.</p>
`,date:"2026.09.18",summary:`루트 디스크가 꽉 찼다 Docker는 이미지·컨테이너·볼륨을 전부 /var/lib/docker 아래에 쌓는다. 이게 보통 루트 디스크(/)에 있는데, 이미지 몇 개 받고 빌드 좀 하다 보면 순식간에 수십~수백 GB로 불어난다. 루트 디스크는 작게 잡아두는 경우가 많아서.. 어느 날 no space left on device를 보게 된다.
해결은 Docker의 저장 위치를 큰 별도 디스크(예: /data)로 옮기는 것이다. 방법이 두 가지 있는데, 옮기는 과정에서 놓치기 쉬운 것들이 있어 정리해둔다.
방법 1: data-root (Docker 네이티브, 추천) Docker가 공식으로 지원하는 방법. /etc/docker/daemon.json에 저장 위치만 알려주면 된다.
`,thumb:"/images/book-default.svg",title:"[Docker] 데이터 디렉토리를 다른 디스크로 옮기기 (data-root)",url:"/posts/docker-move-data-root/"},{content:`<h2 id="왜-갈아엎게-됐나">왜 갈아엎게 됐나</h2>
<p>&ldquo;SSH 로그인 N번 실패하면 계정을 잠근다&quot;는 기능을 관리용 웹 UI에서 켜고 끄게 만들어야 했다. 기존 구현을 보니 웹 서버가 <strong><code>/etc/pam.d/common-auth</code> 파일을 직접 텍스트로 편집</strong>하고 있었다. 처음엔 &ldquo;되긴 되네&rdquo; 했는데, 뜯어볼수록 이건 그냥 두면 안 되는 코드였다.. 결국 구조를 통째로 바꿨고, 그 과정에서 배운 걸 정리한다.</p>
<h2 id="common-auth를-직접-건드리면-안-되는-이유">common-auth를 직접 건드리면 안 되는 이유</h2>
<p><code>/etc/pam.d/common-auth</code>를 런타임에 편집하는 방식은 문제가 한둘이 아니었다.</p>
<p><strong>① common-auth는 SSH만이 아니라 모든 걸 잠근다.</strong> 이 파일은 <strong>PAM을 쓰는 모든 서비스 공통</strong>이다. 여기에 잠금을 걸면 SSH뿐 아니라 <code>sudo</code>, <code>su</code>, 콘솔 로그인, cron까지 다 영향을 받는다. &ldquo;SSH만 잠그려던&rdquo; 의도와 범위가 완전히 어긋난다.</p>
<p><strong>② 원격에서 장비를 벽돌로 만들 수 있다.</strong> 잠금 옵션에 <code>even_deny_root</code>가 켜져 있으면, 누가 네트워크에서 root로 브루트포스만 해도 <strong>콘솔의 root까지 잠긴다.</strong> 즉 공격자가 로그인에 성공 못 해도 <strong>원격 DoS로 관리자를 잠가버릴 수 있다.</strong> 현장에 나가야만 풀 수 있는 상황이 원격 공격 한 번으로 만들어지는 것.</p>
<p><strong>③ 낮은 권한이 이 파일을 쓸 수 있으면 그게 곧 권한 상승 통로다.</strong> 웹 서버는 보통 <code>www-data</code> 같은 낮은 권한으로 돈다. 그 계정이 <code>common-auth</code>에 쓸 수 있다는 건, 거기에 <code>auth required pam_permit.so</code> 한 줄만 넣으면 <strong>아무 비밀번호로나 root 로그인이 되는</strong> 문을 열 수 있다는 뜻이다. 잠금 기능을 만들려다 백도어를 만드는 격.</p>
<p><strong>④ 텍스트 파싱은 깨지기 쉽다.</strong> &ldquo;<code>deny</code>가 들어간 줄을 지운다&rdquo; 같은 문자열 매칭은 표준 안전망인 <code>auth requisite pam_deny.so</code> 줄까지 지워버리기도 하고, 처음 켜는 장비엔 백업 파일이 없어서 해제할 때 예외로 죽기도 했다. 무엇보다 <strong>한 번 잠기면 UI에서 풀 방법이 없어서</strong> <code>faillock --reset</code>을 하러 콘솔에 붙어야 했다.</p>
<h2 id="제대로-된-구조--세-가지-원칙">제대로 된 구조 — 세 가지 원칙</h2>
<p>정리하고 나니 해법은 명확했다. <strong>PAM 스택 파일은 런타임에 절대 안 건드린다.</strong> 대신 이렇게 나눴다.</p>
<p><strong>1) 설치할 때 딱 한 번, sshd 전용 스택에만 넣는다.</strong> common-auth가 아니라 <code>/etc/pam.d/sshd</code>에만 faillock 블록을 넣으면, 잠금이 <strong>SSH에만</strong> 적용된다. sudo·콘솔은 안 잠긴다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">auth  required    pam_faillock.so preauth
</span></span><span class="line"><span class="cl">auth  [success=2 default=ignore]  pam_unix.so nullok
</span></span><span class="line"><span class="cl">auth  [default=die] pam_faillock.so authfail
</span></span><span class="line"><span class="cl">auth  sufficient  pam_faillock.so authsucc
</span></span><span class="line"><span class="cl">auth  requisite   pam_deny.so
</span></span><span class="line"><span class="cl">auth  required    pam_permit.so
</span></span></code></pre></td></tr></table>
</div>
</div><p><code>even_deny_root</code>는 <strong>빼는 걸 권장</strong>한다. 콘솔 복구 경로는 남겨둬야 ②번 같은 벽돌 사고를 피한다.</p>
<p><strong>2) 런타임엔 숫자 두 개만 바꾼다.</strong> faillock 옵션을 줄에 안 적으면 pam_faillock이 <code>/etc/security/faillock.conf</code>에서 읽는다. 그래서 런타임 변경은 이 파일을 <strong>통째로 다시 쓰기만</strong> 하면 된다. 파싱도, 백업도, 복구 로직도 없다. 멱등이다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">deny = 5
</span></span><span class="line"><span class="cl">unlock_time = 300
</span></span></code></pre></td></tr></table>
</div>
</div><p>잠금 해제(off)는 <code>deny = 0</code>이다. pam_faillock에서 0은 &ldquo;절대 잠그지 않음&quot;이라, UI의 on/off 토글이 그대로 매핑된다. 그 지긋지긋한 <code>.backup</code> 복사 로직이 통째로 사라졌다.</p>
<p><strong>3) 쓰기는 root 래퍼로만.</strong> 웹 앱이 직접 파일을 만지는 게 아니라, <strong>숫자 두 개만 받아서 검증 후 파일을 쓰는 작은 root 스크립트</strong>를 두고 sudoers로 그것만 호출하게 한다. 웹 앱은 파일 경로도 내용도 못 바꾼다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="cp">#!/bin/bash
</span></span></span><span class="line"><span class="cl"><span class="c1"># /usr/local/sbin/ssh-lock  (root:root 0755)  — stdin 으로 &#34;deny unlock_time&#34; 두 숫자만 받는다</span>
</span></span><span class="line"><span class="cl"><span class="nb">set</span> -u
</span></span><span class="line"><span class="cl"><span class="nv">IFS</span><span class="o">=</span> <span class="nb">read</span> -r deny unlock rest
</span></span><span class="line"><span class="cl"><span class="o">[</span> -n <span class="s2">&#34;</span><span class="si">\${</span><span class="nv">rest</span><span class="k">:-</span><span class="si">}</span><span class="s2">&#34;</span> <span class="o">]</span> <span class="o">&amp;&amp;</span> <span class="o">{</span> <span class="nb">echo</span> <span class="s2">&#34;인자 초과&#34;</span> &gt;<span class="p">&amp;</span>2<span class="p">;</span> <span class="nb">exit</span> 2<span class="p">;</span> <span class="o">}</span>
</span></span><span class="line"><span class="cl"><span class="k">case</span> <span class="s2">&#34;</span><span class="nv">$deny$unlock</span><span class="s2">&#34;</span> in *<span class="o">[</span>!0-9<span class="o">]</span>*<span class="o">)</span> <span class="nb">echo</span> <span class="s2">&#34;숫자만&#34;</span> &gt;<span class="p">&amp;</span>2<span class="p">;</span> <span class="nb">exit</span> 3<span class="p">;;</span> <span class="k">esac</span>
</span></span><span class="line"><span class="cl"><span class="o">[</span> <span class="s2">&#34;</span><span class="nv">$deny</span><span class="s2">&#34;</span> -le <span class="m">10</span> <span class="o">]</span> <span class="o">&amp;&amp;</span> <span class="o">[</span> <span class="s2">&#34;</span><span class="nv">$unlock</span><span class="s2">&#34;</span> -le <span class="m">3600</span> <span class="o">]</span> <span class="o">||</span> <span class="o">{</span> <span class="nb">echo</span> <span class="s2">&#34;범위 초과&#34;</span> &gt;<span class="p">&amp;</span>2<span class="p">;</span> <span class="nb">exit</span> 3<span class="p">;</span> <span class="o">}</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="nb">printf</span> <span class="s1">&#39;deny = %s\\nunlock_time = %s\\n&#39;</span> <span class="s2">&#34;</span><span class="nv">$deny</span><span class="s2">&#34;</span> <span class="s2">&#34;</span><span class="nv">$unlock</span><span class="s2">&#34;</span> &gt; /etc/security/faillock.conf
</span></span><span class="line"><span class="cl"><span class="o">[</span> <span class="s2">&#34;</span><span class="nv">$deny</span><span class="s2">&#34;</span> -eq <span class="m">0</span> <span class="o">]</span> <span class="o">&amp;&amp;</span> faillock --reset   <span class="c1"># 잠금 끄면 기존 카운터도 초기화</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>여기에 <code>--reset &lt;계정&gt;</code> 서브커맨드를 하나 더 두면, <strong>&ldquo;잠긴 계정 풀기&rdquo; 버튼</strong>을 UI에 만들 수 있다. 잠겨도 원격에서 풀 수 있게 되는 것 — 앞서 콘솔에 붙어야 했던 걸 생각하면 이게 실무에서 꽤 컸다. 잠긴 계정은 <code>faillock --user &lt;계정&gt; --reset</code>으로 푼다.</p>
<h2 id="포트-변경은-자기-발등-찍기-조심">포트 변경은 &ldquo;자기 발등 찍기&rdquo; 조심</h2>
<p>로그인 잠금과 함께 SSH 포트도 자주 바꾸는데, 여기서 제일 흔한 사고가 <strong>자기 세션을 잠가버리는 것</strong>이다. 순서를 지키면 된다.</p>
<ol>
<li><code>sshd_config</code>에서 <code>Port</code>를 바꾸기 <strong>전에</strong>, 방화벽에서 <strong>새 포트를 먼저 열어둔다.</strong> (<code>ufw allow &lt;새포트&gt;/tcp</code> 등)</li>
<li><code>sshd -t</code>로 설정 문법을 검증하고 restart.</li>
<li><strong>기존 세션은 끊지 말고</strong>, 새 포트로 새 세션이 붙는지 확인한 다음에 옛 포트를 닫는다.</li>
</ol>
<p>방화벽을 안 열고 포트만 바꾸면, restart하는 순간 새 포트는 막혀 있고 옛 포트는 닫혀서 아무도 못 들어간다. 원격 장비면 그대로 현장 출동이다.. 나는 &ldquo;새 포트 열기 → 확인 → 옛 포트 닫기&rdquo; 순서를 체크리스트로 박아뒀다.</p>
<h2 id="대안-계정-잠금이냐-ip-차단이냐">대안: 계정 잠금이냐, IP 차단이냐</h2>
<p>방식을 고를 때 이 갈림길을 먼저 정하는 게 좋다.</p>
<ul>
<li><strong>계정 잠금(faillock)</strong> — &ldquo;N회 실패하면 그 <strong>계정</strong>을 잠근다&rdquo;. 보안 요구사항 문서에 &ldquo;계정 잠금&quot;으로 못박혀 있으면 이걸 써야 한다. 단 위에서 본 것처럼 콘솔까지 잠길 위험을 설계로 막아야 한다.</li>
<li><strong>fail2ban(IP 차단)</strong> — 계정이 아니라 <strong>공격 IP를 차단</strong>한다. 그래서 콘솔·sudo가 절대 안 잠기고, 공격자가 남의 계정을 잠가버리는 DoS도 원천 불가능하다. 운영상 제일 안전하다. 전용 설정 파일 하나(<code>maxretry</code>/<code>bantime</code>)만 두면 배포판 파일도 안 건드린다. 다만 데몬·패키지가 추가되고(오프라인 장비면 deb 번들 필요), &ldquo;계정 잠금&quot;이 요구사항이면 IP 차단으로는 대체가 안 될 수 있다.</li>
</ul>
<p>개인적으로 <strong>요구사항이 &ldquo;무단 접근 차단&rdquo; 수준이면 fail2ban을, 명시적으로 &ldquo;계정 잠금&quot;이면 faillock</strong>을 쓰는 게 맞다고 본다.</p>
<p>참고로 <code>sshd_config</code>만으로 해결하려는 시도도 해봤는데 부족했다. <code>MaxAuthTries</code>는 <strong>한 연결당</strong> 시도 제한일 뿐 시간 잠금이 아니고, 시간 페널티를 주는 <code>PerSourcePenalties</code>는 OpenSSH 9.8부터라 구버전(예: 8.9)에선 못 쓴다.</p>
<h2 id="정리">정리</h2>
<ul>
<li><strong><code>/etc/pam.d/common-auth</code>를 런타임에 편집하지 마라.</strong> 전 서비스에 영향 + 원격 DoS 벽돌 + 권한 상승 통로 + 파싱 취약.</li>
<li>잠금은 <strong>설치 때 <code>/etc/pam.d/sshd</code>에만 한 번</strong> 넣고, 런타임엔 <strong><code>/etc/security/faillock.conf</code>의 <code>deny</code>/<code>unlock_time</code> 두 숫자만</strong> 바꾼다. <code>deny=0</code> = 잠금 해제.</li>
<li>파일 쓰기는 <strong>숫자만 받는 root 래퍼 + sudoers</strong>로. <code>--reset</code>으로 원격에서 계정 잠금 해제까지.</li>
<li><strong>포트 변경은 방화벽 먼저 열고</strong>, 새 세션 확인 후 옛 포트를 닫는다.</li>
<li>계정 잠금(faillock)과 IP 차단(fail2ban)은 목적이 다르다. 요구사항부터 정하자.</li>
</ul>
<p>보안 기능을 만들 때 제일 무서운 건 <strong>그 기능 자체가 새 구멍을 뚫는 것</strong>이었다. &ldquo;잠금을 건다&quot;는 단순해 보이는 요구가, 잘못 구현하면 백도어이자 원격 벽돌 스위치가 될 수 있다는 걸 이번에 제대로 배웠다.</p>
`,date:"2026.09.18",summary:`왜 갈아엎게 됐나 “SSH 로그인 N번 실패하면 계정을 잠근다"는 기능을 관리용 웹 UI에서 켜고 끄게 만들어야 했다. 기존 구현을 보니 웹 서버가 /etc/pam.d/common-auth 파일을 직접 텍스트로 편집하고 있었다. 처음엔 “되긴 되네” 했는데, 뜯어볼수록 이건 그냥 두면 안 되는 코드였다.. 결국 구조를 통째로 바꿨고, 그 과정에서 배운 걸 정리한다.
common-auth를 직접 건드리면 안 되는 이유 /etc/pam.d/common-auth를 런타임에 편집하는 방식은 문제가 한둘이 아니었다.
① common-auth는 SSH만이 아니라 모든 걸 잠근다. 이 파일은 PAM을 쓰는 모든 서비스 공통이다. 여기에 잠금을 걸면 SSH뿐 아니라 sudo, su, 콘솔 로그인, cron까지 다 영향을 받는다. “SSH만 잠그려던” 의도와 범위가 완전히 어긋난다.
`,thumb:"/images/book-default.svg",title:"[Linux] SSH 로그인 실패 잠금, common-auth 말고 faillock.conf로",url:"/posts/ssh-login-lockout-faillock/"},{content:`<h2 id="rm-한-줄에서-스크립트가-죽었다">rm 한 줄에서 스크립트가 죽었다</h2>
<p><code>set -e</code>가 걸린 셸 스크립트가 자꾸 특정 줄에서 멈췄다. 그 줄은 <code>rm</code>이었다.</p>
<p>원인은 단순했다. <code>rm -f</code>가 아니라 그냥 **<code>rm</code>**을 썼는데, <strong>지울 대상이 없으면 <code>rm</code>은 에러(종료 코드 1)를 낸다.</strong> <code>set -e</code>는 그 non-zero를 보고 거기서 스크립트를 끝내버린다. 파일이 늘 있을 줄 알았는데, 어떤 실행 경로에선 없었던 것.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">rm /tmp/state.lock      <span class="c1"># 파일이 없으면 → rm: cannot remove ...: No such file or directory → exit 1 → set -e 로 종료</span>
</span></span><span class="line"><span class="cl">rm -f /tmp/state.lock   <span class="c1"># -f 면 없어도 조용히 exit 0</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>해결은 <code>-f</code> 하나였다. <code>rm -f</code>(그리고 <code>rm -rf</code>)는 <strong>대상이 없어도 종료 코드 0</strong>이라 <code>set -e</code>에 안 걸린다. &ldquo;없으면 그냥 넘어가기&quot;가 목적이면 <code>rm</code>엔 습관적으로 <code>-f</code>를 붙이는 게 맞다.</p>
<p>여기서 원칙 하나. <strong><code>set -e</code>는 첫 번째 non-zero에서 즉시 종료한다.</strong> 그러니 스크립트가 죽으면 &ldquo;이 줄이 왜 non-zero를 냈지?&ldquo;를 바로 확인하면 된다. 애매하면 <code>set -x</code>로 어디서 멈추는지, 또는 그 명령 뒤에 <code>echo $?</code>로 종료 코드를 찍어본다.</p>
<h2 id="개별-명령을-set--e에서-빼는-법">개별 명령을 set -e에서 빼는 법</h2>
<p>&ldquo;이 명령은 실패해도 넘어가도 된다&quot;를 표현하는 방법들.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span><span class="lnt">7
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">cmd <span class="o">||</span> <span class="nb">true</span>      <span class="c1"># 실패해도 무시</span>
</span></span><span class="line"><span class="cl">cmd <span class="o">||</span> :         <span class="c1"># 위와 동일 (: 은 아무것도 안 하는 내장 명령)</span>
</span></span><span class="line"><span class="cl"><span class="k">if</span> cmd<span class="p">;</span> <span class="k">then</span> ... <span class="k">fi</span>   <span class="c1"># 실패를 &#34;조건&#34;으로 사용 → set -e 적용 안 됨</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 파일/디렉토리 존재를 먼저 가드하는 게 의도가 더 분명할 때가 많다</span>
</span></span><span class="line"><span class="cl"><span class="o">[</span> -d /data_temp <span class="o">]</span> <span class="o">&amp;&amp;</span> cp -a /data_temp/. /data/
</span></span><span class="line"><span class="cl">rm -f /some/file      <span class="c1"># 단일 파일 삭제는 -f 하나로 충분 (없어도 조용히 0)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>&ldquo;없으면 그냥 넘어가기&quot;를 원할 땐 <code>rm</code>에 <code>-f</code>를 붙이는 것만으로 대부분 해결된다. <code>if [ -f ... ]</code> 가드를 굳이 또 두지 않아도 된다.</p>
<h2 id="함정-done이-떠도-exit-0이-아닐-수-있다">함정: &ldquo;Done&quot;이 떠도 exit 0이 아닐 수 있다</h2>
<p>이번에 새로 만난 것. 스크립트에서 <code>apt update</code>를 돌리는데, <code>Reading package lists... Done</code>까지 멀쩡히 찍히고선 <strong>그 뒤 단계로 안 넘어가고 스크립트가 끝나버렸다.</strong> &ldquo;다 됐는데 왜 여기서 끝나지?&rdquo; 하고 한참 봤다.</p>
<p>범인은 <code>apt update</code> 자체였다. 화면엔 성공처럼 보여도, 저장소 하나가 접근이 안 되거나 GPG 경고(<code>W: ...</code>) 같은 게 끼면 <strong>apt는 종료 코드를 non-zero로 낸다.</strong> <code>set -e</code>는 출력이 아니라 <strong>종료 코드</strong>만 보므로, &ldquo;Done&rdquo; 뒤에서 조용히 중단된 것.</p>
<p>교훈은 앞과 같다 — <strong>화면상 성공 ≠ exit 0.</strong> 죽는 지점이 애매하면 그 명령 뒤에 <code>echo $?</code>를 찍어 실제 종료 코드부터 확인한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">apt-get update            <span class="c1"># 저장소 경고/일부 실패 시 non-zero → set -e 로 중단</span>
</span></span><span class="line"><span class="cl">apt-get update <span class="o">||</span> <span class="nb">true</span>    <span class="c1"># 경고를 무시하고 계속하려면</span>
</span></span><span class="line"><span class="cl"><span class="c1"># 스크립트에선 apt 보다 apt-get 을 쓰는 게 CLI 안정성 면에서 낫다</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="함정-set--e가-안-걸리는-자리들">함정: set -e가 &ldquo;안 걸리는&rdquo; 자리들</h2>
<p>반대로, <strong>실패해도 스크립트가 안 죽는</strong> 맥락이 있다. 이걸 모르면 &ldquo;왜 이 실패는 그냥 지나가지?&rdquo; 하고 헤맨다. <code>set -e</code>는 다음 위치의 실패를 무시한다.</p>
<ul>
<li><code>if</code>, <code>while</code>, <code>until</code> <strong>조건</strong>에 쓰인 명령</li>
<li><code>&amp;&amp;</code>, <code>||</code>의 <strong>좌변</strong>에 있는 명령 (<code>cmd1 &amp;&amp; cmd2</code>에서 cmd1)</li>
<li><code>!</code>로 부정한 명령</li>
<li><strong>함수가 위 조건 자리에서 호출될 때</strong> — 그 함수 안의 실패도 통째로 무시된다 (이게 특히 함정)</li>
</ul>
<p>즉 <code>check_something &amp;&amp; do_next</code> 처럼 써두면, <code>check_something</code> 안에서 뭐가 터져도 <code>set -e</code>가 안 잡아준다.</p>
<h2 id="함정-pipefail-없으면-파이프-중간-실패가-숨는다">함정: pipefail 없으면 파이프 중간 실패가 숨는다</h2>
<p><code>set -e</code>만 켜면 <strong>파이프라인은 마지막 명령의 종료 코드만</strong> 본다. 중간이 실패해도 마지막이 성공하면 전체가 성공으로 친다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="nb">set</span> -e
</span></span><span class="line"><span class="cl">grep something big.log <span class="p">|</span> sort &gt; out.txt
</span></span><span class="line"><span class="cl"><span class="c1"># grep 이 실패(예: 파일 없음)해도, sort 가 성공하면 스크립트는 안 죽는다</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>그래서 <code>set -o pipefail</code>을 같이 켜서 <strong>파이프 중 하나라도 실패하면 실패로</strong> 잡는다.</p>
<p>그런데 여기 <strong>반대 함정</strong>이 있다. <code>set -e</code> + <code>pipefail</code>을 켠 상태에서 <code>grep</code>이 <strong>매칭을 하나도 못 찾으면 종료 코드 1</strong>을 낸다. 이건 &ldquo;에러&quot;가 아니라 &ldquo;결과 없음&quot;인데도 스크립트가 거기서 죽어버린다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="nb">set</span> -eo pipefail
</span></span><span class="line"><span class="cl"><span class="nv">count</span><span class="o">=</span><span class="k">$(</span>grep -c ERROR app.log<span class="k">)</span>   <span class="c1"># ERROR 가 하나도 없으면 grep 이 1 → 스크립트 종료(!)</span>
</span></span><span class="line"><span class="cl"><span class="nv">count</span><span class="o">=</span><span class="k">$(</span>grep -c ERROR app.log <span class="o">||</span> <span class="nb">true</span><span class="k">)</span>   <span class="c1"># 이렇게 방어</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>&ldquo;매칭 없음&quot;을 정상으로 봐야 하는 grep은 <code>|| true</code>로 감싸는 습관을 들이는 게 좋다.</p>
<h2 id="함정-set--u-와-빈-변수">함정: set -u 와 빈 변수</h2>
<p><code>set -u</code>는 <strong>설정 안 된 변수를 쓰면 에러</strong>를 낸다. 오타나 인자 누락을 잡아줘서 좋지만, &ldquo;없을 수도 있는 값&quot;엔 기본값을 줘야 한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="nb">set</span> -u
</span></span><span class="line"><span class="cl"><span class="nb">echo</span> <span class="s2">&#34;</span><span class="nv">$UNDEFINED</span><span class="s2">&#34;</span>        <span class="c1"># 에러 → 종료</span>
</span></span><span class="line"><span class="cl"><span class="nb">echo</span> <span class="s2">&#34;</span><span class="si">\${</span><span class="nv">UNDEFINED</span><span class="k">:-</span><span class="nv">기본</span><span class="si">}</span><span class="s2">&#34;</span> <span class="c1"># 안전</span>
</span></span><span class="line"><span class="cl"><span class="nb">echo</span> <span class="s2">&#34;</span><span class="si">\${</span><span class="nv">1</span><span class="k">:-</span><span class="si">}</span><span class="s2">&#34;</span>            <span class="c1"># 인자가 없을 수 있으면 이렇게</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="함정-local-이-exit-코드를-덮는다">함정: local 이 exit 코드를 덮는다</h2>
<p>이건 알기 전엔 절대 못 잡는다. 함수 안에서 <code>local x=$(cmd)</code>로 쓰면, <strong><code>local</code> 자체가 성공(0)을 반환</strong>하기 때문에 <code>cmd</code>가 실패해도 그 종료 코드가 덮여서 <code>set -e</code>가 못 잡는다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span><span class="lnt">7
</span><span class="lnt">8
</span><span class="lnt">9
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">foo<span class="o">()</span> <span class="o">{</span>
</span></span><span class="line"><span class="cl">    <span class="nb">local</span> <span class="nv">x</span><span class="o">=</span><span class="k">$(</span>might_fail<span class="k">)</span>    <span class="c1"># might_fail 이 실패해도 local 이 0 → set -e 안 걸림</span>
</span></span><span class="line"><span class="cl">    <span class="c1"># ...</span>
</span></span><span class="line"><span class="cl"><span class="o">}</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl">foo<span class="o">()</span> <span class="o">{</span>
</span></span><span class="line"><span class="cl">    <span class="nb">local</span> x                  <span class="c1"># 선언과</span>
</span></span><span class="line"><span class="cl">    <span class="nv">x</span><span class="o">=</span><span class="k">$(</span>might_fail<span class="k">)</span>          <span class="c1"># 대입을 분리하면 might_fail 의 실패가 살아난다</span>
</span></span><span class="line"><span class="cl"><span class="o">}</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="정리">정리</h2>
<p>스크립트 맨 위에 <code>set -euo pipefail</code>을 깔되, 각각이 언제 &ldquo;안 걸리는지&quot;까지 알아야 진짜 방어가 된다.</p>
<ul>
<li><code>set -e</code>는 <strong>첫 non-zero에서 즉시 종료</strong> — 죽으면 그 줄이 낸 <strong>종료 코드</strong>를 <code>echo $?</code>/<code>set -x</code>로 확인.</li>
<li>그냥 <code>rm</code>은 <strong>대상 없으면 exit 1</strong> → <code>rm -f</code>/<code>rm -rf</code>로. (<code>-f</code>면 없어도 exit 0)</li>
<li><strong>화면상 성공 ≠ exit 0</strong> — <code>apt update</code>처럼 &ldquo;Done&rdquo; 찍고도 non-zero를 내는 명령이 있다. 계속하려면 <code>|| true</code>.</li>
<li>개별 면제는 <code>|| true</code>, <code>|| :</code>, <code>if cmd; then</code>, 존재 가드로.</li>
<li><code>if</code>·<code>&amp;&amp;/||</code>·함수 조건 자리의 실패는 <strong>set -e가 안 잡는다.</strong></li>
<li><strong>pipefail</strong> 없으면 파이프 중간 실패가 숨고, 있으면 **매칭 없는 grep(exit 1)**에 물리니 <code>|| true</code>.</li>
<li><code>set -u</code>엔 <code>\${VAR:-기본}</code>, <code>local x=$(cmd)</code>는 <strong>선언·대입 분리</strong>.</li>
</ul>
<p><code>set -euo pipefail</code>은 켜두면 안심되는 주문 같지만, 사실은 <strong>&ldquo;어디서 걸리고 어디서 안 걸리는지&quot;를 알아야 쓸모가 있는</strong> 도구였다. <code>rm</code> 한 줄에 멈추고, <code>apt update</code>가 &ldquo;Done&quot;까지 찍고도 스크립트를 끝내는 걸 겪고 나서야, set -e가 보는 건 화면이 아니라 <strong>종료 코드</strong>라는 걸 몸에 새겼다.</p>
`,date:"2026.09.18",summary:`rm 한 줄에서 스크립트가 죽었다 set -e가 걸린 셸 스크립트가 자꾸 특정 줄에서 멈췄다. 그 줄은 rm이었다.
원인은 단순했다. rm -f가 아니라 그냥 **rm**을 썼는데, 지울 대상이 없으면 rm은 에러(종료 코드 1)를 낸다. set -e는 그 non-zero를 보고 거기서 스크립트를 끝내버린다. 파일이 늘 있을 줄 알았는데, 어떤 실행 경로에선 없었던 것.
1 2 rm /tmp/state.lock # 파일이 없으면 → rm: cannot remove ...: No such file or directory → exit 1 → set -e 로 종료 rm -f /tmp/state.lock # -f 면 없어도 조용히 exit 0 해결은 -f 하나였다. rm -f(그리고 rm -rf)는 대상이 없어도 종료 코드 0이라 set -e에 안 걸린다. “없으면 그냥 넘어가기"가 목적이면 rm엔 습관적으로 -f를 붙이는 게 맞다.
`,thumb:"/images/book-default.svg",title:"[Bash] set -euo pipefail 함정 — rm과 apt가 조용히 스크립트를 죽일 때",url:"/posts/bash-set-euo-pipefail-traps/"},{content:`<h2 id="왜-파티셔닝을-보게-됐나">왜 파티셔닝을 보게 됐나</h2>
<p>로그·이벤트처럼 계속 쌓이기만 하는 테이블이 있으면, 언젠가 &ldquo;이거 너무 커졌는데..&rdquo; 하는 순간이 온다. 조회도 느려지고, 오래된 데이터 지우자니 <code>DELETE</code>가 한참 걸리고 락도 무섭다. 이때 꺼내는 카드가 <strong>파티셔닝</strong>이다. 테이블을 논리적으로 한 덩어리로 두되, 내부적으로는 구간별로 잘라 저장해서 &ldquo;특정 구간만 빠르게 조회하거나 통째로 버리는&rdquo; 걸 가능하게 하는 것.</p>
<p>개념은 쉬운데 막상 하려니 규칙과 함정이 제법 있었다. 겪은 순서대로 정리해둔다. (MySQL/MariaDB 기준)</p>
<h2 id="규칙-하나만-기억하면-된다--파티션-키는-pk에-포함돼야-한다">규칙 하나만 기억하면 된다 — 파티션 키는 PK에 포함돼야 한다</h2>
<p>파티셔닝의 가장 중요한 규칙은 이거 하나다.</p>
<blockquote>
<p><strong>파티션 키로 쓰는 컬럼은 테이블의 모든 UNIQUE/PRIMARY KEY에 포함되어야 한다.</strong></p>
</blockquote>
<p><code>seq</code>(auto_increment)가 PK인 테이블을 <code>seq</code> 기준으로 나누는 건, 이 조건을 이미 만족하니 바로 된다. auto_increment는 값이 단조 증가라 <strong>RANGE 파티셔닝의 교과서 같은 후보</strong>다.</p>

</div><h2 id="seq로-나눌까-날짜로-나눌까">seq로 나눌까, 날짜로 나눌까</h2>
<p>여기서 한 번 고민하게 된다. 결론부터 말하면 <strong>&ldquo;무엇을 기준으로 데이터를 지울 거냐&quot;로 정하면 된다.</strong></p>
<ul>
<li>그냥 오래된 것부터 순서대로 비우면 되면 → <strong>seq 기준</strong>. PK라 조건도 이미 충족하고 관리가 단순하다.</li>
<li><strong>&ldquo;30일/6개월 지난 데이터 삭제&rdquo; 같은 보관정책</strong>이 있으면 → <strong>날짜 기준</strong>. 개인적으로 보관정책이 있으면 무조건 날짜 기준을 추천한다. 나중에 <code>DROP PARTITION</code> 한 줄로 기간별로 버릴 수 있어서 훨씬 편하다.</li>
</ul>
<p>문제는 날짜로 나누려면 <strong>날짜 컬럼도 PK에 들어가야</strong> 한다는 것. &ldquo;그럼 날짜 컬럼이 유일하지 않은데 PK가 되나?&rdquo; 싶었는데, 여기서 헷갈리기 쉬운 포인트가 하나 있다.</p>
<blockquote>
<p><strong>복합 PK는 &ldquo;컬럼 조합&quot;이 유일하면 된다. 각 컬럼이 개별적으로 유일할 필요는 없다.</strong></p>
</blockquote>
<p><code>server_processing_time</code>이 초 단위로 겹쳐도, <code>seq</code>가 auto_increment라 항상 다르니 <code>(seq, server_processing_time)</code> 조합은 100% 유일하다. 그러니 복합 PK로 묶는 데 아무 지장이 없다.</p>

</div><p>참고로 <code>TO_DAYS()</code> 같은 함수 대신 <strong><code>RANGE COLUMNS</code></strong> 로 DATETIME을 직접 비교하면 <code>VALUES LESS THAN ('2026-04-01 ...')</code>처럼 읽혀서 훨씬 가독성이 좋다. 나는 이 방식을 선호한다.</p>
<h2 id="auto_increment-pk를-바꿀-때-걸리는-것">auto_increment PK를 바꿀 때 걸리는 것</h2>
<p>기존 테이블(seq 단독 PK)을 복합 PK로 바꾸려고 <code>DROP PRIMARY KEY</code> 부터 날리면 이런 에러가 난다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">Incorrect table definition; there can be only one auto column and it must be defined as a key
</span></span></code></pre></td></tr></table>
</div>
</div><p>auto_increment 컬럼은 <strong>항상 키의 일부여야</strong> 하는데, PK를 먼저 떼는 순간 <code>seq</code>가 키에서 빠져버리기 때문이다. 그래서 <strong>한 ALTER 문에 DROP과 ADD를 묶어서</strong> seq가 잠깐도 키에서 벗어나지 않게 해야 한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-sql" data-lang="sql"><span class="line"><span class="cl"><span class="k">ALTER</span><span class="w"> </span><span class="k">TABLE</span><span class="w"> </span><span class="n">image</span><span class="w">
</span></span></span><span class="line"><span class="cl"><span class="w">    </span><span class="k">MODIFY</span><span class="w"> </span><span class="n">server_processing_time</span><span class="w"> </span><span class="n">DATETIME</span><span class="w"> </span><span class="k">NOT</span><span class="w"> </span><span class="k">NULL</span><span class="p">,</span><span class="w">   </span><span class="c1">-- PK 구성 컬럼은 NOT NULL 필수
</span></span></span><span class="line"><span class="cl"><span class="w">    </span><span class="k">DROP</span><span class="w"> </span><span class="k">PRIMARY</span><span class="w"> </span><span class="k">KEY</span><span class="p">,</span><span class="w">
</span></span></span><span class="line"><span class="cl"><span class="w">    </span><span class="k">ADD</span><span class="w"> </span><span class="k">PRIMARY</span><span class="w"> </span><span class="k">KEY</span><span class="w"> </span><span class="p">(</span><span class="n">seq</span><span class="p">,</span><span class="w"> </span><span class="n">server_processing_time</span><span class="p">);</span><span class="w">
</span></span></span></code></pre></td></tr></table>
</div>
</div><ul>
<li>PK에 들어가는 컬럼은 <strong>NOT NULL</strong> 이어야 한다. 그래서 <code>MODIFY ... NOT NULL</code>이 필요한데, <strong>기존 데이터에 NULL이 있으면 이 문장에서 실패</strong>한다. 실행 전에 <code>SELECT COUNT(*) FROM image WHERE server_processing_time IS NULL;</code> 로 꼭 확인.</li>
</ul>
<h2 id="첫-파티션은-과거-데이터를-다-빨아들인다">첫 파티션은 과거 데이터를 다 빨아들인다</h2>
<p>이것도 모르면 당황한다. RANGE에서 <strong>첫 파티션은 하한이 없다.</strong> <code>VALUES LESS THAN</code>만 있고 &ldquo;그 이상&quot;이라는 조건이 없어서, 지정한 시작보다 <strong>오래된 데이터가 전부 첫 파티션 한 곳에 몰린다.</strong></p>
<table>
	<thead>
			<tr>
					<th>데이터 날짜</th>
					<th>들어가는 파티션 (start=2026)</th>
			</tr>
	</thead>
	<tbody>
			<tr>
					<td>2019-03-15</td>
					<td><strong>첫 파티션</strong></td>
			</tr>
			<tr>
					<td>2022-11-01</td>
					<td><strong>첫 파티션</strong></td>
			</tr>
			<tr>
					<td>2026-02-10</td>
					<td>첫 파티션</td>
			</tr>
			<tr>
					<td>2026-08-20</td>
					<td>그 다음 파티션</td>
			</tr>
	</tbody>
</table>
<p>데이터 유실은 없지만(그래서 <code>pmax</code> catch-all이 있는 것), 과거 데이터가 많으면 첫 파티션만 비대해져서 그 구간에선 파티셔닝 이점이 사라진다. 나는 실제 데이터의 시작 시점을 <code>SELECT MIN(...)</code> 으로 확인해서 <code>start</code>를 거기에 맞추거나, 맨 앞에 <code>p_old VALUES LESS THAN ('2026-01-01')</code> 같은 과거 전용 파티션을 하나 두는 쪽으로 처리했다.</p>
<h2 id="실제로-데인-함정들">실제로 데인 함정들</h2>
<p>여기부턴 솔직한 삽질 기록이다.</p>
<p><strong>① 파티션 테이블은 외래키(FK)를 아예 지원 안 한다.</strong> 이게 제일 크다. 파티셔닝하려는 테이블이 FK를 갖고 있거나 다른 테이블에서 FK로 참조되면, <code>PARTITION BY</code>에서 그냥 실패한다. 파티셔닝 전에 <code>SHOW CREATE TABLE</code>로 FK부터 확인해야 한다. 이거 모르고 진행했다가 막판에 걸리면 설계부터 다시 봐야 한다..</p>
<p><strong>② DDL은 롤백이 안 된다.</strong> 나는 스크립트에 &ldquo;실패하면 전체 롤백&rdquo; 로직을 넣어놨었는데, 알고 보니 **MySQL/MariaDB에서 <code>ALTER TABLE</code> 같은 DDL은 암묵적 커밋(implicit commit)**이 일어난다. 즉 트랜잭션으로 못 묶는다. PK 변경(문장1)이 성공하고 파티셔닝(문장2)이 FK 때문에 실패하면 → <strong>PK는 이미 바뀐 채로 남는다.</strong> &ldquo;롤백되겠지&rdquo; 믿고 있으면 안 된다.</p>
<p><strong>③ 대용량이면 이 ALTER는 테이블 재구성(rebuild)이다.</strong> 오래 걸리고 락이 걸리고, 재구성 중엔 원본의 약 2배 디스크 공간이 필요하다. 운영 중인 큰 테이블이라면 <code>pt-online-schema-change</code>(Percona) 같은 온라인 스키마 변경 도구나 점검 시간대 적용을 권한다.</p>
<p><strong>④ 운영 중에 하면 진짜로 테이블이 깨질 수 있다.</strong> 이게 제일 크게 데인 부분이다. 파이썬 스크립트로 <strong>운영 중인</strong> MariaDB 테이블을 파티셔닝하다가 <strong>테이블이 깨진 적이 있다.</strong> 정확한 메커니즘은 나도 확신은 못 하는데, 파티셔닝(테이블 재구성)이 도는 도중에 <strong>다른 프로그램들이 같은 테이블에 계속 SELECT/INSERT/UPDATE를 하고 있던 것</strong>이 원인으로 추정된다. 복구는 어찌어찌 했지만.. 그다음부터는 <strong>그 DB를 쓰는 프로그램을 전부 멈춘 뒤에</strong> 파티셔닝을 돌렸고, 그렇게 하니 한 번도 안 깨졌다. 교과서적으로는 InnoDB가 알아서 락을 잡아준다지만, 현실에서 살아있는 대용량 테이블을 라이브로 재구성하는 건 그냥 <strong>위험한 작업</strong>이라고 몸으로 배웠다. <strong>가능하면 접근을 다 끊고(점검 시간대), 그게 안 되면 최소한 온라인 스키마 변경 도구로.</strong></p>
<h2 id="진짜-목적지--drop-partition-보관정책">진짜 목적지 — DROP PARTITION 보관정책</h2>
<p>여기까지 감수하고 파티셔닝하는 이유의 8할은 이거다. 오래된 데이터를 지울 때 <code>DELETE</code>는 행을 하나씩 지우며 락·언두로그를 잔뜩 쓰지만, 파티션은 통째로 버리면 끝이다.</p>
