</span><span class="lnt">14
</span><span class="lnt">15
</span><span class="lnt">16
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="n">STX</span><span class="p">,</span> <span class="n">ETX</span> <span class="o">=</span> <span class="mh">0x02</span><span class="p">,</span> <span class="mh">0x03</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="k">def</span> <span class="nf">frame_reader</span><span class="p">(</span><span class="n">stream</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">    <span class="n">buf</span> <span class="o">=</span> <span class="nb">bytearray</span><span class="p">()</span>
</span></span><span class="line"><span class="cl">    <span class="n">in_frame</span> <span class="o">=</span> <span class="kc">False</span>
</span></span><span class="line"><span class="cl">    <span class="k">for</span> <span class="n">byte</span> <span class="ow">in</span> <span class="n">stream</span><span class="p">:</span>            <span class="c1"># 스트림에서 1바이트씩</span>
</span></span><span class="line"><span class="cl">        <span class="k">if</span> <span class="ow">not</span> <span class="n">in_frame</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">            <span class="k">if</span> <span class="n">byte</span> <span class="o">==</span> <span class="n">STX</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">                <span class="n">in_frame</span> <span class="o">=</span> <span class="kc">True</span>
</span></span><span class="line"><span class="cl">                <span class="n">buf</span><span class="o">.</span><span class="n">clear</span><span class="p">()</span>
</span></span><span class="line"><span class="cl">        <span class="k">else</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">            <span class="k">if</span> <span class="n">byte</span> <span class="o">==</span> <span class="n">ETX</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">                <span class="k">yield</span> <span class="nb">bytes</span><span class="p">(</span><span class="n">buf</span><span class="p">)</span>   <span class="c1"># 한 프레임 완성</span>
</span></span><span class="line"><span class="cl">                <span class="n">in_frame</span> <span class="o">=</span> <span class="kc">False</span>
</span></span><span class="line"><span class="cl">            <span class="k">else</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">                <span class="n">buf</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">byte</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>깔끔해 보인다. 그런데 여기엔 치명적인 문제가 하나 숨어 있다.</p>
<h2 id="dle--데이터가-stxetx-흉내를-낼-때">DLE — 데이터가 STX/ETX 흉내를 낼 때</h2>
<p>만약 <strong>데이터 안에 <code>0x03</code>(ETX와 같은 값)이 들어있으면</strong> 어떻게 될까. 위 로직은 그걸 진짜 프레임 끝으로 오인하고 거기서 프레임을 잘라버린다. 텍스트만 주고받을 땐 제어 문자가 데이터에 안 섞이니 괜찮지만, 바이너리 데이터(센서 값, 좌표, 길이 필드 등)를 보내는 순간 <code>0x02</code>, <code>0x03</code> 같은 값은 얼마든지 자연스럽게 등장한다.</p>
<p>이걸 해결하는 게 <strong>DLE (Data Link Escape, <code>0x10</code>)</strong> 다. 발상은 프로그래밍 언어의 escape 문자(<code>\\</code>)와 똑같다. &ldquo;다음에 오는 바이트는 제어 문자가 아니라 그냥 데이터로 취급하라&quot;는 표시다.</p>
<p>규칙은 이렇다. 송신할 때 데이터 바이트가 STX/ETX/DLE 중 하나와 같은 값이면, 그 앞에 DLE를 하나 끼워넣는다. 이걸 <strong>바이트 스터핑(byte stuffing)</strong> 혹은 DLE stuffing이라고 부른다.</p>
<table>
	<thead>
			<tr>
					<th>데이터에 이 값이 있으면</th>
					<th>이렇게 전송</th>
			</tr>
	</thead>
	<tbody>
			<tr>
					<td><code>0x02</code> (STX와 같음)</td>
					<td><code>DLE 0x02</code></td>
			</tr>
			<tr>
					<td><code>0x03</code> (ETX와 같음)</td>
					<td><code>DLE 0x03</code></td>
			</tr>
			<tr>
					<td><code>0x10</code> (DLE 자기 자신)</td>
					<td><code>DLE DLE</code></td>
			</tr>
	</tbody>
</table>
<p>DLE 자신도 반드시 escape해야 한다는 게 포인트다. 안 그러면 데이터에 우연히 들어간 <code>0x10</code>을 수신 측이 &ldquo;다음 바이트를 escape하라&quot;는 신호로 착각한다.</p>
<p>프레임 경계를 나타내는 STX/ETX도 <code>DLE STX</code>, <code>DLE ETX</code> 쌍으로 표현하는 변형도 흔하다. 이렇게 하면 &ldquo;escape 안 된 홑 DLE STX&quot;만이 진짜 프레임 시작이 되어 경계가 더 명확해진다.</p>
<p>송신 측 스터핑을 개념 코드로 쓰면:</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="n">STX</span><span class="p">,</span> <span class="n">ETX</span><span class="p">,</span> <span class="n">DLE</span> <span class="o">=</span> <span class="mh">0x02</span><span class="p">,</span> <span class="mh">0x03</span><span class="p">,</span> <span class="mh">0x10</span>
</span></span><span class="line"><span class="cl"><span class="n">SPECIAL</span> <span class="o">=</span> <span class="p">{</span><span class="n">STX</span><span class="p">,</span> <span class="n">ETX</span><span class="p">,</span> <span class="n">DLE</span><span class="p">}</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="k">def</span> <span class="nf">stuff</span><span class="p">(</span><span class="n">data</span><span class="p">:</span> <span class="nb">bytes</span><span class="p">)</span> <span class="o">-&gt;</span> <span class="nb">bytes</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">    <span class="n">out</span> <span class="o">=</span> <span class="nb">bytearray</span><span class="p">([</span><span class="n">STX</span><span class="p">])</span>
</span></span><span class="line"><span class="cl">    <span class="k">for</span> <span class="n">b</span> <span class="ow">in</span> <span class="n">data</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">        <span class="k">if</span> <span class="n">b</span> <span class="ow">in</span> <span class="n">SPECIAL</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">            <span class="n">out</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">DLE</span><span class="p">)</span>     <span class="c1"># escape 삽입</span>
</span></span><span class="line"><span class="cl">        <span class="n">out</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">b</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="n">out</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">ETX</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="k">return</span> <span class="nb">bytes</span><span class="p">(</span><span class="n">out</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>수신 측은 반대로, DLE를 만나면 &ldquo;다음 1바이트는 무조건 데이터&quot;로 처리하고 DLE 자체는 버린다(unstuffing).</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span><span class="lnt">12
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="k">def</span> <span class="nf">unstuff</span><span class="p">(</span><span class="n">frame_body</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">    <span class="n">out</span> <span class="o">=</span> <span class="nb">bytearray</span><span class="p">()</span>
</span></span><span class="line"><span class="cl">    <span class="n">escaped</span> <span class="o">=</span> <span class="kc">False</span>
</span></span><span class="line"><span class="cl">    <span class="k">for</span> <span class="n">b</span> <span class="ow">in</span> <span class="n">frame_body</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">        <span class="k">if</span> <span class="n">escaped</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">            <span class="n">out</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">b</span><span class="p">)</span>       <span class="c1"># DLE 다음 바이트는 그대로 데이터</span>
</span></span><span class="line"><span class="cl">            <span class="n">escaped</span> <span class="o">=</span> <span class="kc">False</span>
</span></span><span class="line"><span class="cl">        <span class="k">elif</span> <span class="n">b</span> <span class="o">==</span> <span class="n">DLE</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">            <span class="n">escaped</span> <span class="o">=</span> <span class="kc">True</span>      <span class="c1"># DLE는 버리고 다음 바이트를 기다림</span>
</span></span><span class="line"><span class="cl">        <span class="k">else</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">            <span class="n">out</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="n">b</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="k">return</span> <span class="nb">bytes</span><span class="p">(</span><span class="n">out</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>이걸로 데이터에 어떤 바이트가 들어오든 프레임 경계가 깨지지 않는다.</p>
<blockquote>
<p>참고로 프레임 경계를 문자로 표시하는 방식 말고, <strong>길이 접두(length-prefix)</strong> 방식도 있다. 헤더에 &ldquo;이 프레임의 길이는 N바이트&quot;라고 박아두고 그만큼 읽는 것. 이 경우 데이터에 제어 문자가 섞여도 상관없어서 스터핑이 필요 없다. 대신 길이 필드가 깨지면 동기화 복구가 까다롭다. STX/ETX+DLE 방식은 경계 문자를 보고 언제든 재동기화할 수 있다는 게 장점이라, 노이즈가 낀 시리얼 환경에서 특히 선호된다. 실무에서는 둘을 섞어 <code>STX | LENGTH | DATA | CRC | ETX</code> 처럼 쓰기도 한다.</p>
</blockquote>
<h2 id="crc--내용이-안-깨졌는지-검증한다">CRC — 내용이 안 깨졌는지 검증한다</h2>
<p>프레임 경계를 제대로 잘라냈다고 해서 끝이 아니다. 전송 도중 비트가 뒤집혔을 수 있다(전기적 노이즈, 케이블 불량 등). 그래서 <strong>데이터가 손상되지 않았는지 검증</strong>하는 값이 필요한데, 그게 <strong>CRC (Cyclic Redundancy Check)</strong> 다.</p>
<p>원리는 이렇다. 데이터를 하나의 큰 이진수로 보고, 미리 약속한 <strong>생성 다항식(generator polynomial)</strong> 으로 나눗셈(정확히는 GF(2) 위의 다항식 나눗셈, 실제로는 XOR 시프트)을 해서 나온 <strong>나머지</strong>를 CRC 값으로 삼는다. 송신 측이 이 값을 프레임에 붙여 보내고, 수신 측이 받은 데이터로 똑같이 계산해서 값이 일치하는지 확인한다. 하나라도 다르면 프레임을 버리고 재전송을 요청한다. (다항식 나눗셈 부분은 솔직히 나도 수학적으로 깊이 파진 않았다.. 라이브러리를 쓰는 입장에선 &ldquo;약속한 파라미터로 나머지를 구한다&rdquo; 정도로 이해해도 충분했다.)</p>
<p>단순히 바이트를 다 더하는 <strong>체크섬(checksum)</strong> 도 오류 검출용이지만, CRC가 훨씬 강하다. 체크섬은 두 바이트가 서로 상쇄되게 뒤집히면 못 잡지만, CRC는 다항식 특성상 그런 패턴에도 강하고 특히 <strong>연속된 비트 오류(burst error)</strong> 검출력이 좋다. 시리얼/필드버스 환경에서 CRC가 표준처럼 쓰이는 이유다.</p>
<p>자주 보게 되는 종류:</p>
<ul>
<li><strong>CRC-8</strong> — 짧은 프레임, 저사양 MCU에서.</li>
<li><strong>CRC-16</strong> — Modbus RTU, 각종 산업용 시리얼 프로토콜의 단골. CCITT 변형(<code>0x1021</code> 다항식)도 자주 쓰인다.</li>
<li><strong>CRC-32</strong> — Ethernet, ZIP, PNG 등. 더 긴 데이터에.</li>
</ul>
<p>CRC는 직접 구현하기보다 검증된 라이브러리나 표준 구현을 쓰는 걸 권한다. 다만 프로토콜 문서를 볼 때 <strong>파라미터</strong>를 반드시 맞춰야 한다. 같은 &ldquo;CRC-16&quot;이라도 다항식(polynomial), 초기값(init), 입력·출력 비트 반전(reflect in/out), 최종 XOR 값이 다르면 결과가 완전히 달라진다. 상대 장비와 값이 안 맞으면 십중팔구 이 파라미터가 틀린 것이다.. 나도 여기서 &ldquo;코드는 맞는데 값이 안 맞네&rdquo; 하고 한참 헤맸다.</p>
<p>Python이라면 <code>crcmod</code>나 <code>binascii.crc32</code> 같은 걸 쓰면 된다. 개념만 보이면:</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="kn">import</span> <span class="nn">crcmod</span>
</span></span><span class="line"><span class="cl"><span class="c1"># 예: CRC-16/CCITT-FALSE 파라미터 (장비 스펙에 맞게 지정)</span>
</span></span><span class="line"><span class="cl"><span class="n">crc16</span> <span class="o">=</span> <span class="n">crcmod</span><span class="o">.</span><span class="n">mkCrcFun</span><span class="p">(</span><span class="mh">0x11021</span><span class="p">,</span> <span class="n">initCrc</span><span class="o">=</span><span class="mh">0xFFFF</span><span class="p">,</span> <span class="n">rev</span><span class="o">=</span><span class="kc">False</span><span class="p">,</span> <span class="n">xorOut</span><span class="o">=</span><span class="mh">0x0000</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="n">value</span> <span class="o">=</span> <span class="n">crc16</span><span class="p">(</span><span class="sa">b</span><span class="s2">&#34;payload bytes&#34;</span><span class="p">)</span>   <span class="c1"># 이 값을 프레임에 붙여 전송</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="다-합치면-하나의-프레임">다 합치면 하나의 프레임</h2>
<p>정리하면 전형적인 프레임은 대략 이런 모양이 된다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">STX │ (LENGTH) │ DATA (byte-stuffed) │ CRC │ ETX
</span></span></code></pre></td></tr></table>
</div>
</div><ul>
<li><strong>STX/ETX</strong>: 어디가 시작이고 끝인지 — 경계.</li>
<li><strong>DLE 스터핑</strong>: 데이터가 경계 문자를 흉내 내지 못하게 — 투명성(transparency).</li>
<li><strong>CRC</strong>: 잘라낸 내용이 안 깨졌는지 — 무결성.</li>
</ul>
<p>세 가지가 각각 다른 문제를 푼다. 경계, 투명성, 무결성. 이걸 헷갈리면 &ldquo;CRC 넣었으니 됐지&rdquo; 하고 스터핑을 빼먹었다가, 데이터에 <code>0x03</code> 섞이는 순간 프레임이 반토막 나는 걸 겪게 된다.. 경험담이다.</p>
<h2 id="실무에서-자주-걸리는-지점">실무에서 자주 걸리는 지점</h2>
<p>문서 볼 때 나는 이것들부터 확인한다.</p>
<ol>
<li><strong>CRC 계산 범위</strong> — STX/ETX를 포함하는지, LENGTH 필드는 포함하는지, DATA만인지. 프로토콜마다 제각각이다.</li>
<li><strong>스터핑과 CRC의 순서</strong> — 보통 CRC를 먼저 계산하고 그 다음에 전체를(CRC 포함) 스터핑한다. 즉 수신 측은 unstuff → CRC 검증 순서. 순서를 반대로 하면 절대 값이 안 맞는다.</li>
<li><strong>CRC 바이트 순서(엔디안)</strong> — CRC-16을 붙일 때 상위 바이트 먼저인지 하위 먼저인지. Modbus는 하위 바이트 먼저다.</li>
<li><strong>STX/ETX 자체를 스터핑 대상에 넣는지</strong> — 경계 문자를 <code>DLE STX</code>로 표현하는 변형이면 계산이 또 달라진다.</li>
</ol>
<p>결국 이 방식들은 개념은 단순한데, <strong>&ldquo;이 프로토콜은 정확히 어느 변형이냐&rdquo;</strong> 를 스펙 문서에서 못 박는 게 90%다. 반대로 말하면, 개념만 잡혀 있으면 문서의 어느 항목을 확인해야 하는지가 보인다는 것.. 그게 이 글의 요점이다.</p>
`,date:"2026.09.16",summary:`스트림에는 경계가 없다 장비 통신을 붙이다 보면 STX/ETX/DLE/CRC 조합을 계속 만나게 된다. 매번 어렴풋이 알고 넘어가다가 이번에 제대로 걸려서.. 다음의 나를 위해 정리해둔다.
시리얼(RS-232/485)이든 TCP 소켓이든, 내가 받는 건 결국 바이트가 줄줄이 흘러오는 스트림이다. 여기엔 “여기까지가 한 메시지"라는 경계가 없다. 송신 측이 100바이트짜리 패킷 하나를 보내도, 수신 측에서는 40바이트 읽히고 나머지 60바이트가 다음 read()에서 들어오기도 하고, 반대로 두 패킷이 한 번에 붙어서 오기도 한다.
그래서 애플리케이션이 직접 프레이밍(framing) 을 해야 한다. 흘러오는 바이트 더미에서 “어디부터 어디까지가 한 프레임인지"를 잘라내는 규칙이다. STX/ETX/DLE/CRC는 그 프레이밍을 하는 가장 고전적인 방법인데, 각 조각이 서로 다른 문제를 푼다. 하나씩 보자.
`,thumb:"/images/book-default.svg",title:"[프로토콜] STX·ETX·DLE·CRC — 바이트 스트림에서 프레임을 잘라내는 법",url:"/posts/serial-protocol-framing-stx-etx-dle-crc/"},{content:`<h2 id="어쩌다-이걸-하게-됐나">어쩌다 이걸 하게 됐나</h2>
<p>외부에서 파일을 올릴 SFTP 계정을 하나 파야 했다. 요구는 세 개였다. 이 계정으로 접속하면 <strong>지정한 폴더 안에서만</strong> 놀게 하고, 같은 디스크의 <strong>다른 폴더는 아예 안 보이게</strong> 격리하고, 그러면서 파일은 용량 큰 <strong>별도 마운트 디스크</strong>에 쌓이게 하는 것.</p>
<p>&ldquo;chroot 걸면 되겠지&rdquo; 하고 가볍게 시작했는데.. 이게 생각보다 순순히 안 됐다. 결론부터 말하면 <strong>chroot의 소유권 제약</strong> 때문에 &ldquo;가두기&quot;와 &ldquo;쓰기&quot;가 정면충돌하고, 그걸 <strong>bind mount</strong>로 우회해야 한다. 나처럼 별도 디스크에 저장까지 얹어야 하는 상황이면 이 글이 그대로 쓸모 있을 거고, 그냥 홈 디렉토리에 쓰기만 하면 되는 경우면 뒤 절반은 안 봐도 된다.</p>
<h2 id="핵심-제약--가두기와-쓰기가-충돌한다">핵심 제약 — 가두기와 쓰기가 충돌한다</h2>
<p>OpenSSH의 <code>ChrootDirectory</code>에는 강한 제약이 하나 있다.</p>
<ul>
<li><strong>chroot 루트로 지정한 폴더는 반드시 <code>root:root</code> 소유 + 그룹/기타 쓰기 불가여야 한다.</strong></li>
<li>상위 경로 전체도 마찬가지다. 하나라도 헐거우면 접속이 즉시 끊긴다.</li>
</ul>
<p>즉 &ldquo;이 폴더에 갇히기&quot;와 &ldquo;이 폴더에 직접 쓰기&quot;는 동시에 성립하지 않는다. 가두려고 root 소유로 만들면 정작 그 계정이 쓸 수가 없고, 쓸 수 있게 사용자 소유로 만들면 chroot가 거부한다.. 이 앞뒤 안 맞는 상황에서 한참 멈칫했다. 로그에 이게 찍히면 십중팔구 이 제약을 위반한 것이다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">bad ownership or modes for chroot directory
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="해결-구조--껍데기는-root-안쪽을-bind로-연결">해결 구조 — 껍데기는 root, 안쪽을 bind로 연결</h2>
<p>발상은 이렇다. chroot 루트는 <strong>root 소유의 빈 껍데기</strong>로 두고(제약 만족), 실제 저장 폴더를 그 안에 <strong>bind mount</strong>로 연결한다. 그러면 사용자에게는 한 겹 안쪽 폴더가 보이고, 파일은 내가 원하는 실제 위치에 쌓인다. 껍데기와 알맹이를 분리하는 셈이다.</p>
<p>예를 들어 <code>/data</code> 아래의 <code>store</code>, <code>app</code> 같은 다른 폴더는 숨기고 <code>upload</code> 폴더만 노출하고 싶다면 이렇게 짠다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-gdscript3" data-lang="gdscript3"><span class="line"><span class="cl"><span class="o">/</span><span class="n">data</span>
</span></span><span class="line"><span class="cl"><span class="err">├──</span> <span class="n">store</span>          <span class="err">←</span> <span class="err">안</span> <span class="err">보임</span>
</span></span><span class="line"><span class="cl"><span class="err">├──</span> <span class="n">app</span>            <span class="err">←</span> <span class="err">안</span> <span class="err">보임</span>
</span></span><span class="line"><span class="cl"><span class="err">├──</span> <span class="n">sftp_root</span>      <span class="err">←</span> <span class="n">chroot</span> <span class="err">루트</span> <span class="p">(</span><span class="err">빈</span> <span class="err">껍데기</span><span class="p">,</span> <span class="n">root</span><span class="p">:</span><span class="n">root</span> <span class="mi">755</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="err">│</span>   <span class="err">└──</span> <span class="n">upload</span>     <span class="err">←</span> <span class="err">사용자에게</span> <span class="s2">&#34;/upload&#34;</span><span class="err">로</span> <span class="err">보임</span> <span class="p">(</span><span class="n">bind</span> <span class="err">→</span> <span class="o">/</span><span class="n">data</span><span class="o">/</span><span class="n">upload</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="err">└──</span> <span class="n">upload</span>         <span class="err">←</span> <span class="err">실제</span> <span class="err">저장</span> <span class="err">위치</span> <span class="p">(</span><span class="n">user</span> <span class="err">소유</span><span class="p">)</span> <span class="err">★파일이</span> <span class="err">여기</span> <span class="err">쌓임</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="설정">설정</h2>
<p>계정명을 <code>sftpuser</code>, 실제 저장 폴더를 <code>/data/upload</code> 라고 하자.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span><span class="lnt">12
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="c1"># 1. 실제 저장 폴더는 사용자 소유</span>
</span></span><span class="line"><span class="cl">sudo chown sftpuser:sftpuser /data/upload
</span></span><span class="line"><span class="cl">sudo chmod <span class="m">755</span> /data/upload
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 2. chroot 루트 껍데기 (root 소유 필수)</span>
</span></span><span class="line"><span class="cl">sudo mkdir -p /data/sftp_root
</span></span><span class="line"><span class="cl">sudo chown root:root /data/sftp_root
</span></span><span class="line"><span class="cl">sudo chmod <span class="m">755</span> /data/sftp_root
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 3. 껍데기 안에 마운트 지점 만들고 bind</span>
</span></span><span class="line"><span class="cl">sudo mkdir /data/sftp_root/upload
</span></span><span class="line"><span class="cl">sudo mount --bind /data/upload /data/sftp_root/upload
</span></span></code></pre></td></tr></table>
</div>
</div><p>여기서 놓치기 쉬운 게, 상위 경로인 <code>/data</code> 도 <code>root:root</code> + 쓰기 불가여야 한다는 점이다. chroot 루트만 신경 쓰다가 상위 폴더가 헐거워서 계속 끊기는 경우가 많다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">ls -ld /data           <span class="c1"># drwxr-xr-x root root 확인</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h3 id="sshd_config">sshd_config</h3>
<p><code>/etc/ssh/sshd_config</code> 하단에 추가한다. <code>internal-sftp</code> 철자에 특히 주의.. 오타 나면 접속 자체가 안 되는데 에러가 불친절해서 원인 찾기 괴롭다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span><span class="lnt">7
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">Subsystem sftp internal-sftp
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl">Match User sftpuser
</span></span><span class="line"><span class="cl">        ChrootDirectory /data/sftp_root
</span></span><span class="line"><span class="cl">        ForceCommand internal-sftp
</span></span><span class="line"><span class="cl">        AllowTcpForwarding no
</span></span><span class="line"><span class="cl">        X11Forwarding no
</span></span></code></pre></td></tr></table>
</div>
</div><p>기존 <code>Subsystem sftp /usr/lib/openssh/sftp-server</code> 라인은 주석 처리하거나 위처럼 교체한다.</p>
<h3 id="bind-mount-영구-적용">bind mount 영구 적용</h3>
<p>여기까지 하고 재부팅하면 bind가 풀려서 다시 원점이 된다. 나도 처음에 이걸 깜빡하고 &ldquo;잘 됐는데 왜 재부팅하니 안 되지&rdquo; 했었다.. <code>/etc/fstab</code> 에 한 줄 넣어 영구 적용한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="nb">echo</span> <span class="s1">&#39;/data/upload /data/sftp_root/upload none bind,nofail,x-systemd.requires-mounts-for=/data 0 0&#39;</span> <span class="se">\\
</span></span></span><span class="line"><span class="cl">  <span class="p">|</span> sudo tee -a /etc/fstab
</span></span></code></pre></td></tr></table>
</div>
</div><ul>
<li><code>nofail</code>: bind 대상이 아직 안 올라와도 부팅을 막지 않는다.</li>
<li><code>x-systemd.requires-mounts-for=/data</code>: <code>/data</code> 가 마운트된 뒤에 bind를 실행하게 한다. 별도 디스크를 마운트해 쓰는 경우 순서가 꼬일 여지를 없애준다.</li>
<li><code>timeout</code> 류 옵션은 물리 디바이스를 기다리는 용도라 bind mount에는 불필요하다.</li>
</ul>
<h2 id="적용과-검증">적용과 검증</h2>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">sudo sshd -t                    <span class="c1"># 설정 문법 검증 (에러 없어야 함)</span>
</span></span><span class="line"><span class="cl">sudo mount -a                   <span class="c1"># fstab 다시 마운트 시도</span>
</span></span><span class="line"><span class="cl">sudo systemctl restart ssh
</span></span><span class="line"><span class="cl">mount <span class="p">|</span> grep sftp_root          <span class="c1"># bind mount 확인</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p><code>sshd -t</code>를 restart 전에 꼭 돌려보길 권한다. 설정에 오타가 있는 채로 ssh를 restart하면 원격에서 SSH 자체가 안 열려서 곤란해질 수 있다.. 검증 먼저, 재시작은 그 다음.</p>
<h2 id="정리">정리</h2>
<ul>
<li>chroot 루트는 반드시 <strong>root 소유의 껍데기</strong>. 상위 경로까지 전부 root 소유 + 쓰기 불가여야 한다.</li>
<li>실제 쓰기는 그 <strong>안쪽 폴더</strong>에서. <strong>bind mount</strong>로 원하는 저장 위치(큰 디스크 등)에 연결한다.</li>
<li>bind는 재부팅에 안 살아남으니 <strong><code>/etc/fstab</code>으로 영구 적용</strong>.</li>
<li>문제가 생기면 <code>sudo tail -f /var/log/auth.log</code> 로 원인을 바로 확인할 수 있다. <code>bad ownership...</code>이 보이면 소유권/권한 제약 위반이다.</li>
</ul>
<p>사용자 입장에선 폴더 한 겹 더 들어가는 걸 감수하는 대신, 다른 폴더는 완전히 숨기고 원하는 디스크에 파일을 저장할 수 있다. 처음엔 &ldquo;가두면서 쓰게 하라니 모순 아냐?&rdquo; 싶었는데, 껍데기(chroot 루트)와 알맹이(실제 저장소)를 bind로 분리한다는 그림을 잡고 나니 의외로 단순한 구조였다.</p>
`,date:"2026.09.16",summary:`어쩌다 이걸 하게 됐나 외부에서 파일을 올릴 SFTP 계정을 하나 파야 했다. 요구는 세 개였다. 이 계정으로 접속하면 지정한 폴더 안에서만 놀게 하고, 같은 디스크의 다른 폴더는 아예 안 보이게 격리하고, 그러면서 파일은 용량 큰 별도 마운트 디스크에 쌓이게 하는 것.
“chroot 걸면 되겠지” 하고 가볍게 시작했는데.. 이게 생각보다 순순히 안 됐다. 결론부터 말하면 chroot의 소유권 제약 때문에 “가두기"와 “쓰기"가 정면충돌하고, 그걸 bind mount로 우회해야 한다. 나처럼 별도 디스크에 저장까지 얹어야 하는 상황이면 이 글이 그대로 쓸모 있을 거고, 그냥 홈 디렉토리에 쓰기만 하면 되는 경우면 뒤 절반은 안 봐도 된다.
`,thumb:"/images/book-default.svg",title:"[Linux] SFTP 계정을 폴더에 가두기 — chroot의 제약과 bind mount 우회",url:"/posts/sftp-chroot-jail/"},{content:`<h2 id="문제-느린-db-조회가-파이프라인을-붙잡는다">문제: 느린 DB 조회가 파이프라인을 붙잡는다</h2>
<p>두 모듈이 하나의 파이프라인으로 이어지는 상황이 있었다. 앞 모듈(선행 모듈)이 어떤 작업을 마치면 그 결과로 <strong>DB에서 무언가를 조회할 key</strong>를 만들어내고, 뒤 모듈(내 모듈)이 그 key로 DB를 조회해서 후속 처리를 한다.</p>
<p>문제는 이 <strong>DB 조회가 느리다</strong>는 것이었다. 데이터가 잔뜩 쌓인 테이블에서 큰 바이너리(이미지 blob 같은)를 꺼내와야 했고, 한 건당 시간이 제법 걸렸다. 두 모듈을 그냥 함수 호출로 직결하면, 앞 모듈은 뒤 모듈의 느린 조회가 끝날 때까지 <strong>매번 기다려야</strong> 한다. 앞 모듈도 나름 추론 등 할 일이 있는데 뒤 모듈의 I/O에 발이 묶이는 것.</p>
<p>핵심 요구는 이랬다. <strong>두 모듈을 떼어내서, 앞은 앞대로 빠르게 일하고 뒤는 자기 페이스로 밀린 조회를 처리하게 만들자.</strong> 이걸 위해 사이에 <strong>Redis List 기반 작업 큐</strong>를 끼웠다.</p>
<h2 id="왜-redis-큐였나">왜 Redis 큐였나</h2>
<p>선택 이유는 세 가지였다.</p>
<p><strong>1) 비동기 분리</strong> — 앞 모듈은 &ldquo;이 key 처리해줘&quot;를 큐에 던지기만 하고 바로 자기 일로 돌아간다. 뒤 모듈은 큐에서 하나씩 꺼내 느린 DB 조회를 처리한다. 생산 속도와 소비 속도가 달라도 큐가 완충 역할을 하니 서로를 기다리지 않는다.</p>
<p><strong>2) 프로세스·모듈 결합도 감소</strong> — 두 모듈이 서로의 함수 시그니처나 내부 구현을 알 필요가 없다. 오직 &ldquo;큐에 어떤 형식의 메시지가 흐른다&quot;는 계약만 공유한다. 한쪽을 재시작하거나 교체해도 다른 쪽은 영향을 덜 받는다. 심지어 두 모듈이 다른 언어·다른 프로세스여도 Redis를 사이에 두면 통신이 된다.</p>
<p><strong>3) 부하 분산의 발판</strong> — 뒤에서 설명하겠지만, 조회를 처리하는 워커를 <strong>여러 서버로 늘리고</strong> 큐를 매개로 일을 나눠 갖게 만들 수 있다. 처음부터 이걸 염두에 두고 큐를 골랐다.</p>
<p>솔직히 &ldquo;제대로 하려면 RabbitMQ나 Kafka 같은 메시지 브로커를 봐야 하나&rdquo; 싶기도 했는데.. 이번 요구엔 그 정도까진 필요 없었고, 이미 쓰고 있던 Redis로 충분했다. Redis의 List가 이 용도에 잘 맞는다. <code>LPUSH</code>/<code>RPUSH</code>로 넣고 <code>LPOP</code>/<code>RPOP</code>으로 꺼내며, 양끝 어디로든 넣고 뺄 수 있어서 <strong>큐(FIFO)로도 스택(LIFO)으로도</strong> 쓸 수 있다. 이 유연함이 뒤에 나올 설계에 그대로 쓰였다.</p>
<h2 id="기본-구조-프로듀서--컨슈머">기본 구조: 프로듀서 / 컨슈머</h2>
<p>가장 단순한 형태는 이렇다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># 프로듀서 (선행 모듈): 처리할 key를 큐에 넣는다</span>
</span></span><span class="line"><span class="cl"><span class="n">r</span><span class="o">.</span><span class="n">lpush</span><span class="p">(</span><span class="s2">&#34;task:main&#34;</span><span class="p">,</span> <span class="n">json</span><span class="o">.</span><span class="n">dumps</span><span class="p">({</span><span class="s2">&#34;key&#34;</span><span class="p">:</span> <span class="n">db_key</span><span class="p">,</span> <span class="s2">&#34;meta&#34;</span><span class="p">:</span> <span class="o">...</span><span class="p">}))</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 컨슈머 (내 모듈): 큐에서 꺼내 느린 DB 조회를 처리한다</span>
</span></span><span class="line"><span class="cl"><span class="k">while</span> <span class="kc">True</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">    <span class="n">item</span> <span class="o">=</span> <span class="n">r</span><span class="o">.</span><span class="n">rpop</span><span class="p">(</span><span class="s2">&#34;task:main&#34;</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="k">if</span> <span class="n">item</span> <span class="ow">is</span> <span class="kc">None</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">        <span class="n">time</span><span class="o">.</span><span class="n">sleep</span><span class="p">(</span><span class="n">polling_interval</span><span class="p">)</span>   <span class="c1"># 비어 있으면 잠깐 쉬고 다시</span>
</span></span><span class="line"><span class="cl">        <span class="k">continue</span>
</span></span><span class="line"><span class="cl">    <span class="n">task</span> <span class="o">=</span> <span class="n">json</span><span class="o">.</span><span class="n">loads</span><span class="p">(</span><span class="n">item</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="n">process</span><span class="p">(</span><span class="n">task</span><span class="p">)</span>   <span class="c1"># 여기서 느린 DB 조회 + 후속 처리</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p><code>LPUSH</code>로 넣고 <code>RPOP</code>으로 꺼내면 <strong>먼저 들어온 게 먼저 나가는 FIFO 큐</strong>가 된다. 앞 모듈은 큐에 던지고 즉시 복귀, 뒤 모듈은 밀린 일을 자기 속도로 소진한다.</p>
<blockquote>
<p>참고: 폴링 대신 <code>BRPOP</code>(블로킹 pop)을 쓰면 큐가 빌 때 CPU를 덜 쓰면서 새 작업을 기다릴 수 있다. 타임아웃을 줘서 주기적으로 깨어나 다른 일(종료 신호 확인 등)을 하게 하는 구성도 가능하다. 나는 처리 중 다른 상태도 봐야 해서 폴링으로 뒀지만, 순수하게 큐만 소비하면 <code>BRPOP</code>이 낫다.</p>
</blockquote>
<h2 id="설계-1-fifo--lifo를-설정으로-전환">설계 1: FIFO / LIFO를 설정으로 전환</h2>
<p>작업을 <strong>오래된 것부터</strong> 처리할지, <strong>최신 것부터</strong> 처리할지는 상황에 따라 다르다.</p>
<ul>
<li>밀린 작업을 공평하게 순서대로 비우고 싶으면 <strong>FIFO</strong>(오래된 것 우선)</li>
<li>최신 상태가 더 중요하고 오래된 건 가치가 떨어지는 성격이면 <strong>LIFO</strong>(최신 우선)</li>
</ul>
<p>Redis List에서는 이게 <strong>꺼내는 쪽 방향만 바꾸면</strong> 되는 문제다. <code>LPUSH</code>로 넣는다고 할 때:</p>
<ul>
<li><code>RPOP</code> → 반대쪽 끝에서 꺼냄 → <strong>FIFO</strong></li>
<li><code>LPOP</code> → 넣은 쪽 끝에서 꺼냄 → <strong>LIFO</strong></li>
</ul>
<p>그래서 이 방향을 <strong>JSON 설정 파일로 바꿀 수 있게</strong> 만들었다. 코드를 고치지 않고 운영 중에 정책을 선택할 수 있게.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># config.json 의 값에 따라 pop 방향 결정</span>
</span></span><span class="line"><span class="cl"><span class="n">pop</span> <span class="o">=</span> <span class="n">r</span><span class="o">.</span><span class="n">lpop</span> <span class="k">if</span> <span class="n">config</span><span class="p">[</span><span class="s2">&#34;main_queue_order&#34;</span><span class="p">]</span> <span class="o">==</span> <span class="s2">&#34;lifo&#34;</span> <span class="k">else</span> <span class="n">r</span><span class="o">.</span><span class="n">rpop</span>
</span></span><span class="line"><span class="cl"><span class="n">item</span> <span class="o">=</span> <span class="n">pop</span><span class="p">(</span><span class="s2">&#34;task:main&#34;</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>작은 장치지만, &ldquo;이 큐를 어떤 순서로 비울 것인가&quot;를 배포 없이 운영 판단으로 넘길 수 있어 꽤 유용했다.</p>
<h2 id="설계-2-에러-전용-재시도-큐-최신-실패-우선">설계 2: 에러 전용 재시도 큐 (최신 실패 우선)</h2>
<p>느린 DB 조회는 실패할 수 있다. 일시적인 커넥션 문제, 락, 타임아웃 등. 실패한 작업을 그냥 버리면 유실이고, 그렇다고 같은 큐 맨 뒤에 다시 넣으면 정상 흐름과 뒤섞인다.</p>
<p>그래서 <strong>에러 전용 큐를 따로</strong> 뒀다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="k">try</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">    <span class="n">task</span> <span class="o">=</span> <span class="n">pop</span><span class="p">(</span><span class="s2">&#34;task:main&#34;</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="n">process</span><span class="p">(</span><span class="n">task</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="k">except</span> <span class="ne">Exception</span> <span class="k">as</span> <span class="n">e</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">    <span class="n">logger</span><span class="o">.</span><span class="n">warning</span><span class="p">(</span><span class="sa">f</span><span class="s2">&#34;처리 실패, 재시도 큐로: </span><span class="si">{</span><span class="n">e</span><span class="si">}</span><span class="s2">&#34;</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="n">r</span><span class="o">.</span><span class="n">lpush</span><span class="p">(</span><span class="s2">&#34;task:retry&#34;</span><span class="p">,</span> <span class="n">item</span><span class="p">)</span>   <span class="c1"># 실패분은 재시도 큐로</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>재시도 큐는 <strong>나(컨슈머) 혼자만 쓰는 큐</strong>다. 프로듀서는 이 큐를 모른다. 그리고 재시도는 <strong><code>LPUSH</code> + <code>LPOP</code> 조합으로 LIFO</strong> — 즉 <strong>방금 실패한 게 가장 먼저 다시 시도</strong>되는 구조로 설계했다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># 재시도 처리: 최근 실패분부터</span>
</span></span><span class="line"><span class="cl"><span class="n">retry_item</span> <span class="o">=</span> <span class="n">r</span><span class="o">.</span><span class="n">lpop</span><span class="p">(</span><span class="s2">&#34;task:retry&#34;</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>왜 최신 실패 우선(LIFO)로 의도했나. 실패가 몰릴 때 오래된 실패부터 붙잡고 있으면 방금 들어온 작업이 오래 지연된다. 최신 실패를 먼저 재시도하면 &ldquo;지금 막 문제된 것&quot;을 빠르게 회복시킬 수 있고, 정말 고질적으로 안 되는 것들은 뒤로 밀려 자연스럽게 후순위가 된다. 정상 큐(FIFO/LIFO 전환 가능)와 재시도 큐(LIFO 고정)의 <strong>처리 방향이 서로 다른 것</strong>이 이 설계의 특징이다.</p>
<p>정리하면 두 큐의 역할이 이렇게 나뉜다.</p>
<table>
	<thead>
			<tr>
					<th>큐</th>
					<th>넣기</th>
					<th>꺼내기</th>
					<th>순서</th>
					<th>쓰는 주체</th>
			</tr>
	</thead>
	<tbody>
			<tr>
					<td>메인 큐</td>
					<td>프로듀서가 <code>LPUSH</code></td>
					<td><code>RPOP</code>/<code>LPOP</code> (설정)</td>
					<td>FIFO/LIFO 선택</td>
					<td>프로듀서 → 컨슈머</td>
			</tr>
			<tr>
					<td>재시도 큐</td>
					<td>컨슈머가 <code>LPUSH</code></td>
					<td>컨슈머가 <code>LPOP</code></td>
					<td>LIFO</td>
					<td>컨슈머 단독</td>
			</tr>
	</tbody>
</table>
<h2 id="설계-3-여러-서버로-부하-분산--짧은-큐에-넣기">설계 3: 여러 서버로 부하 분산 — 짧은 큐에 넣기</h2>
<p>처리량을 더 높이려면 조회 워커를 <strong>여러 서버</strong>로 늘려야 한다. 이때 &ldquo;어느 서버에 일을 줄까&quot;를 정하는 방법이 필요하다.</p>
<p>간단하면서 효과적이었던 방식은, 프로듀서가 작업을 넣을 때 <strong>각 서버 큐의 현재 길이를 보고, 가장 짧은 큐에 넣는 것</strong>이다. <code>LLEN</code>으로 길이를 조회할 수 있다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># 여러 워커 서버의 큐 중 가장 짧은 곳에 작업을 넣는다</span>
</span></span><span class="line"><span class="cl"><span class="n">queues</span> <span class="o">=</span> <span class="p">[</span><span class="s2">&#34;task:main:w1&#34;</span><span class="p">,</span> <span class="s2">&#34;task:main:w2&#34;</span><span class="p">,</span> <span class="s2">&#34;task:main:w3&#34;</span><span class="p">]</span>
</span></span><span class="line"><span class="cl"><span class="n">target</span> <span class="o">=</span> <span class="nb">min</span><span class="p">(</span><span class="n">queues</span><span class="p">,</span> <span class="n">key</span><span class="o">=</span><span class="k">lambda</span> <span class="n">q</span><span class="p">:</span> <span class="n">r</span><span class="o">.</span><span class="n">llen</span><span class="p">(</span><span class="n">q</span><span class="p">))</span>
</span></span><span class="line"><span class="cl"><span class="n">r</span><span class="o">.</span><span class="n">lpush</span><span class="p">(</span><span class="n">target</span><span class="p">,</span> <span class="n">payload</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>이렇게 하면 처리 속도가 빠른(=큐가 빨리 비는) 서버에 자연스럽게 더 많은 일이 몰리고, 느린 서버엔 덜 간다. 라운드로빈처럼 기계적으로 나누는 것보다 <strong>실제 처리 여력에 비례해서</strong> 일이 분배되는 효과가 있다. 별도 로드밸런서 없이 큐 길이라는 단순한 신호만으로 부하 분산이 되는 셈이다.</p>
<blockquote>
<p>주의: <code>LLEN</code>으로 보고 <code>LPUSH</code>로 넣는 사이에 다른 프로듀서가 끼어드는 레이스가 이론적으로 있다. 프로듀서가 하나이거나, 분배가 완벽히 균등할 필요는 없는 상황(대략 짧은 쪽으로 쏠리기만 하면 충분)에서는 이 단순한 방식으로도 잘 동작했다. 더 엄격해야 한다면 Lua 스크립트로 조회+삽입을 원자적으로 묶는 방법이 있다.</p>
</blockquote>
<h2 id="테스트-모드-큐를-비우지-않고-들여다보기">테스트 모드: 큐를 비우지 않고 들여다보기</h2>
<p>개발·디버깅 중엔 큐에서 작업을 <strong>꺼내(pop) 소비해버리면</strong> 곤란할 때가 있다. 실제로 지우지 않고 내용만 확인하고 싶은 것. 이럴 땐 pop 대신 <strong>비파괴적으로 조회</strong>하면 된다.</p>
<ul>
<li>특정 인덱스만 보기: <code>LINDEX key 0</code> (맨 앞 항목)</li>
<li>범위로 훑기: <code>LRANGE key 0 9</code> (앞 10개)</li>
</ul>
<p>테스트 모드에서는 이렇게 &ldquo;꺼내지 않고 보기&quot;로 동작을 검증하고, 실제 모드에서만 <code>RPOP</code>/<code>LPOP</code>으로 소비하도록 분기해두면, 큐 내용을 망가뜨리지 않고 파이프라인을 점검할 수 있다. 이 작은 분기 하나가 디버깅할 때 은근히 큰 도움이 됐다.</p>
<h2 id="정리">정리</h2>
<p>느린 DB 조회 하나 때문에 시작한 일이었는데, Redis List를 큐로 쓰면서 얻은 게 많았다.</p>
<ul>
<li><strong>비동기 분리</strong>: 프로듀서는 던지고 복귀, 컨슈머는 자기 페이스로 소비. 서로의 속도에 묶이지 않는다.</li>
<li><strong>결합도 감소</strong>: 두 모듈은 &ldquo;큐에 흐르는 메시지 형식&quot;만 공유한다. 구현·언어·생명주기가 독립적이다.</li>
<li><strong>List의 양방향성</strong>으로 FIFO/LIFO를 자유롭게 구성 — 메인 큐는 설정으로 전환, 재시도 큐는 최신 실패 우선(LIFO)로 고정.</li>
<li><strong>에러 전용 재시도 큐</strong>로 실패 작업을 유실 없이, 정상 흐름과 분리해 처리.</li>
<li><strong>큐 길이 기반 분배</strong>로 별도 로드밸런서 없이 여러 워커 서버에 부하를 나눔.</li>
</ul>
<p>거창한 메시지 브로커를 도입하지 않고 Redis List만으로도 이 정도 비동기 파이프라인이 나온다. &ldquo;느려서 못 기다리겠다&quot;는 문제를 만났을 때, 모듈 사이에 큐 하나 끼우는 것만으로 구조가 얼마나 유연해지는지를 배운 작업이었다. 물론 트래픽이 더 커지거나 메시지 보장이 중요해지면 그땐 전용 브로커를 봐야겠지만.. 지금 규모엔 이게 딱 맞았다.</p>
`,date:"2026.09.15",summary:`문제: 느린 DB 조회가 파이프라인을 붙잡는다 두 모듈이 하나의 파이프라인으로 이어지는 상황이 있었다. 앞 모듈(선행 모듈)이 어떤 작업을 마치면 그 결과로 DB에서 무언가를 조회할 key를 만들어내고, 뒤 모듈(내 모듈)이 그 key로 DB를 조회해서 후속 처리를 한다.
문제는 이 DB 조회가 느리다는 것이었다. 데이터가 잔뜩 쌓인 테이블에서 큰 바이너리(이미지 blob 같은)를 꺼내와야 했고, 한 건당 시간이 제법 걸렸다. 두 모듈을 그냥 함수 호출로 직결하면, 앞 모듈은 뒤 모듈의 느린 조회가 끝날 때까지 매번 기다려야 한다. 앞 모듈도 나름 추론 등 할 일이 있는데 뒤 모듈의 I/O에 발이 묶이는 것.
`,thumb:"/images/book-default.svg",title:"[Redis] 리스트로 비동기 작업 큐 만들기 — 모듈 분리, 재시도, 부하 분산",url:"/posts/redis-async-queue/"},{content:`<h2 id="들어가며">들어가며</h2>
<p>추론 최적화를 위해 TensorRT 버전을 올리는 건 흔한 일이다. 그런데 메이저 버전(10, 11)을 넘어가면 &ldquo;그냥 버전만 바뀐 것&quot;이 아니라 <strong>동작 모델 자체가 달라지는</strong> 지점들이 있었다. 올리는 과정에서 마주친 세 가지를 적어둔다. 셋 다 처음엔 원인이 안 보여서 한참 헤맸던 것들이라, 나중의 나(혹은 같은 삽질을 할 누군가)를 위해 남긴다.</p>
<h2 id="1-trtexec---fp16이-사라졌다--fp16은-이제-onnx에서-결정된다">1. <code>trtexec --fp16</code>이 사라졌다 — fp16은 이제 ONNX에서 결정된다</h2>
<p>ONNX를 엔진으로 변환할 때 <code>trtexec --onnx=... --saveEngine=... --fp16</code> 식으로 fp16을 켜던 습관이 있었다. 그런데 버전을 올리고 나니 <strong><code>--fp16</code> 옵션이 없다</strong>고 나온다. <code>--int8</code>, <code>--best</code> 같은 정밀도 플래그도 마찬가지.</p>
<h3 id="왜-사라졌나--strongly-typed-network">왜 사라졌나 — strongly typed network</h3>
<p>TensorRT 10부터 <strong>strongly typed network</strong>가 기본 모드가 됐다(11에선 사실상 유일한 모드).</p>
<ul>
<li>예전 방식에서는 빌더가 정밀도를 <strong>자유롭게 바꿀 수 있었다.</strong> <code>--fp16</code>은 &ldquo;빌더야, fp16 써도 돼&quot;라고 <strong>허용</strong>하는 플래그였다. 빌더가 레이어마다 어떤 정밀도가 빠를지 판단해서 섞어 썼다.</li>
<li>strongly typed에서는 빌더가 <strong>정밀도를 임의로 안 바꾼다.</strong> ONNX 그래프에 적힌 dtype을 <strong>그대로</strong> 따른다.</li>
<li>그러니 &ldquo;빌더에게 허용한다&quot;는 의미의 <code>--fp16</code>은 존재 이유가 없어졌고, 그래서 제거됐다.</li>
</ul>
<h3 id="그럼-fp16-엔진은-어떻게-만드나">그럼 fp16 엔진은 어떻게 만드나</h3>
<p><strong>ONNX 자체를 fp16으로 export</strong>하면 된다. 정밀도 결정 시점이 &ldquo;엔진 빌드&quot;에서 &ldquo;ONNX export&quot;로 앞당겨진 것.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># export 시점에 정밀도를 결정한다. half=True면 fp16 ONNX가 나온다.</span>
</span></span><span class="line"><span class="cl"><span class="n">model</span><span class="o">.</span><span class="n">export</span><span class="p">(</span><span class="nb">format</span><span class="o">=</span><span class="s2">&#34;onnx&#34;</span><span class="p">,</span> <span class="n">imgsz</span><span class="o">=</span><span class="n">IMG_SIZE</span><span class="p">,</span> <span class="n">half</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span>
</span></span><span class="line"><span class="cl">             <span class="n">dynamic</span><span class="o">=</span><span class="kc">False</span><span class="p">,</span> <span class="n">simplify</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">opset</span><span class="o">=</span><span class="mi">12</span><span class="p">,</span> <span class="n">nms</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="c1"># trtexec에서는 --fp16을 뺀다. ONNX의 dtype을 그대로 따른다.</span>
</span></span><span class="line"><span class="cl">trtexec --onnx<span class="o">=</span>model.onnx --saveEngine<span class="o">=</span>model.engine
</span></span></code></pre></td></tr></table>
</div>
</div><p>바뀌고 나서 오히려 좋아진 점.. 변환 스크립트와 런타임이 <strong>정밀도에 무관</strong>해진다. <code>trtexec</code>는 ONNX dtype을 그대로 따르니 fp16이든 fp32든 같은 명령으로 변환되고, 런타임도 엔진에서 dtype을 읽어(<code>trt.nptype(get_tensor_dtype(name))</code>) 버퍼를 할당하면 분기 없이 돈다. <strong>정밀도를 바꾸고 싶으면 export의 <code>half</code>만 고치고 다시 만들면 끝</strong>이다.</p>
<h2 id="2-엔진이-조용히-none으로-로드된다--버전-종속성">2. 엔진이 조용히 <code>None</code>으로 로드된다 — 버전 종속성</h2>
<p>다른 환경에 배포했더니 이런 에러가 났다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">&#39;NoneType&#39; object has no attribute &#39;create_execution_context&#39;
</span></span></code></pre></td></tr></table>
</div>
</div><p><code>create_execution_context</code>를 호출하는 객체가 <code>None</code>이라는 건, 그 앞 단계인 <code>deserialize_cuda_engine()</code>이 <strong>엔진 객체 대신 <code>None</code>을 돌려줬다</strong>는 뜻이다. 그런데 예외를 던지는 게 아니라 <strong>조용히 <code>None</code>을 반환</strong>하니 원인이 한눈에 안 보인다.. 이런 게 제일 짜증난다.</p>
<h3 id="원인--엔진-플랜은-빌드한-trt-버전에-종속된다">원인 — 엔진 플랜은 빌드한 TRT 버전에 종속된다</h3>
<p>TensorRT 엔진(플랜) 파일은 <strong>범용 포맷이 아니다.</strong> 그걸 빌드한 TensorRT 버전에 종속되고, <strong>로드하는 쪽 버전이 다르면 deserialize가 실패</strong>한다. 그리고 그 실패가 예외가 아니라 <code>None</code> 반환으로 나타난다.</p>
<p>특히 헷갈렸던 건, 버전이 <strong>세 군데</strong>에서 어긋날 수 있다는 점이었다.</p>
<table>
	<thead>
			<tr>
					<th>어디</th>
					<th>무엇</th>
			</tr>
	</thead>
	<tbody>
			<tr>
					<td>엔진 파일</td>
					<td>어떤 TRT 버전으로 <strong>빌드</strong>됐는가</td>
			</tr>
			<tr>
					<td>실행 컨테이너/환경</td>
					<td>어떤 TRT 버전이 <strong>설치</strong>돼 있는가</td>
			</tr>
			<tr>
					<td>배포 번들이 싣고 있는 <code>.so</code></td>
					<td>패키징 도구가 함께 묶은 <code>libnvinfer.so.*</code> 버전</td>
			</tr>
	</tbody>
</table>
<p>특히 세 번째가 함정이었다. 실행 파일을 standalone으로 패키징하는 도구(예: Nuitka/PyInstaller류)는 의존 라이브러리를 함께 번들하는데, 그 번들의 <code>RPATH</code>가 <code>$ORIGIN</code>으로 잡히면 <strong>번들 안의 <code>.so</code>가 시스템에 설치된 것보다 우선 로드</strong>된다. 즉 컨테이너에 올바른 TRT를 깔아놨어도, 번들이 다른 버전을 싣고 있으면 그쪽이 이긴다.</p>
<h3 id="엔진-파일의-빌드-버전-확인법">엔진 파일의 빌드 버전 확인법</h3>
<p>플랜 파일 헤더에 빌드 버전이 박혀 있어서, 바이너리를 직접 들여다보면 확인할 수 있다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl"><span class="c1"># 플랜 헤더 오프셋 0x18 부근에 버전 바이트가 있다</span>
</span></span><span class="line"><span class="cl">xxd -s 0x18 -l <span class="m">4</span> model.engine
</span></span><span class="line"><span class="cl"><span class="c1"># 예: 0b 02 01 02  -&gt; 11.2.1.2</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h3 id="해결-원칙">해결 원칙</h3>
<p>교훈은 단순하다. <strong>엔진 생성 · (번들 빌드) · 실행을 모두 같은 TensorRT 버전에서 하라.</strong> 특히 standalone 번들을 쓴다면 엔진/번들/실행환경 <strong>세 곳의 TRT 버전이 반드시 일치</strong>해야 한다. 버전을 올릴 땐 엔진을 반드시 <strong>재생성</strong>하는 걸 체크리스트에 박아두는 게 안전하다.</p>
<h2 id="3-apt-메타패키지만-pin하면-소용없다">3. apt 메타패키지만 pin하면 소용없다</h2>
<p>Docker 이미지에서 특정 TensorRT 버전을 설치하려고 메타패키지에 버전을 붙였다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-dockerfile" data-lang="dockerfile"><span class="line"><span class="cl">apt-get install -y <span class="nv">tensorrt</span><span class="o">=</span>10.8.0.43-1+cuda12.8<span class="err">
</span></span></span></code></pre></td></tr></table>
</div>
</div><p>그런데 빌드가 이렇게 깨진다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">tensorrt : Depends: libnvinfer10 (= 10.8.0.43-...) but 10.16.x is to be installed
</span></span><span class="line"><span class="cl">           Depends: libnvinfer-bin (= 10.8.0.43-...) but 11.2.x is to be installed
</span></span><span class="line"><span class="cl">           ...
</span></span><span class="line"><span class="cl">E: Unable to correct problems, you have held broken packages.
</span></span></code></pre></td></tr></table>
</div>
</div><h3 id="원인--하위-패키지가-최신으로-끌려간다">원인 — 하위 패키지가 최신으로 끌려간다</h3>
<p>CUDA 베이스 이미지에는 <strong>NVIDIA 공식 apt 저장소가 이미 등록</strong>돼 있고, 거기엔 더 높은 버전의 TensorRT 패키지들이 있다. <code>tensorrt</code> <strong>메타패키지에만</strong> 버전을 고정하면, apt는 그 하위 의존 패키지(<code>libnvinfer10</code>, <code>libnvinfer-bin</code> 등)를 여전히 저장소의 <strong>최신 버전</strong>으로 고르려 한다. 그 결과 메타패키지의 <code>=</code> 제약과 충돌해서 &ldquo;held broken packages&quot;가 된다.</p>
<p>에러 맨 끝에 뜨는 <code>libnvinfer-samples ... not going to be installed</code>는 <strong>증상이지 원인이 아니다.</strong> 마지막 줄만 보고 그 패키지를 따로 설치하려 들면 헤맨다. 전체 에러를 보면 여러 하위 패키지가 다 최신으로 끌려가고 있음이 보인다.</p>
<h3 id="해결--apt-preferencespin로-관련-패키지-전체를-고정">해결 — apt preferences(pin)로 관련 패키지 전체를 고정</h3>
<p>메타패키지 하나가 아니라 <strong>TensorRT 관련 패키지 전체</strong>를 pin으로 묶어야 한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-dockerfile" data-lang="dockerfile"><span class="line"><span class="cl"><span class="c"># 로컬 repo .deb 등록 후</span><span class="err">
</span></span></span><span class="line"><span class="cl"><span class="k">RUN</span> <span class="nb">printf</span> <span class="s1">&#39;Package: tensorrt* libnvinfer* libnvonnxparsers* python3-libnvinfer*\\nPin: version 10.8.0.43-1+cuda12.8\\nPin-Priority: 1001\\n&#39;</span> <span class="se">\\
</span></span></span><span class="line"><span class="cl">        &gt; /etc/apt/preferences.d/tensorrt <span class="se">\\
</span></span></span><span class="line"><span class="cl">    <span class="o">&amp;&amp;</span> apt-get update <span class="se">\\
</span></span></span><span class="line"><span class="cl">    <span class="o">&amp;&amp;</span> apt-get install -y tensorrt python3-libnvinfer-dev<span class="err">
</span></span></span></code></pre></td></tr></table>
</div>
</div><ul>
<li>와일드카드(<code>libnvinfer*</code> 등)로 <strong>하위 패키지까지 전부</strong> 같은 버전으로 고정</li>
<li><code>Pin-Priority: 1001</code> — 다운그레이드까지 허용하는 최우선 순위</li>
<li>pin 파일이 이미지에 남으니 <strong>이후 <code>apt upgrade</code>로 TRT가 올라가는 것도 방지</strong>된다</li>
<li>파이썬 바인딩은 <code>python3-libnvinfer-dev</code>로 들어오므로 별도 <code>pip install tensorrt</code>가 필요 없다</li>
</ul>
<p>검증은 실제 설치 전에 시뮬레이션으로 해두는 걸 추천한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-bash" data-lang="bash"><span class="line"><span class="cl">apt-get install -s tensorrt   <span class="c1"># -s: 실제 설치 없이 해소 결과만 확인</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>모든 <code>libnvinfer*</code> 패키지의 candidate가 목표 버전으로 잡히는지 확인하고 나서 실제 빌드에 들어가면, 이미지 한 번 빌드하는 데 드는 시간을 아낄 수 있다.</p>
<h2 id="정리--tensorrt-메이저-버전-올릴-때-체크리스트">정리 — TensorRT 메이저 버전 올릴 때 체크리스트</h2>
<ol>
<li><strong>정밀도</strong>: <code>trtexec --fp16</code>은 없어졌다. fp16은 <strong>ONNX export 시점</strong>(<code>half=True</code>)에 결정한다. (strongly typed network 때문)</li>
<li><strong>엔진 재생성</strong>: 엔진 플랜은 빌드한 TRT 버전에 종속된다. 버전 올리면 <strong>엔진을 반드시 다시 만든다.</strong> 안 맞으면 <code>deserialize</code>가 조용히 <code>None</code>.</li>
<li><strong>번들 주의</strong>: standalone 패키징을 쓰면 번들의 <code>.so</code>가 <code>RPATH=$ORIGIN</code>으로 우선 로드된다. <strong>엔진 / 번들 / 실행환경 세 곳의 TRT 버전 일치</strong>를 확인.</li>
<li><strong>apt pin</strong>: 메타패키지만 고정하면 하위 패키지가 최신으로 끌려간다. <code>libnvinfer*</code> 등 <strong>관련 패키지 전체를 pin</strong>한다.</li>
<li><strong>실제 버전 확인</strong>: <code>dpkg -l | grep libnvinfer</code>, <code>trtexec --help | head -1</code>, 엔진은 <code>xxd -s 0x18 -l 4</code>로 교차 확인.</li>
</ol>
<p>메이저 버전 업그레이드는 &ldquo;숫자만 바뀌는 일&quot;이 아니라 빌더의 동작 방식, 아티팩트의 호환성, 패키지 의존성이 같이 움직이는 일이었다. 이 다섯 개만 미리 체크했어도 며칠은 아꼈을 것 같아서.. 기록으로 남긴다.</p>
`,date:"2026.09.13",summary:`들어가며 추론 최적화를 위해 TensorRT 버전을 올리는 건 흔한 일이다. 그런데 메이저 버전(10, 11)을 넘어가면 “그냥 버전만 바뀐 것"이 아니라 동작 모델 자체가 달라지는 지점들이 있었다. 올리는 과정에서 마주친 세 가지를 적어둔다. 셋 다 처음엔 원인이 안 보여서 한참 헤맸던 것들이라, 나중의 나(혹은 같은 삽질을 할 누군가)를 위해 남긴다.
1. trtexec --fp16이 사라졌다 — fp16은 이제 ONNX에서 결정된다 ONNX를 엔진으로 변환할 때 trtexec --onnx=... --saveEngine=... --fp16 식으로 fp16을 켜던 습관이 있었다. 그런데 버전을 올리고 나니 --fp16 옵션이 없다고 나온다. --int8, --best 같은 정밀도 플래그도 마찬가지.
`,thumb:"/images/book-default.svg",title:"[TensorRT] 10/11로 올리며 만난 삽질 — 사라진 --fp16, 엔진 버전 종속성, apt pin",url:"/posts/tensorrt-10-11-upgrade/"},{content:`<h2 id="증상-에러는-없는데-아무것도-안-잡힌다">증상: 에러는 없는데 아무것도 안 잡힌다</h2>
<p>YOLO 모델을 TensorRT 엔진으로 변환해서 추론 코드에 물렸다. 변환도 성공, 엔진 로드도 되고, 실행하면 프로세스가 멀쩡히 돈다. 로그에 예외도 없다. 그런데 <strong>검출 결과가 0개다.</strong> 분명 화면엔 객체가 있는데 하나도 안 잡힌다.</p>
<p>이런 종류의 버그가 제일 고약하다. 에러가 나면 스택 트레이스라도 따라가는데, <strong>아무 일도 안 일어난 것처럼 조용히 틀린 결과</strong>가 나오면 어디부터 봐야 할지 막막하다.</p>
<p>결론부터 말하면, 원인은 <strong>ONNX export 때 출력 텐서 레이아웃이 바뀌었는데 후처리 코드가 옛날 레이아웃을 그대로 가정하고 있던 것</strong>이었다. 그리고 그 잘못된 가정이 <strong>에러조차 안 내고 통과</strong>해버린 게 문제를 어렵게 만들었다.</p>
<h2 id="배경-yolo의-두-가지-출력-레이아웃">배경: YOLO의 두 가지 출력 레이아웃</h2>
<p>ultralytics로 YOLO를 ONNX로 export할 때, <code>nms</code> 옵션에 따라 출력 형태가 완전히 달라진다.</p>
<p><strong>1) raw 출력 (<code>nms=False</code>)</strong></p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">shape: (1, 4+nc, anchors)
</span></span><span class="line"><span class="cl">내용:  [cx, cy, w, h, class_score_0, class_score_1, ...]
</span></span></code></pre></td></tr></table>
</div>
</div><p>NMS(Non-Maximum Suppression)가 적용되지 않은 원본 예측이다. 수천 개 앵커마다 박스 좌표와 클래스 스코어가 들어 있고, <strong>후처리에서 직접 스코어 필터링 + NMS를 수행</strong>해야 최종 박스가 나온다.</p>
<p><strong>2) end2end 출력 (<code>nms=True</code>)</strong></p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">shape: (1, N, 6)   예: (1, 300, 6)
</span></span><span class="line"><span class="cl">내용:  [x1, y1, x2, y2, conf, cls]
</span></span></code></pre></td></tr></table>
</div>
</div><p>NMS까지 모델 그래프 안에서 끝낸 결과다. 이미 정리된 최대 N개 박스가 나오고, 남는 슬롯은 0으로 패딩된다. 후처리는 <strong>conf 임계값 필터만</strong> 걸면 된다.</p>
<p>이 둘은 <strong>차원 수도, 각 축의 의미도 다르다.</strong> 후처리 코드는 둘 중 하나를 전제로 짜여 있기 마련이다.</p>
<h2 id="함정-1-버전이-올라가면서-출력이-조용히-바뀐다">함정 1: 버전이 올라가면서 출력이 조용히 바뀐다</h2>
<p>여기서 진짜 함정이 있었다. 같은 <code>nms=True</code> 옵션을 줘도 <strong>ultralytics 버전에 따라 실제로 반영되는지가 달랐다.</strong></p>
<p>구버전에서는 export의 <code>nms</code> 옵션이 특정 포맷 전용이라 ONNX엔 적용되지 않는 경우가 있었다. 그래서 <code>nms=True</code>를 줘도 여전히 raw <code>(1, 4+nc, anchors)</code>가 나왔다. 그런데 버전을 올리자 <code>nms=True</code>가 의도대로 동작하기 시작해, 같은 코드·같은 옵션인데 <strong>출력이 end2end <code>(1, N, 6)</code>으로 바뀌어버렸다.</strong></p>
<p>즉 &ldquo;export 스크립트도 안 건드렸는데 어느 날부터 검출이 0개가 됐다&quot;의 배후에는 <strong>라이브러리 업그레이드로 인한 출력 레이아웃 변경</strong>이 있었던 것이다. 모델도 그대로, 내 코드도 그대로였지만 중간 계층의 동작이 바뀐 것.</p>
<blockquote>
<p>교훈: export를 담당하는 라이브러리를 올릴 때는 <strong>출력 텐서 shape이 그대로인지 반드시 확인</strong>해야 한다. 버전 노트에 &ldquo;nms export 지원&rdquo; 류의 변경이 있으면 특히.</p>
</blockquote>
<h2 id="함정-2-틀린-reshape이-에러를-안-낸다">함정 2: 틀린 reshape이 에러를 안 낸다</h2>
<p>가장 안 잡히던 이유가 이거였다. 후처리 코드가 이렇게 되어 있었다고 하자.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="n">output</span> <span class="o">=</span> <span class="n">raw_output</span><span class="o">.</span><span class="n">reshape</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="mi">5</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">)</span>   <span class="c1"># (1, 4+nc, anchors)를 전제</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>원래 raw 출력을 5행(좌표 4 + 클래스 1)으로 펴려는 의도다. 그런데 출력이 end2end <code>(1, 300, 6)</code>으로 바뀌면 전체 원소 수는 <code>300 * 6 = 1800</code>개다. 그리고..</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">1800 = 5 * 360
</span></span></code></pre></td></tr></table>
</div>
</div><p><strong>나누어떨어진다.</strong> 그래서 <code>reshape(1, 5, -1)</code>이 <strong>예외 없이 성공</strong>해버린다. NumPy는 원소 총량만 맞으면 형태를 바꿔주니까, &ldquo;이 데이터가 의미상 5행이 맞는가&quot;는 따지지 않는다.</p>
<p>결과적으로:</p>
<ul>
<li>end2end 출력의 좌표값·conf·cls가 <strong>엉뚱한 자리로 재배치</strong>된다</li>
<li>&ldquo;클래스 스코어&rdquo; 자리에서 읽히는 값이 대부분 패딩된 0</li>
<li>최대 스코어가 0에 가까우니 conf 필터에서 <strong>전부 탈락</strong></li>
<li>→ 에러도 로그 이상도 없이 검출 0개</li>
</ul>
<p>reshape이 실패해서 예외라도 났으면 30분이면 잡았을 걸.. &ldquo;성공한 reshape&quot;이라 며칠을 헤맬 수 있는 함정이다.</p>
<h2 id="원인을-어떻게-찾았나-출력을-직접-덤프">원인을 어떻게 찾았나: 출력을 직접 덤프</h2>
<p>추측으론 못 잡는다. 결국 <strong>엔진을 로드해서 출력 텐서의 shape과 실제 값을 그대로 찍어봤다.</strong></p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># 엔진에서 나온 raw 버퍼를 아무 가정 없이 그대로 관찰</span>
</span></span><span class="line"><span class="cl"><span class="nb">print</span><span class="p">(</span><span class="s2">&#34;raw output shape:&#34;</span><span class="p">,</span> <span class="n">out</span><span class="o">.</span><span class="n">shape</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="nb">print</span><span class="p">(</span><span class="s2">&#34;sample values:&#34;</span><span class="p">,</span> <span class="n">out</span><span class="o">.</span><span class="n">reshape</span><span class="p">(</span><span class="o">-</span><span class="mi">1</span><span class="p">)[:</span><span class="mi">24</span><span class="p">])</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>찍어보니 shape이 <code>(1, 300, 6)</code>이고, 앞 4개 값이 픽셀 좌표 스케일(수백 단위), 5번째 값이 0.7~0.9 구간의 confidence라는 게 바로 보였다. &ldquo;아, 이건 raw가 아니라 end2end구나&quot;가 그 순간 확정됐다. <strong>가정을 코드에 박아두지 말고 실제 텐서를 관찰하는 것</strong> — 이게 이런 류 버그의 유일한 지름길이다.</p>
<h2 id="해결-출력-shape을-읽어-후처리를-자동-분기">해결: 출력 shape을 읽어 후처리를 자동 분기</h2>
<p>근본 해법은 &ldquo;어떤 export로 만든 엔진이든 코드 수정 없이 동작하게&rdquo; 만드는 것이다. 엔진 로드 시점에 출력 shape을 읽어두고, 그에 따라 후처리 경로를 나눈다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span><span class="lnt">7
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># 엔진 로드 후: 출력 텐서 형태로 레이아웃 판별</span>
</span></span><span class="line"><span class="cl"><span class="bp">self</span><span class="o">.</span><span class="n">output_shape</span> <span class="o">=</span> <span class="nb">tuple</span><span class="p">(</span><span class="n">output_binding_shape</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="c1"># (1, N, 6)이면 end2end, 아니면 raw</span>
</span></span><span class="line"><span class="cl"><span class="bp">self</span><span class="o">.</span><span class="n">end2end</span> <span class="o">=</span> <span class="nb">len</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">output_shape</span><span class="p">)</span> <span class="o">==</span> <span class="mi">3</span> <span class="ow">and</span> <span class="bp">self</span><span class="o">.</span><span class="n">output_shape</span><span class="p">[</span><span class="o">-</span><span class="mi">1</span><span class="p">]</span> <span class="o">==</span> <span class="mi">6</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="nb">print</span><span class="p">(</span><span class="sa">f</span><span class="s2">&#34;OUTPUT SHAPE: </span><span class="si">{</span><span class="bp">self</span><span class="o">.</span><span class="n">output_shape</span><span class="si">}</span><span class="s2"> -&gt; &#34;</span>
</span></span><span class="line"><span class="cl">      <span class="sa">f</span><span class="s2">&#34;</span><span class="si">{</span><span class="s1">&#39;end2end(NMS 포함)&#39;</span> <span class="k">if</span> <span class="bp">self</span><span class="o">.</span><span class="n">end2end</span> <span class="k">else</span> <span class="s1">&#39;raw(직접 NMS)&#39;</span><span class="si">}</span><span class="s2">&#34;</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>후처리는 이렇게 분기한다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span><span class="lnt">12
</span><span class="lnt">13
</span><span class="lnt">14
</span><span class="lnt">15
</span><span class="lnt">16
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="n">output</span> <span class="o">=</span> <span class="n">raw_output</span><span class="o">.</span><span class="n">reshape</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">output_shape</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="k">if</span> <span class="bp">self</span><span class="o">.</span><span class="n">end2end</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">    <span class="c1"># (1, N, 6): 이미 NMS 완료. conf 필터만.</span>
</span></span><span class="line"><span class="cl">    <span class="n">dets</span> <span class="o">=</span> <span class="n">output</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span>
</span></span><span class="line"><span class="cl">    <span class="n">keep</span> <span class="o">=</span> <span class="n">dets</span><span class="p">[:,</span> <span class="mi">4</span><span class="p">]</span> <span class="o">&gt;</span> <span class="n">conf_thres</span>
</span></span><span class="line"><span class="cl">    <span class="n">boxes</span>  <span class="o">=</span> <span class="n">dets</span><span class="p">[</span><span class="n">keep</span><span class="p">,</span> <span class="p">:</span><span class="mi">4</span><span class="p">]</span>
</span></span><span class="line"><span class="cl">    <span class="n">scores</span> <span class="o">=</span> <span class="n">dets</span><span class="p">[</span><span class="n">keep</span><span class="p">,</span> <span class="mi">4</span><span class="p">]</span>
</span></span><span class="line"><span class="cl">    <span class="n">classes</span> <span class="o">=</span> <span class="n">dets</span><span class="p">[</span><span class="n">keep</span><span class="p">,</span> <span class="mi">5</span><span class="p">]</span>
</span></span><span class="line"><span class="cl"><span class="k">else</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">    <span class="c1"># (1, 4+nc, A): xyxy 변환 + NMS 직접 수행</span>
</span></span><span class="line"><span class="cl">    <span class="n">pred</span> <span class="o">=</span> <span class="n">output</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span><span class="o">.</span><span class="n">transpose</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="mi">0</span><span class="p">)</span>   <span class="c1"># (A, 4+nc)</span>
</span></span><span class="line"><span class="cl">    <span class="n">boxes</span>  <span class="o">=</span> <span class="n">pred</span><span class="p">[:,</span> <span class="p">:</span><span class="mi">4</span><span class="p">]</span>
</span></span><span class="line"><span class="cl">    <span class="n">scores</span> <span class="o">=</span> <span class="n">pred</span><span class="p">[:,</span> <span class="mi">4</span><span class="p">:]</span><span class="o">.</span><span class="n">max</span><span class="p">(</span><span class="n">axis</span><span class="o">=</span><span class="mi">1</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="n">classes</span> <span class="o">=</span> <span class="n">pred</span><span class="p">[:,</span> <span class="mi">4</span><span class="p">:]</span><span class="o">.</span><span class="n">argmax</span><span class="p">(</span><span class="n">axis</span><span class="o">=</span><span class="mi">1</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="c1"># ... NMS ...</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>이제 시작 로그의 <code>OUTPUT SHAPE:</code> 한 줄만 보면 어느 경로를 타는지 즉시 안다. 다음에 또 export 방식이 바뀌어도 코드는 그대로 두면 된다.</p>
<h2 id="보너스-함정-cv2dnnnmsboxes는-xywh를-받는다">보너스 함정: <code>cv2.dnn.NMSBoxes</code>는 xywh를 받는다</h2>
<p>raw 경로에서 NMS를 직접 돌릴 때 또 하나 실수하기 쉬운 지점이 있다. OpenCV의 NMS 함수는 박스를 <strong><code>[x, y, w, h]</code> 형식으로 받는다.</strong> xyxy(좌상단·우하단 좌표)를 그대로 넘기면 <code>x2</code>·<code>y2</code>를 너비·높이로 오해해서 박스가 실제보다 훨씬 크게 잡힌다. 그러면 IoU가 과대평가되고, 겹치지도 않은 정상 객체까지 억제돼 검출 수가 줄어든다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span><span class="lnt">7
</span><span class="lnt">8
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># xyxy -&gt; xywh 변환 후 넘겨야 한다</span>
</span></span><span class="line"><span class="cl"><span class="n">boxes_xywh</span> <span class="o">=</span> <span class="n">np</span><span class="o">.</span><span class="n">column_stack</span><span class="p">([</span>
</span></span><span class="line"><span class="cl">    <span class="n">boxes_xyxy</span><span class="p">[:,</span> <span class="mi">0</span><span class="p">],</span>                      <span class="c1"># x</span>
</span></span><span class="line"><span class="cl">    <span class="n">boxes_xyxy</span><span class="p">[:,</span> <span class="mi">1</span><span class="p">],</span>                      <span class="c1"># y</span>
</span></span><span class="line"><span class="cl">    <span class="n">boxes_xyxy</span><span class="p">[:,</span> <span class="mi">2</span><span class="p">]</span> <span class="o">-</span> <span class="n">boxes_xyxy</span><span class="p">[:,</span> <span class="mi">0</span><span class="p">],</span>   <span class="c1"># w</span>
</span></span><span class="line"><span class="cl">    <span class="n">boxes_xyxy</span><span class="p">[:,</span> <span class="mi">3</span><span class="p">]</span> <span class="o">-</span> <span class="n">boxes_xyxy</span><span class="p">[:,</span> <span class="mi">1</span><span class="p">],</span>   <span class="c1"># h</span>
</span></span><span class="line"><span class="cl"><span class="p">])</span>
</span></span><span class="line"><span class="cl"><span class="n">indices</span> <span class="o">=</span> <span class="n">cv2</span><span class="o">.</span><span class="n">dnn</span><span class="o">.</span><span class="n">NMSBoxes</span><span class="p">(</span><span class="n">boxes_xywh</span><span class="o">.</span><span class="n">tolist</span><span class="p">(),</span> <span class="n">scores</span><span class="o">.</span><span class="n">tolist</span><span class="p">(),</span> <span class="n">conf</span><span class="p">,</span> <span class="n">iou</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>이것도 에러 없이 &ldquo;그냥 검출이 좀 적게 되는&rdquo; 형태로 나타나서, 알고 보지 않으면 모델 성능 탓으로 오해하기 쉽다.</p>
<h2 id="정리">정리</h2>
<ul>
<li>YOLO의 ONNX 출력은 <code>nms</code> 옵션에 따라 <strong>raw <code>(1,4+nc,A)</code></strong> 와 <strong>end2end <code>(1,N,6)</code></strong> 두 레이아웃이 있고, 후처리가 완전히 다르다.</li>
<li><strong>라이브러리 버전이 올라가면 같은 옵션이라도 출력 레이아웃이 바뀔 수 있다.</strong> export 툴 업그레이드 후엔 출력 shape을 꼭 재확인.</li>
<li>틀린 <code>reshape</code>이 <strong>원소 수만 맞으면 조용히 성공</strong>하기 때문에, 에러 없이 검출 0개가 되는 함정이 생긴다.</li>
<li>해결은 <strong>가정을 박지 말고 엔진 출력 shape을 읽어 후처리를 자동 분기</strong>하는 것. 시작 로그에 shape을 찍어두면 진단이 즉시 된다.</li>
<li><code>cv2.dnn.NMSBoxes</code>는 <strong>xywh</strong>를 받는다. xyxy를 그대로 주면 조용히 검출이 줄어든다.</li>
</ul>
<p>&ldquo;에러가 안 나는 버그&quot;를 만났을 때의 교훈은 하나로 모인다 — <strong>중간 산출물(여기선 엔진 출력 텐서)을 가정하지 말고 직접 찍어봐라.</strong> 그 한 번의 <code>print</code>가 며칠을 아낀다.</p>
<p>다음 글에서는 이 엔진을 만드는 단계에서 겪은 <strong>TensorRT 10/11 업그레이드 이슈</strong>(fp16이 사라진 이유, 엔진 버전 종속성)를 정리한다.</p>
`,date:"2026.09.13",summary:`증상: 에러는 없는데 아무것도 안 잡힌다 YOLO 모델을 TensorRT 엔진으로 변환해서 추론 코드에 물렸다. 변환도 성공, 엔진 로드도 되고, 실행하면 프로세스가 멀쩡히 돈다. 로그에 예외도 없다. 그런데 검출 결과가 0개다. 분명 화면엔 객체가 있는데 하나도 안 잡힌다.
이런 종류의 버그가 제일 고약하다. 에러가 나면 스택 트레이스라도 따라가는데, 아무 일도 안 일어난 것처럼 조용히 틀린 결과가 나오면 어디부터 봐야 할지 막막하다.
결론부터 말하면, 원인은 ONNX export 때 출력 텐서 레이아웃이 바뀌었는데 후처리 코드가 옛날 레이아웃을 그대로 가정하고 있던 것이었다. 그리고 그 잘못된 가정이 에러조차 안 내고 통과해버린 게 문제를 어렵게 만들었다.
`,thumb:"/images/book-default.svg",title:"[YOLO] TensorRT로 바꿨더니 검출이 0개? — 출력 레이아웃 함정",url:"/posts/yolo-tensorrt-output-layout/"},{content:`<h2 id="문제-rtsp는-브라우저가-못-읽는다">문제: RTSP는 브라우저가 못 읽는다</h2>
<p>앞 글에서 IP 카메라의 RTSP 스트림을 받아오는 데는 성공했다. 이제 이걸 <strong>웹 화면에서 실시간으로</strong> 보여주고 싶었다. 관리자용 CMS든 모니터링 대시보드든, 결국 사용자는 브라우저에서 영상을 본다.</p>
<p>처음엔 순진하게 이렇게 생각했다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-html" data-lang="html"><span class="line"><span class="cl"><span class="p">&lt;</span><span class="nt">video</span> <span class="na">src</span><span class="o">=</span><span class="s">&#34;rtsp://.../stream&#34;</span> <span class="na">controls</span><span class="p">&gt;&lt;/</span><span class="nt">video</span><span class="p">&gt;</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p><strong>안 된다.</strong> 브라우저의 <code>&lt;video&gt;</code> 태그는 RTSP를 지원하지 않는다. HTTP(S)로 서빙되는 MP4나, HLS/DASH 같은 HTTP 기반 스트리밍, 아니면 WebRTC로만 영상을 받을 수 있다. RTSP는 태생이 브라우저용이 아니다.. 그래서 <strong>RTSP를 브라우저가 알아듣는 형식으로 중간에서 변환해주는 서버</strong>가 반드시 필요하다.</p>
<p>여기서부터 &ldquo;그럼 뭘로 변환하지?&ldquo;라는 선택의 문제가 시작됐다.</p>
<h2 id="시도-1-hls--되긴-되는데-느리다">시도 1: HLS — 되긴 되는데 느리다</h2>
<p>제일 먼저 손이 간 건 HLS(HTTP Live Streaming)였다. 자료도 많고 원리도 단순하다. 영상을 몇 초짜리 조각(segment)으로 잘라 <code>.ts</code>/<code>.m4s</code>로 만들고, 재생목록(<code>.m3u8</code>)을 통해 브라우저가 순서대로 받아 재생한다. HTTP 기반이라 방화벽·CDN 친화적이고 안정적이다.</p>
<p>문제는 **지연(latency)**이었다.</p>
<p>HLS는 구조적으로 세그먼트를 만들고 → 여러 개 쌓은 뒤 → 재생목록에 올려야 브라우저가 받아간다. 이 과정에서 보통 수 초에서 십수 초 지연이 생긴다. VOD나 라이브 방송이면 괜찮은데, <strong>CCTV 모니터링처럼 &ldquo;지금 이 순간&quot;을 봐야 하는 용도엔 치명적</strong>이다. 게이트 앞에 누가 서 있는지를 10초 늦게 보는 건 실시간이라 부르기 어렵다.</p>
<p>Low-Latency HLS(LL-HLS)로 줄일 수는 있지만 설정이 까다롭고, 그렇게까지 해도 WebRTC의 지연을 따라오긴 어렵다. &ldquo;실시간&quot;이 핵심 요구라면 방향을 바꿔야 했다. 개인적으로 <strong>실시간이 아니어도 되는 용도면 HLS가 훨씬 편하다.</strong> 실시간이 진짜 필요할 때만 아래로 넘어가는 걸 추천한다.</p>
<h2 id="시도-2-webrtc--진짜-실시간-대신-개념의-벽">시도 2: WebRTC — 진짜 실시간, 대신 개념의 벽</h2>
<p>실시간 저지연이 필요하면 결국 <strong>WebRTC</strong>다. 원래 화상회의용으로 만들어진 기술이라 <strong>1초 미만 지연</strong>을 목표로 하고, 브라우저에 기본 내장돼 있어 플러그인도 필요 없다.</p>
<p>그런데 WebRTC는 &ldquo;쉽게 되는&rdquo; 기술이 아니었다. HLS가 &ldquo;파일을 HTTP로 주는&rdquo; 단순한 모델이었다면, WebRTC는 <strong>두 피어(peer)가 서로를 찾아 직접 연결을 맺는</strong> 훨씬 복잡한 모델이다. 여기서 처음 듣는 개념들이 쏟아졌다.. 솔직히 이 부분은 지금도 완벽히 안다고는 못 하겠고, 내가 이해한 만큼만 적어둔다.</p>
<h3 id="ice-stun-turn이-뭔가">ICE, STUN, TURN이 뭔가</h3>
<p>WebRTC 연결을 이해하려면 이 셋은 알아야 했다.</p>
<ul>
<li><strong>ICE (Interactive Connectivity Establishment)</strong> — 두 피어가 연결 가능한 경로(후보, candidate)를 여러 개 모으고, 그중 실제로 통하는 길을 찾아내는 프레임워크. &ldquo;어떻게든 서로 닿는 길을 찾는&rdquo; 전체 절차라고 보면 된다.</li>
<li><strong>STUN (Session Traversal Utilities for NAT)</strong> — 대부분의 기기는 공유기(NAT) 뒤에 있어서 자기 <strong>공인 IP를 모른다.</strong> STUN 서버가 &ldquo;네가 밖에서 보이는 주소는 이거야&quot;라고 알려준다. NAT 뒤 피어들이 서로의 실제 주소를 알아내 직접 연결(P2P)하게 돕는다.</li>
<li><strong>TURN (Traversal Using Relays around NAT)</strong> — STUN으로도 직접 연결이 안 되는 까다로운 네트워크(대칭형 NAT 등)에서는 TURN 서버가 **중계(relay)**를 해준다. P2P가 실패했을 때의 우회로다.</li>
</ul>
<p>이 개념들을 모르고 예제 코드만 따라 하면 &ldquo;로컬에선 되는데 다른 네트워크에선 연결이 안 되는&rdquo; 상황에 부딪힌다. 나도 그랬다.. 원인이 NAT traversal이라는 걸 이해하고 나서야 왜 STUN이 필요한지 납득이 됐다.</p>
<p>찾아보니 <strong>coturn</strong>이라는 오픈소스로 STUN/TURN 서버를 직접 띄울 수 있었다. 공개 STUN 서버를 쓸 수도 있지만, 폐쇄망이나 자체 인프라에서는 coturn으로 직접 운영하는 게 안정적이다.</p>
<h3 id="시그널링핸드셰이크은-webrtc에-안-들어있다">시그널링(핸드셰이크)은 WebRTC에 안 들어있다</h3>
<p>제일 헷갈렸던 부분. WebRTC 연결은 시작 전에 두 피어가 <strong>서로의 정보를 교환</strong>해야 한다. 이걸 시그널링(signaling)이라 한다.</p>
<ul>
<li>한쪽이 <strong>Offer</strong>(SDP: 내가 지원하는 코덱, 미디어 정보 등)를 만들어 보낸다</li>
<li>상대가 <strong>Answer</strong>(SDP)로 응답한다</li>
<li>양쪽이 모은 <strong>ICE candidate</strong>(연결 후보 경로)를 주고받는다</li>
</ul>
<p>여기서 결정적으로 막혔던 건, <strong>이 교환을 WebRTC가 대신 해주지 않는다</strong>는 점이었다. WebRTC 표준은 &ldquo;무엇을 교환할지&quot;만 정하고, &ldquo;어떻게 전달할지&quot;는 개발자에게 맡긴다. 그래서 Offer/Answer/candidate를 실어 나를 <strong>별도 통신 채널(WebSocket, HTTP 등)을 직접 만들어야</strong> 한다. &ldquo;핸드셰이킹이 안 된다&quot;고 헤맸던 이유가 이거였다.. 연결을 맺어주는 시그널링 경로 자체를 내가 마련해야 하는 줄 몰랐던 것.</p>
<p>이 구조를 이해하고 나니 흐름이 정리됐다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">피어 A ──(Offer/SDP)──&gt; [시그널링 서버] ──&gt; 피어 B
</span></span><span class="line"><span class="cl">피어 A &lt;──(Answer/SDP)── [시그널링 서버] &lt;── 피어 B
