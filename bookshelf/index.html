</div><p><code>DELETE FROM image WHERE server_processing_time &lt; ...</code> 로 몇 분씩 갈던 게 <code>DROP PARTITION</code> 한 줄로 순식간에 끝난다. 보관정책이 있는 로그성 테이블이라면 이 하나만으로도 파티셔닝할 값어치가 있다.</p>
<h2 id="실행-전-체크리스트">실행 전 체크리스트</h2>
<p>DDL이 롤백이 안 되는 만큼, 큰 테이블에 적용하기 전엔 이 정도는 보고 들어간다.</p>
<ol>
<li><strong>백업</strong> — <code>mysqldump db image video &gt; backup.sql</code>. 이건 그냥 무조건.</li>
<li><strong>DB 쓰는 프로그램 전부 정지</strong> — 위에서 데인 그거. 운영 중 라이브 재구성은 테이블을 깨먹은 적이 있다. 접근을 끊고(점검 시간대) 진행.</li>
<li><strong>복사본에서 먼저</strong> — 운영 테이블 말고 복제본에 적용해보기.</li>
<li><strong>FK 확인</strong> — 하나라도 있으면 파티셔닝 불가. 설계부터 재검토.</li>
<li><strong>NULL 확인</strong> — PK 될 컬럼에 NULL 있으면 <code>NOT NULL</code> 변환에서 실패.</li>
<li><strong>건수·디스크</strong> — 대용량이면 락·시간·2배 공간 각오, 온라인 도구 검토.</li>
</ol>
<h2 id="mariadb엔-자동-파티셔닝이-없다--그래서-나는-미리-만들어둔다">MariaDB엔 자동 파티셔닝이 없다 — 그래서 나는 미리 만들어둔다</h2>
<p>이렇게 라이브 <code>ALTER</code>가 위험하다 보니, 애초에 그 위험한 작업을 <strong>안 하는</strong> 게 최선이다. 여기서 DB마다 차이가 하나 있다.</p>
<ul>
<li><strong>Oracle</strong>엔 인터벌 파티셔닝(interval partitioning)이 있어서, 새 구간 데이터가 들어오면 <strong>파티션을 알아서 만들어준다.</strong> 손댈 일이 없다.</li>
<li><strong>MariaDB/MySQL엔 그런 자동 생성이 없다.</strong> 찾아보니 정말 없더라.. 미리 만들어두거나, 주기적으로 <code>ADD PARTITION</code> 해주거나 둘 중 하나다.</li>
</ul>
<p>그래서 방법이 갈린다.</p>
<ol>
<li><strong>크론으로 주기적 <code>ADD PARTITION</code></strong> — &ldquo;다음 구간 파티션이 없으면 추가&quot;하는 잡을 돌리는 것. 유연하지만, 이 잡이 <strong>조용히 실패하면</strong> 어느 날 담을 파티션이 없어서 터진다. 운영 의존성이 하나 늘어난다.</li>
<li><strong>설치 시점에 미리 통째로 생성</strong> — 빈 테이블을 만들 때 앞으로 쓸 파티션을 <strong>한꺼번에 다 만들어두는 것.</strong></li>
</ol>
<p>나는 새 장비를 설치하고 DB를 처음 만들 때 <strong>20년치 파티션을 미리 생성</strong>하는 쪽을 택했다. 구간은 데이터가 쌓이는 양에 맞춰 3개월/6개월/1년 중에 골라 잡고. 근거는 이렇다.</p>
<ul>
<li>장비 자체가 보통 <strong>10년쯤이면 교체</strong>된다. 20년치면 수명 내내 파티션이 모자랄 일이 없다.</li>
<li>파티션 생성을 <strong>빈 테이블에, 설치 시점에</strong> 하니까 — 데이터도 트래픽도 없는 상태라 — 그 위험한 <strong>라이브 재구성을 영영 안 하게</strong> 된다. 운영 중 <code>ALTER</code>가 아예 사라지는 게 핵심이다.</li>
<li>빈 파티션은 거의 공짜다. MySQL/MariaDB는 파티션을 수천 개까지 허용하고(상한 8192개), 비어 있는 파티션은 사실상 메타데이터뿐이라 수십 개 미리 깔아둬도 부담이 없다.</li>
</ul>
<p>이게 &ldquo;정석&quot;인지는 솔직히 나도 모른다. 크론으로 굴리는 게 더 우아하다고 볼 사람도 있을 거다. 다만 <strong>현장에 설치돼서 유지보수 손이 잘 안 닿는 장비</strong>라면, 매달 도는 잡 하나에 목숨 거는 것보다 <strong>설치할 때 20년치 깔아두고 잊는 쪽</strong>이 사고 날 여지가 적다고 판단했다. 운영 중 재구성으로 테이블을 깨먹어 본 입장에선, 이 트레이드오프가 납득이 됐다.</p>
<h2 id="정리">정리</h2>
<ul>
<li><strong>파티션 키는 모든 PK/UNIQUE에 포함</strong>돼야 한다 — 규칙은 사실상 이거 하나.</li>
<li>seq냐 날짜냐는 **&ldquo;무엇으로 지울 거냐&rdquo;**로 정한다. 보관정책 있으면 날짜.</li>
<li>auto_increment PK 전환은 <code>DROP</code>+<code>ADD</code>를 <strong>한 ALTER에</strong> 묶고, PK 컬럼은 <code>NOT NULL</code>.</li>
<li><strong>FK 미지원</strong>, <strong>DDL은 롤백 불가</strong>, 그리고 <strong>운영 중 라이브 재구성은 테이블을 깨먹을 수 있다</strong> — 이 셋은 미리 모르면 크게 덴다. 접근을 끊고 하거나, 아예 설치 시점에 미리 만들어 재구성을 피한다.</li>
<li>MariaDB엔 <strong>자동 파티셔닝이 없어서</strong>, 나는 설치 때 <strong>20년치를 미리 생성</strong>해 운영 중 <code>ALTER</code>를 없앴다.</li>
<li>핵심 보상은 <strong><code>DROP PARTITION</code>으로 즉시 구간 삭제</strong>.</li>
</ul>
<p>파티셔닝은 &ldquo;쿼리 빨라지는 마법&quot;이라기보단, <strong>오래된 데이터를 값싸게 버릴 수 있게 해주는 구조 정리</strong>에 가까웠다. 조회 성능은 파티션 키로 필터링할 때(파티션 프루닝)만 덤으로 붙는다. 그리고 무엇보다 — 생각보다 <strong>위험한 작업</strong>이다. 운영 중인 테이블을 건드리는 순간 리스크가 확 올라가니, 가능하면 <strong>처음 만들 때 구조를 잡아두는 게</strong> 제일 마음 편했다.</p>
`,date:"2026.09.17",summary:`왜 파티셔닝을 보게 됐나 로그·이벤트처럼 계속 쌓이기만 하는 테이블이 있으면, 언젠가 “이거 너무 커졌는데..” 하는 순간이 온다. 조회도 느려지고, 오래된 데이터 지우자니 DELETE가 한참 걸리고 락도 무섭다. 이때 꺼내는 카드가 파티셔닝이다. 테이블을 논리적으로 한 덩어리로 두되, 내부적으로는 구간별로 잘라 저장해서 “특정 구간만 빠르게 조회하거나 통째로 버리는” 걸 가능하게 하는 것.
개념은 쉬운데 막상 하려니 규칙과 함정이 제법 있었다. 겪은 순서대로 정리해둔다. (MySQL/MariaDB 기준)
규칙 하나만 기억하면 된다 — 파티션 키는 PK에 포함돼야 한다 파티셔닝의 가장 중요한 규칙은 이거 하나다.
`,thumb:"/images/book-default.svg",title:"[MySQL] 대용량 테이블 파티셔닝 실전 — PK 규칙, auto_increment 함정, 보관정책",url:"/posts/mysql-table-partitioning/"},{content:`<h2 id="손으로-rtsp-주소를-넣고-있었다">손으로 RTSP 주소를 넣고 있었다</h2>
<p>앞서 RTSP를 몇 번 다뤘는데, 정작 기본에서 걸리는 게 하나 있었다. **&ldquo;카메라 IP는 아는데 RTSP 주소를 모른다&rdquo;**는 상황이다.</p>
<p>RTSP 경로는 제조사마다, 심지어 같은 제조사 모델마다 제각각이다. <code>rtsp://ip:554/Streaming/Channels/101</code> 인 놈도 있고 <code>rtsp://ip/live/main</code> 인 놈도 있고.. 이걸 다 외우거나 매뉴얼을 뒤질 순 없다. 그래서 처음엔 카메라 등록 화면에서 <strong>사람이 직접 RTSP 주소를 타이핑</strong>하게 해뒀다. 카메라 하나 늘 때마다 주소를 찾아 넣는 게 여간 번거로운 게 아니었다.</p>
<p>결론부터 말하면, <strong>IP + 계정만 있으면 RTSP 주소는 자동으로 받아올 수 있다.</strong> ONVIF를 지원하는 카메라라면(요즘 IP 카메라는 대부분 된다) <code>GetStreamUri</code> 한 방이면 끝난다.</p>
<h2 id="onvif가-뭔데">ONVIF가 뭔데</h2>
<p>ONVIF는 IP 카메라·NVR 같은 영상 장비들이 제조사가 달라도 서로 통신할 수 있게 만든 <strong>표준 인터페이스</strong>다. SOAP 기반이라 살짝 구식 냄새는 나지만, &ldquo;카메라에 표준 방식으로 이것저것 물어볼 수 있다&quot;는 게 핵심이다. 그중 미디어 서비스에 <strong>&ldquo;네 스트림 주소 뭐야?&ldquo;라고 묻는 <code>GetStreamUri</code></strong> 가 있다.</p>
<p>파이썬이면 <code>onvif-zeep</code>(혹은 그 계열) 라이브러리를 쓰면 된다. 흐름은 이렇다.</p>
<ol>
<li>IP·포트·계정으로 <code>ONVIFCamera</code> 객체를 만든다</li>
<li>미디어 서비스를 생성한다</li>
<li><code>GetProfiles()</code>로 프로파일(주/보조 스트림 등) 목록을 받는다</li>
<li>각 프로파일 토큰으로 <code>GetStreamUri()</code>를 호출해 RTSP 주소를 얻는다</li>
</ol>
<h2 id="media2--media1-폴백이-필요하다">Media2 → Media1 폴백이 필요하다</h2>
<p>여기서 한 가지 함정. ONVIF에도 버전이 있어서, 최신 카메라(Profile T)는 <strong>Media2</strong> 서비스를 쓰고 파라미터 형식이 다르다. 반면 기존 카메라 대부분은 <strong>Media1</strong>이다. 그래서 Media2를 먼저 시도하고, 안 되면 Media1로 떨어지게 짜는 게 안전하다.</p>

</span></span><span class="line"><span class="cl"><span class="k">def</span> <span class="nf">probe_rtsp</span><span class="p">(</span><span class="n">ip</span><span class="p">,</span> <span class="n">user</span><span class="p">,</span> <span class="n">pwd</span><span class="p">,</span> <span class="n">port</span><span class="o">=</span><span class="mi">80</span><span class="p">,</span> <span class="n">wsdl_dir</span><span class="o">=</span><span class="kc">None</span><span class="p">,</span> <span class="n">embed_cred</span><span class="o">=</span><span class="kc">True</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">    <span class="s2">&#34;&#34;&#34;IP + 계정으로 카메라의 RTSP URI 목록을 얻는다. -&gt; [(profile_name, uri), ...]&#34;&#34;&#34;</span>
</span></span><span class="line"><span class="cl">    <span class="n">cam</span> <span class="o">=</span> <span class="n">ONVIFCamera</span><span class="p">(</span><span class="n">ip</span><span class="p">,</span> <span class="n">port</span><span class="p">,</span> <span class="n">user</span><span class="p">,</span> <span class="n">pwd</span><span class="p">,</span> <span class="n">wsdl_dir</span><span class="p">,</span> <span class="n">adjust_time</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="n">results</span> <span class="o">=</span> <span class="p">[]</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl">    <span class="k">try</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">        <span class="c1"># Media2 (ONVIF Profile T, 최신 카메라)</span>
</span></span><span class="line"><span class="cl">        <span class="n">media2</span> <span class="o">=</span> <span class="n">cam</span><span class="o">.</span><span class="n">create_media2_service</span><span class="p">()</span>
</span></span><span class="line"><span class="cl">        <span class="k">for</span> <span class="n">p</span> <span class="ow">in</span> <span class="n">media2</span><span class="o">.</span><span class="n">GetProfiles</span><span class="p">():</span>
</span></span><span class="line"><span class="cl">            <span class="n">uri</span> <span class="o">=</span> <span class="n">media2</span><span class="o">.</span><span class="n">GetStreamUri</span><span class="p">({</span><span class="s1">&#39;Protocol&#39;</span><span class="p">:</span> <span class="s1">&#39;RtspUnicast&#39;</span><span class="p">,</span>
</span></span><span class="line"><span class="cl">                                       <span class="s1">&#39;ProfileToken&#39;</span><span class="p">:</span> <span class="n">p</span><span class="o">.</span><span class="n">token</span><span class="p">})</span>
</span></span><span class="line"><span class="cl">            <span class="n">results</span><span class="o">.</span><span class="n">append</span><span class="p">((</span><span class="n">p</span><span class="o">.</span><span class="n">Name</span><span class="p">,</span> <span class="n">uri</span><span class="p">))</span>
</span></span><span class="line"><span class="cl">    <span class="k">except</span> <span class="ne">Exception</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">        <span class="c1"># Media1 폴백 (대부분의 기존 카메라)</span>
</span></span><span class="line"><span class="cl">        <span class="n">media</span> <span class="o">=</span> <span class="n">cam</span><span class="o">.</span><span class="n">create_media_service</span><span class="p">()</span>
</span></span><span class="line"><span class="cl">        <span class="k">for</span> <span class="n">p</span> <span class="ow">in</span> <span class="n">media</span><span class="o">.</span><span class="n">GetProfiles</span><span class="p">():</span>
</span></span><span class="line"><span class="cl">            <span class="n">r</span> <span class="o">=</span> <span class="n">media</span><span class="o">.</span><span class="n">GetStreamUri</span><span class="p">({</span>
</span></span><span class="line"><span class="cl">                <span class="s1">&#39;StreamSetup&#39;</span><span class="p">:</span> <span class="p">{</span><span class="s1">&#39;Stream&#39;</span><span class="p">:</span> <span class="s1">&#39;RTP-Unicast&#39;</span><span class="p">,</span>
</span></span><span class="line"><span class="cl">                                <span class="s1">&#39;Transport&#39;</span><span class="p">:</span> <span class="p">{</span><span class="s1">&#39;Protocol&#39;</span><span class="p">:</span> <span class="s1">&#39;RTSP&#39;</span><span class="p">}},</span>
</span></span><span class="line"><span class="cl">                <span class="s1">&#39;ProfileToken&#39;</span><span class="p">:</span> <span class="n">p</span><span class="o">.</span><span class="n">token</span><span class="p">,</span>
</span></span><span class="line"><span class="cl">            <span class="p">})</span>
</span></span><span class="line"><span class="cl">            <span class="n">results</span><span class="o">.</span><span class="n">append</span><span class="p">((</span><span class="n">p</span><span class="o">.</span><span class="n">Name</span><span class="p">,</span> <span class="n">r</span><span class="o">.</span><span class="n">Uri</span><span class="p">))</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl">    <span class="k">if</span> <span class="n">embed_cred</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">        <span class="n">results</span> <span class="o">=</span> <span class="p">[(</span><span class="n">n</span><span class="p">,</span> <span class="n">_with_cred</span><span class="p">(</span><span class="n">u</span><span class="p">,</span> <span class="n">user</span><span class="p">,</span> <span class="n">pwd</span><span class="p">))</span> <span class="k">for</span> <span class="n">n</span><span class="p">,</span> <span class="n">u</span> <span class="ow">in</span> <span class="n">results</span><span class="p">]</span>
</span></span><span class="line"><span class="cl">    <span class="k">return</span> <span class="n">results</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>두 API의 <code>GetStreamUri</code> 파라미터 형태가 다른 게 보일 거다. Media2는 <code>Protocol: 'RtspUnicast'</code>, Media1은 <code>StreamSetup</code>에 <code>Stream</code>/<code>Transport</code>를 중첩해서 넘긴다. 이거 때문에 &ldquo;코드가 왜 어떤 카메라에선 되고 어떤 건 안 되지&rdquo; 하고 헤매기 쉬운데, 버전 차이라는 걸 알면 폴백으로 깔끔하게 처리된다.</p>
<h2 id="getstreamuri-결과엔-계정이-안-들어있다">GetStreamUri 결과엔 계정이 안 들어있다</h2>
<p>또 하나 놓치기 쉬운 점. <code>GetStreamUri</code>가 돌려주는 주소는 보통 <code>rtsp://&lt;ip&gt;:554/...</code> 형태로 <strong>계정(user:pass)이 빠져 있다.</strong> 그대로 플레이어에 넣으면 401이 난다. 그래서 받은 URI에 계정을 끼워 넣어주는 처리가 필요하다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span><span class="lnt">5
</span><span class="lnt">6
</span><span class="lnt">7
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="k">def</span> <span class="nf">_with_cred</span><span class="p">(</span><span class="n">uri</span><span class="p">,</span> <span class="n">user</span><span class="p">,</span> <span class="n">pwd</span><span class="p">):</span>
</span></span><span class="line"><span class="cl">    <span class="s2">&#34;&#34;&#34;rtsp://host/... -&gt; rtsp://user:pass@host/... 로 계정을 넣어준다.&#34;&#34;&#34;</span>
</span></span><span class="line"><span class="cl">    <span class="n">s</span> <span class="o">=</span> <span class="n">urlsplit</span><span class="p">(</span><span class="n">uri</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">    <span class="k">if</span> <span class="s1">&#39;@&#39;</span> <span class="ow">in</span> <span class="n">s</span><span class="o">.</span><span class="n">netloc</span> <span class="ow">or</span> <span class="ow">not</span> <span class="n">user</span><span class="p">:</span>
</span></span><span class="line"><span class="cl">        <span class="k">return</span> <span class="n">uri</span>          <span class="c1"># 이미 들어있거나 계정이 없으면 그대로</span>
</span></span><span class="line"><span class="cl">    <span class="k">return</span> <span class="n">urlunsplit</span><span class="p">((</span><span class="n">s</span><span class="o">.</span><span class="n">scheme</span><span class="p">,</span> <span class="sa">f</span><span class="s1">&#39;</span><span class="si">{</span><span class="n">user</span><span class="si">}</span><span class="s1">:</span><span class="si">{</span><span class="n">pwd</span><span class="si">}</span><span class="s1">@</span><span class="si">{</span><span class="n">s</span><span class="o">.</span><span class="n">netloc</span><span class="si">}</span><span class="s1">&#39;</span><span class="p">,</span>
</span></span><span class="line"><span class="cl">                       <span class="n">s</span><span class="o">.</span><span class="n">path</span><span class="p">,</span> <span class="n">s</span><span class="o">.</span><span class="n">query</span><span class="p">,</span> <span class="n">s</span><span class="o">.</span><span class="n">fragment</span><span class="p">))</span>
</span></span></code></pre></td></tr></table>
</div>
</div><blockquote>
<p>⚠️ 계정을 URL에 박아 넣는 건 편하지만, 로그나 화면에 그대로 노출되기 쉽다. 화면에 보여줄 땐 비밀번호를 마스킹하고, 실제 연결에만 쓰도록 분리하는 걸 권한다.</p>
</blockquote>
<h2 id="참고-ip도-모를-때--ws-discovery">참고: IP도 모를 때 — WS-Discovery</h2>
<p>&ldquo;IP조차 모르고 네트워크에 어떤 카메라들이 있는지부터 알고 싶다&quot;면 ONVIF의 <strong>WS-Discovery</strong>가 있다. 같은 네트워크에 멀티캐스트로 &ldquo;거기 ONVIF 장비 있니?&ldquo;를 뿌리면 장비들이 자기 주소를 응답한다. <code>wsdiscovery</code> 같은 라이브러리로 장비 IP 목록을 먼저 수집하고, 거기에 위 <code>probe_rtsp</code>를 돌리면 <strong>&ldquo;네트워크 스캔 → RTSP 주소 자동 수집&rdquo;</strong> 파이프라인이 된다. (다만 멀티캐스트라 네트워크 환경에 따라 안 잡히는 경우도 있어서, IP를 아는 상황이면 그냥 위 방식이 제일 확실하다.)</p>
<h2 id="정리">정리</h2>
<ul>
<li>카메라마다 다른 RTSP 경로를 손으로 넣지 말고, **ONVIF <code>GetStreamUri</code>**로 자동으로 받아오자.</li>
<li><strong>Media2 먼저, 안 되면 Media1 폴백</strong> — 파라미터 형식이 다르다.</li>
<li>결과 URI엔 계정이 빠져 있으니 <strong><code>user:pass@</code> 를 끼워 넣어야</strong> 한다. 단 노출 주의.</li>
<li>IP도 모르면 <strong>WS-Discovery</strong>로 장비부터 찾을 수 있다.</li>
</ul>
<p>카메라 등록 화면에서 RTSP 주소 입력란을 없애고 &ldquo;IP·계정 넣으면 알아서 채워지게&rdquo; 바꾸고 나니, 카메라 늘릴 때마다 매뉴얼 뒤지던 일이 사라졌다. 사소해 보여도 운영 편의는 확 올라간 변경이었다.</p>
`,date:"2026.09.17",summary:`손으로 RTSP 주소를 넣고 있었다 앞서 RTSP를 몇 번 다뤘는데, 정작 기본에서 걸리는 게 하나 있었다. **“카메라 IP는 아는데 RTSP 주소를 모른다”**는 상황이다.
RTSP 경로는 제조사마다, 심지어 같은 제조사 모델마다 제각각이다. rtsp://ip:554/Streaming/Channels/101 인 놈도 있고 rtsp://ip/live/main 인 놈도 있고.. 이걸 다 외우거나 매뉴얼을 뒤질 순 없다. 그래서 처음엔 카메라 등록 화면에서 사람이 직접 RTSP 주소를 타이핑하게 해뒀다. 카메라 하나 늘 때마다 주소를 찾아 넣는 게 여간 번거로운 게 아니었다.
결론부터 말하면, IP + 계정만 있으면 RTSP 주소는 자동으로 받아올 수 있다. ONVIF를 지원하는 카메라라면(요즘 IP 카메라는 대부분 된다) GetStreamUri 한 방이면 끝난다.
`,thumb:"/images/book-default.svg",title:"[RTSP] IP만 알면 RTSP 주소를 자동으로 — ONVIF GetStreamUri",url:"/posts/onvif-get-rtsp-uri/"},{content:`<h2 id="프레임을-어떻게-넘길까">프레임을 어떻게 넘길까</h2>
<p>영상을 다루다 보면 프로세스가 자연스럽게 둘로 갈린다. 한쪽은 <strong>영상을 받아 디코딩해서 프레임을 뽑는 쪽</strong>(생산자), 다른 한쪽은 <strong>그 프레임으로 뭔가 처리하는 쪽</strong>(소비자 — 객체 검출이든 저장이든). 문제는 이 둘 사이로 <strong>매초 수십 장의 이미지 프레임</strong>이 오가야 한다는 것이다.</p>
<p>이걸 소켓이나 파일로 넘기면.. 프레임 하나가 수 MB인데 그걸 계속 직렬화해서 복사하면 CPU도 대역폭도 아깝다. 그래서 꺼낸 게 **공유메모리(shared memory)**다. 메모리 한 구역을 두 프로세스가 같이 들여다보면 복사 없이 프레임을 넘길 수 있다. 리눅스에선 <code>/dev/shm</code> 위에 얹힌다.</p>
<p>이 구조 자체는 잘 도는데, <strong>&ldquo;소비자가 죽었다&quot;를 감지하고 되살리는 부분</strong>에서 예상 못 한 함정을 여럿 만났다. 그 기록이다.</p>
<h2 id="공유메모리로-프레임-공유하기">공유메모리로 프레임 공유하기</h2>
<p>파이썬이면 표준 라이브러리 <code>multiprocessing.shared_memory</code>로 된다. 생산자가 세그먼트를 <strong>만들고(create)</strong>, 소비자는 이름으로 <strong>붙는다(attach)</strong>. numpy 배열을 그 위에 얹으면 프레임을 바로 읽고 쓸 수 있다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span><span class="lnt">12
</span><span class="lnt">13
</span><span class="lnt">14
</span><span class="lnt">15
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="kn">from</span> <span class="nn">multiprocessing</span> <span class="kn">import</span> <span class="n">shared_memory</span>
</span></span><span class="line"><span class="cl"><span class="kn">import</span> <span class="nn">numpy</span> <span class="k">as</span> <span class="nn">np</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="n">H</span><span class="p">,</span> <span class="n">W</span><span class="p">,</span> <span class="n">C</span> <span class="o">=</span> <span class="mi">1080</span><span class="p">,</span> <span class="mi">1920</span><span class="p">,</span> <span class="mi">3</span>
</span></span><span class="line"><span class="cl"><span class="n">NAME</span> <span class="o">=</span> <span class="s2">&#34;frame_ch1&#34;</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 생산자: 세그먼트 생성 후 프레임을 계속 덮어씀</span>
</span></span><span class="line"><span class="cl"><span class="n">shm</span> <span class="o">=</span> <span class="n">shared_memory</span><span class="o">.</span><span class="n">SharedMemory</span><span class="p">(</span><span class="n">name</span><span class="o">=</span><span class="n">NAME</span><span class="p">,</span> <span class="n">create</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">size</span><span class="o">=</span><span class="n">H</span><span class="o">*</span><span class="n">W</span><span class="o">*</span><span class="n">C</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="n">buf</span> <span class="o">=</span> <span class="n">np</span><span class="o">.</span><span class="n">ndarray</span><span class="p">((</span><span class="n">H</span><span class="p">,</span> <span class="n">W</span><span class="p">,</span> <span class="n">C</span><span class="p">),</span> <span class="n">dtype</span><span class="o">=</span><span class="n">np</span><span class="o">.</span><span class="n">uint8</span><span class="p">,</span> <span class="n">buffer</span><span class="o">=</span><span class="n">shm</span><span class="o">.</span><span class="n">buf</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="n">buf</span><span class="p">[:]</span> <span class="o">=</span> <span class="n">frame</span>            <span class="c1"># 디코딩한 프레임을 복사 없이 게시</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 소비자: 이름으로 붙어서 읽기</span>
</span></span><span class="line"><span class="cl"><span class="n">shm</span> <span class="o">=</span> <span class="n">shared_memory</span><span class="o">.</span><span class="n">SharedMemory</span><span class="p">(</span><span class="n">name</span><span class="o">=</span><span class="n">NAME</span><span class="p">)</span>          <span class="c1"># create=False</span>
</span></span><span class="line"><span class="cl"><span class="n">buf</span> <span class="o">=</span> <span class="n">np</span><span class="o">.</span><span class="n">ndarray</span><span class="p">((</span><span class="n">H</span><span class="p">,</span> <span class="n">W</span><span class="p">,</span> <span class="n">C</span><span class="p">),</span> <span class="n">dtype</span><span class="o">=</span><span class="n">np</span><span class="o">.</span><span class="n">uint8</span><span class="p">,</span> <span class="n">buffer</span><span class="o">=</span><span class="n">shm</span><span class="o">.</span><span class="n">buf</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="n">frame</span> <span class="o">=</span> <span class="n">buf</span><span class="o">.</span><span class="n">copy</span><span class="p">()</span>        <span class="c1"># 필요하면 스냅샷</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>실제로는 &ldquo;지금 프레임이 갱신됐는지&quot;를 알려주는 프레임 카운터나 락/세마포어를 하나 더 두는 게 보통이지만, 핵심은 <strong>생산자가 만들고 소비자가 붙는다</strong>는 것이다. 그리고 바로 여기서 문제가 시작된다.</p>
<h2 id="소비자가-죽는-건-대부분-생산자가-없어서다">소비자가 죽는 건 대부분 &ldquo;생산자가 없어서&quot;다</h2>
<p>소비자를 켰는데 이런 식으로 바로 죽는 경우가 있다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">FileNotFoundError: No shared memory block associated with name &#39;frame_ch1&#39;
</span></span></code></pre></td></tr></table>
</div>
</div><p><code>create=False</code>로 붙으려는데 <strong>그 이름의 세그먼트가 아직 없다</strong>는 뜻이다. 즉 생산자가 아직 안 떴거나, 떴다가 죽어서 세그먼트가 사라진 것. 소비자 잘못이 아니라 <strong>생산자가 준비가 안 된 것</strong>이다.</p>
<p>이걸 제대로 이해 못 하면 다음 함정에 그대로 빠진다.</p>
<h2 id="함정-재시작해도-계속-죽는다">함정: &ldquo;재시작해도 계속 죽는다&rdquo;</h2>
<p>소비자가 죽으면 감독(supervisor) 프로세스가 되살리게 해뒀다. 그런데 로그를 보면 소비자가 <strong>안 켜지는 것처럼</strong> 보였다. 감독이 분명 재시작을 시도하는데도.</p>
<p>원인은 단순했다. <strong>생산자가 여전히 죽어있으면, 소비자를 아무리 재시작해도 붙을 shm이 없어서 똑같이 1초 만에 다시 죽는다.</strong> 감독은 열심히 재시작을 &ldquo;시도&quot;하고 있지만, 육안으로는 계속 꺼져 있는 것처럼 보인다. 즉 상황은 **&ldquo;안 켜진다&quot;가 아니라 &ldquo;계속 즉시 재실패하는 중&rdquo;**이었다.</p>
<p>교훈이 두 개다.</p>
<ul>
<li><strong>재시작은 근본 원인부터.</strong> 소비자를 되살리기 전에 <strong>생산자(shm을 만들어주는 쪽)가 살아있는지부터</strong> 확인해야 한다. 안 그러면 무한 재실패 루프다.</li>
<li><strong>로그를 &ldquo;시도&quot;와 &ldquo;성공&quot;으로 구분</strong>해서 남겨야 한다. &ldquo;재시작 시도 N회&quot;가 찍히고 있으면 감독은 정상이고 원인은 딴 데(생산자) 있는 것이다. 이 구분이 없으면 &ldquo;감독이 고장 났나?&ldquo;를 엉뚱하게 파게 된다.</li>
</ul>
<h2 id="함정-grace-타임과-폴링-주기가-겹치면-느려-보인다">함정: grace 타임과 폴링 주기가 겹치면 느려 보인다</h2>
<p>또 하나. 감독이 30초마다 상태를 폴링하면서, 재시작에는 <strong>grace time(예: 60초)</strong> — &ldquo;방금 재시작했으니 60초는 다시 안 건드림&rdquo; — 을 뒀었다. 그런데 소비자가 shm이 없어서 1초 만에 죽어도, 이 grace 60초는 그대로 카운트된다.</p>
<p>결과적으로 30초 폴링 중 절반은 grace에 걸려 스킵되고, <strong>실제 재시작은 약 60초에 한 번씩만</strong> 일어났다. &ldquo;왜 이렇게 느리게 되살아나지?&rdquo; 싶었는데, 죽는 건 즉시인데 되살리는 주기가 grace에 묶여 있던 것이다. 재시작 실패가 즉시라면 grace를 실패에는 짧게, 성공에만 길게 두는 식으로 분리하는 게 맞았다.</p>
<h2 id="죽음을-어떻게-전파할까">죽음을 어떻게 전파할까</h2>
<p>소비자 내부에서 프레임 읽는 스레드가 죽었을 때, 그걸 감독에게 알리는 흐름은 이렇게 잡았다.</p>
<ol>
<li><code>main</code> 루프가 1초마다 <code>thread.is_alive()</code>로 워커 스레드 생사를 감시</li>
<li>죽은 게 감지되면 상태를 <code>error</code>로 바꾸고 전체 정리(cleanup) 후 종료</li>
<li>소비자는 감독과 <strong>소켓으로 연결</strong>돼 있는데, 종료하며 소켓을 닫으면 감독 쪽이 <strong>EOF를 감지</strong>해서 &ldquo;이 워커 죽었다&quot;로 표시</li>
<li>감독의 폴링 루프가 그 상태를 보고 재시작</li>
</ol>
<p>소켓 EOF로 죽음을 전파하는 게 은근 깔끔하다. 프로세스가 어떤 이유로 죽든(정상 종료든 크래시든) 연결이 끊기니 감독이 알아챌 수 있다.</p>
<div class="highlight"><div class="chroma">

<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2

</span><span class="lnt">6

</span><span class="lnt">8
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="c1"># 소비자: 워커 스레드 생사 감시</span>
</span></span><span class="line"><span class="cl"><span class="k">while</span> <span class="ow">not</span> <span class="n">stop_event</span><span class="o">.</span><span class="n">is_set</span><span class="p">():</span>

</span></span><span class="line"><span class="cl">        <span class="n">stop_event</span><span class="o">.</span><span class="n">set</span><span class="p">()</span>      <span class="c1"># 나머지 정리 유도</span>
</span></span><span class="line"><span class="cl">        <span class="k">break</span>
</span></span><span class="line"><span class="cl">    <span class="n">time</span><span class="o">.</span><span class="n">sleep</span><span class="p">(</span><span class="mi">1</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="c1"># 여기서 소켓을 닫으면 감독이 EOF로 감지</span>
</span></span></code></pre></td></tr></table>
</div>
</div><h2 id="정리-안-하면-쌓인다">정리 안 하면 쌓인다</h2>
<p>마지막으로, 프로세스가 죽을 때 <strong>자기 흔적을 명시적으로 정리</strong>하게 해야 한다. 안 그러면 조용히 쌓인다.</p>
<ul>
<li>생산자가 죽으면 <code>shm.close()</code> + <code>shm.unlink()</code> 로 세그먼트를 지워야 한다. 안 그러면 <code>/dev/shm</code>에 유령 세그먼트가 남는다.</li>
<li>&ldquo;실행 중&rdquo; 표시용으로 쓰는 pid 파일(<code>is_running_*</code> 같은) 이 있으면, 죽을 때 지우는 로직의 <strong>파일명 패턴이 실제와 맞는지</strong> 확인. 접두사 하나 안 맞아서 정리가 안 되고 계속 쌓이는 걸 실제로 겪었다.. 이런 건 에러도 안 나서 한참 뒤에야 발견한다.</li>
</ul>
<h2 id="정리">정리</h2>
<ul>
<li>프레임처럼 큰 데이터를 프로세스 간에 넘길 땐 <strong>공유메모리</strong>가 복사를 없애줘서 빠르다.</li>
<li>소비자가 붙을 때 <strong>생산자가 세그먼트를 먼저 만들어야</strong> 한다. 없으면 즉시 죽는다.</li>
<li><strong>재시작은 근본 원인(생산자)부터</strong> — 안 그러면 &ldquo;재시작해도 계속 죽는&rdquo; 무한 루프. 로그는 &ldquo;시도&quot;와 &ldquo;성공&quot;을 나눠 남긴다.</li>
<li><strong>grace time과 폴링 주기의 상호작용</strong>으로 재시작이 느려 보일 수 있다. 실패에는 grace를 짧게.</li>
<li>죽음 전파는 <strong>소켓 EOF</strong>가 깔끔하고, 죽을 땐 <strong>shm·pid 파일을 명시적으로 정리</strong>해야 쌓이지 않는다.</li>
</ul>
<p>공유메모리 자체는 몇 줄이면 되는데, 정작 어려운 건 **&ldquo;죽었을 때 어떻게 알아채고 되살리느냐&rdquo;**였다. 분산도 아니고 프로세스 두 개 감독하는 건데도 이 정도라, 감독(supervisor) 로직은 처음부터 &ldquo;재시작해도 안 되는 경우&quot;를 상정하고 짜야 한다는 걸 배웠다.</p>
`,date:"2026.09.17",summary:`프레임을 어떻게 넘길까 영상을 다루다 보면 프로세스가 자연스럽게 둘로 갈린다. 한쪽은 영상을 받아 디코딩해서 프레임을 뽑는 쪽(생산자), 다른 한쪽은 그 프레임으로 뭔가 처리하는 쪽(소비자 — 객체 검출이든 저장이든). 문제는 이 둘 사이로 매초 수십 장의 이미지 프레임이 오가야 한다는 것이다.
이걸 소켓이나 파일로 넘기면.. 프레임 하나가 수 MB인데 그걸 계속 직렬화해서 복사하면 CPU도 대역폭도 아깝다. 그래서 꺼낸 게 **공유메모리(shared memory)**다. 메모리 한 구역을 두 프로세스가 같이 들여다보면 복사 없이 프레임을 넘길 수 있다. 리눅스에선 /dev/shm 위에 얹힌다.
`,thumb:"/images/book-default.svg",title:"[Python] 공유메모리로 영상 프레임 넘기고, 죽으면 되살리기 — shm IPC와 감독 패턴",url:"/posts/shm-ipc-frame-supervisor/"},{content:`<h2 id="스트림에는-경계가-없다">스트림에는 경계가 없다</h2>
<p>장비 통신을 붙이다 보면 STX/ETX/DLE/CRC 조합을 계속 만나게 된다. 매번 어렴풋이 알고 넘어가다가 이번에 제대로 걸려서.. 다음의 나를 위해 정리해둔다.</p>
<p>시리얼(RS-232/485)이든 TCP 소켓이든, 내가 받는 건 결국 <strong>바이트가 줄줄이 흘러오는 스트림</strong>이다. 여기엔 &ldquo;여기까지가 한 메시지&quot;라는 경계가 없다. 송신 측이 100바이트짜리 패킷 하나를 보내도, 수신 측에서는 40바이트 읽히고 나머지 60바이트가 다음 <code>read()</code>에서 들어오기도 하고, 반대로 두 패킷이 한 번에 붙어서 오기도 한다.</p>
<p>그래서 애플리케이션이 직접 <strong>프레이밍(framing)</strong> 을 해야 한다. 흘러오는 바이트 더미에서 &ldquo;어디부터 어디까지가 한 프레임인지&quot;를 잘라내는 규칙이다. STX/ETX/DLE/CRC는 그 프레이밍을 하는 가장 고전적인 방법인데, 각 조각이 서로 다른 문제를 푼다. 하나씩 보자.</p>
<h2 id="stx--etx--프레임을-문자로-감싼다">STX / ETX — 프레임을 문자로 감싼다</h2>
<p>가장 단순한 발상은 &ldquo;특별한 문자로 시작과 끝을 표시하자&quot;는 것이다. ASCII 제어 문자 중에 이 용도로 정해진 게 있다.</p>
<ul>
<li><strong>STX (Start of Text, <code>0x02</code>)</strong> — 프레임 시작. 수신 측은 이 바이트를 만나면 &ldquo;여기서부터 데이터가 시작된다&quot;고 판단한다.</li>
<li><strong>ETX (End of Text, <code>0x03</code>)</strong> — 프레임 끝. STX와 ETX 사이가 실제 데이터 영역이 된다.</li>
</ul>
<p>수신 로직은 대충 이런 상태 기계가 된다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">IDLE 상태에서 바이트를 계속 버리다가 → STX를 만나면 RECV 상태로
</span></span><span class="line"><span class="cl">RECV 상태에서 바이트를 버퍼에 쌓다가 → ETX를 만나면 프레임 완성
</span></span></code></pre></td></tr></table>
</div>
</div><p>개념 예제로 쓰면 이 정도다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
