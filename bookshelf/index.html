`,thumb:"/images/book-default.svg",title:"[Linux] 목록에서 진짜 물리 NIC만 걸러내기 — docker·veth·wifi 제외",url:"/posts/linux-filter-physical-nic/"},{date:"2026.09.18",summary:`루트 디스크가 꽉 찼다 Docker는 이미지·컨테이너·볼륨을 전부 /var/lib/docker 아래에 쌓는다. 이게 보통 루트 디스크(/)에 있는데, 이미지 몇 개 받고 빌드 좀 하다 보면 순식간에 수십~수백 GB로 불어난다. 루트 디스크는 작게 잡아두는 경우가 많아서.. 어느 날 no space left on device를 보게 된다.
해결은 Docker의 저장 위치를 큰 별도 디스크(예: /data)로 옮기는 것이다. 방법이 두 가지 있는데, 옮기는 과정에서 놓치기 쉬운 것들이 있어 정리해둔다.
방법 1: data-root (Docker 네이티브, 추천) Docker가 공식으로 지원하는 방법. /etc/docker/daemon.json에 저장 위치만 알려주면 된다.
`,thumb:"/images/book-default.svg",title:"[Docker] 데이터 디렉토리를 다른 디스크로 옮기기 (data-root)",url:"/posts/docker-move-data-root/"},{date:"2026.09.18",summary:`왜 갈아엎게 됐나 “SSH 로그인 N번 실패하면 계정을 잠근다"는 기능을 관리용 웹 UI에서 켜고 끄게 만들어야 했다. 기존 구현을 보니 웹 서버가 /etc/pam.d/common-auth 파일을 직접 텍스트로 편집하고 있었다. 처음엔 “되긴 되네” 했는데, 뜯어볼수록 이건 그냥 두면 안 되는 코드였다.. 결국 구조를 통째로 바꿨고, 그 과정에서 배운 걸 정리한다.
common-auth를 직접 건드리면 안 되는 이유 /etc/pam.d/common-auth를 런타임에 편집하는 방식은 문제가 한둘이 아니었다.
① common-auth는 SSH만이 아니라 모든 걸 잠근다. 이 파일은 PAM을 쓰는 모든 서비스 공통이다. 여기에 잠금을 걸면 SSH뿐 아니라 sudo, su, 콘솔 로그인, cron까지 다 영향을 받는다. “SSH만 잠그려던” 의도와 범위가 완전히 어긋난다.
`,thumb:"/images/book-default.svg",title:"[Linux] SSH 로그인 실패 잠금, common-auth 말고 faillock.conf로",url:"/posts/ssh-login-lockout-faillock/"},{date:"2026.09.18",summary:`rm 한 줄에서 스크립트가 죽었다 set -e가 걸린 셸 스크립트가 자꾸 특정 줄에서 멈췄다. 그 줄은 rm이었다.
원인은 단순했다. rm -f가 아니라 그냥 **rm**을 썼는데, 지울 대상이 없으면 rm은 에러(종료 코드 1)를 낸다. set -e는 그 non-zero를 보고 거기서 스크립트를 끝내버린다. 파일이 늘 있을 줄 알았는데, 어떤 실행 경로에선 없었던 것.
1 2 rm /tmp/state.lock # 파일이 없으면 → rm: cannot remove ...: No such file or directory → exit 1 → set -e 로 종료 rm -f /tmp/state.lock # -f 면 없어도 조용히 exit 0 해결은 -f 하나였다. rm -f(그리고 rm -rf)는 대상이 없어도 종료 코드 0이라 set -e에 안 걸린다. “없으면 그냥 넘어가기"가 목적이면 rm엔 습관적으로 -f를 붙이는 게 맞다.
`,thumb:"/images/book-default.svg",title:"[Bash] set -euo pipefail 함정 — rm과 apt가 조용히 스크립트를 죽일 때",url:"/posts/bash-set-euo-pipefail-traps/"},{date:"2026.09.17",summary:`왜 파티셔닝을 보게 됐나 로그·이벤트처럼 계속 쌓이기만 하는 테이블이 있으면, 언젠가 “이거 너무 커졌는데..” 하는 순간이 온다. 조회도 느려지고, 오래된 데이터 지우자니 DELETE가 한참 걸리고 락도 무섭다. 이때 꺼내는 카드가 파티셔닝이다. 테이블을 논리적으로 한 덩어리로 두되, 내부적으로는 구간별로 잘라 저장해서 “특정 구간만 빠르게 조회하거나 통째로 버리는” 걸 가능하게 하는 것.
개념은 쉬운데 막상 하려니 규칙과 함정이 제법 있었다. 겪은 순서대로 정리해둔다. (MySQL/MariaDB 기준)
규칙 하나만 기억하면 된다 — 파티션 키는 PK에 포함돼야 한다 파티셔닝의 가장 중요한 규칙은 이거 하나다.
`,thumb:"/images/book-default.svg",title:"[MySQL] 대용량 테이블 파티셔닝 실전 — PK 규칙, auto_increment 함정, 보관정책",url:"/posts/mysql-table-partitioning/"},{date:"2026.09.17",summary:`손으로 RTSP 주소를 넣고 있었다 앞서 RTSP를 몇 번 다뤘는데, 정작 기본에서 걸리는 게 하나 있었다. **“카메라 IP는 아는데 RTSP 주소를 모른다”**는 상황이다.
RTSP 경로는 제조사마다, 심지어 같은 제조사 모델마다 제각각이다. rtsp://ip:554/Streaming/Channels/101 인 놈도 있고 rtsp://ip/live/main 인 놈도 있고.. 이걸 다 외우거나 매뉴얼을 뒤질 순 없다. 그래서 처음엔 카메라 등록 화면에서 사람이 직접 RTSP 주소를 타이핑하게 해뒀다. 카메라 하나 늘 때마다 주소를 찾아 넣는 게 여간 번거로운 게 아니었다.
결론부터 말하면, IP + 계정만 있으면 RTSP 주소는 자동으로 받아올 수 있다. ONVIF를 지원하는 카메라라면(요즘 IP 카메라는 대부분 된다) GetStreamUri 한 방이면 끝난다.
`,thumb:"/images/book-default.svg",title:"[RTSP] IP만 알면 RTSP 주소를 자동으로 — ONVIF GetStreamUri",url:"/posts/onvif-get-rtsp-uri/"},{date:"2026.09.17",summary:`프레임을 어떻게 넘길까 영상을 다루다 보면 프로세스가 자연스럽게 둘로 갈린다. 한쪽은 영상을 받아 디코딩해서 프레임을 뽑는 쪽(생산자), 다른 한쪽은 그 프레임으로 뭔가 처리하는 쪽(소비자 — 객체 검출이든 저장이든). 문제는 이 둘 사이로 매초 수십 장의 이미지 프레임이 오가야 한다는 것이다.
이걸 소켓이나 파일로 넘기면.. 프레임 하나가 수 MB인데 그걸 계속 직렬화해서 복사하면 CPU도 대역폭도 아깝다. 그래서 꺼낸 게 **공유메모리(shared memory)**다. 메모리 한 구역을 두 프로세스가 같이 들여다보면 복사 없이 프레임을 넘길 수 있다. 리눅스에선 /dev/shm 위에 얹힌다.
`,thumb:"/images/book-default.svg",title:"[Python] 공유메모리로 영상 프레임 넘기고, 죽으면 되살리기 — shm IPC와 감독 패턴",url:"/posts/shm-ipc-frame-supervisor/"},{date:"2026.09.16",summary:`스트림에는 경계가 없다 장비 통신을 붙이다 보면 STX/ETX/DLE/CRC 조합을 계속 만나게 된다. 매번 어렴풋이 알고 넘어가다가 이번에 제대로 걸려서.. 다음의 나를 위해 정리해둔다.
시리얼(RS-232/485)이든 TCP 소켓이든, 내가 받는 건 결국 바이트가 줄줄이 흘러오는 스트림이다. 여기엔 “여기까지가 한 메시지"라는 경계가 없다. 송신 측이 100바이트짜리 패킷 하나를 보내도, 수신 측에서는 40바이트 읽히고 나머지 60바이트가 다음 read()에서 들어오기도 하고, 반대로 두 패킷이 한 번에 붙어서 오기도 한다.
그래서 애플리케이션이 직접 프레이밍(framing) 을 해야 한다. 흘러오는 바이트 더미에서 “어디부터 어디까지가 한 프레임인지"를 잘라내는 규칙이다. STX/ETX/DLE/CRC는 그 프레이밍을 하는 가장 고전적인 방법인데, 각 조각이 서로 다른 문제를 푼다. 하나씩 보자.
`,thumb:"/images/book-default.svg",title:"[프로토콜] STX·ETX·DLE·CRC — 바이트 스트림에서 프레임을 잘라내는 법",url:"/posts/serial-protocol-framing-stx-etx-dle-crc/"},{date:"2026.09.16",summary:`어쩌다 이걸 하게 됐나 외부에서 파일을 올릴 SFTP 계정을 하나 파야 했다. 요구는 세 개였다. 이 계정으로 접속하면 지정한 폴더 안에서만 놀게 하고, 같은 디스크의 다른 폴더는 아예 안 보이게 격리하고, 그러면서 파일은 용량 큰 별도 마운트 디스크에 쌓이게 하는 것.
“chroot 걸면 되겠지” 하고 가볍게 시작했는데.. 이게 생각보다 순순히 안 됐다. 결론부터 말하면 chroot의 소유권 제약 때문에 “가두기"와 “쓰기"가 정면충돌하고, 그걸 bind mount로 우회해야 한다. 나처럼 별도 디스크에 저장까지 얹어야 하는 상황이면 이 글이 그대로 쓸모 있을 거고, 그냥 홈 디렉토리에 쓰기만 하면 되는 경우면 뒤 절반은 안 봐도 된다.
`,thumb:"/images/book-default.svg",title:"[Linux] SFTP 계정을 폴더에 가두기 — chroot의 제약과 bind mount 우회",url:"/posts/sftp-chroot-jail/"},{date:"2026.09.15",summary:`문제: 느린 DB 조회가 파이프라인을 붙잡는다 두 모듈이 하나의 파이프라인으로 이어지는 상황이 있었다. 앞 모듈(선행 모듈)이 어떤 작업을 마치면 그 결과로 DB에서 무언가를 조회할 key를 만들어내고, 뒤 모듈(내 모듈)이 그 key로 DB를 조회해서 후속 처리를 한다.
문제는 이 DB 조회가 느리다는 것이었다. 데이터가 잔뜩 쌓인 테이블에서 큰 바이너리(이미지 blob 같은)를 꺼내와야 했고, 한 건당 시간이 제법 걸렸다. 두 모듈을 그냥 함수 호출로 직결하면, 앞 모듈은 뒤 모듈의 느린 조회가 끝날 때까지 매번 기다려야 한다. 앞 모듈도 나름 추론 등 할 일이 있는데 뒤 모듈의 I/O에 발이 묶이는 것.
`,thumb:"/images/book-default.svg",title:"[Redis] 리스트로 비동기 작업 큐 만들기 — 모듈 분리, 재시도, 부하 분산",url:"/posts/redis-async-queue/"},{date:"2026.09.13",summary:`들어가며 추론 최적화를 위해 TensorRT 버전을 올리는 건 흔한 일이다. 그런데 메이저 버전(10, 11)을 넘어가면 “그냥 버전만 바뀐 것"이 아니라 동작 모델 자체가 달라지는 지점들이 있었다. 올리는 과정에서 마주친 세 가지를 적어둔다. 셋 다 처음엔 원인이 안 보여서 한참 헤맸던 것들이라, 나중의 나(혹은 같은 삽질을 할 누군가)를 위해 남긴다.
1. trtexec --fp16이 사라졌다 — fp16은 이제 ONNX에서 결정된다 ONNX를 엔진으로 변환할 때 trtexec --onnx=... --saveEngine=... --fp16 식으로 fp16을 켜던 습관이 있었다. 그런데 버전을 올리고 나니 --fp16 옵션이 없다고 나온다. --int8, --best 같은 정밀도 플래그도 마찬가지.
`,thumb:"/images/book-default.svg",title:"[TensorRT] 10/11로 올리며 만난 삽질 — 사라진 --fp16, 엔진 버전 종속성, apt pin",url:"/posts/tensorrt-10-11-upgrade/"},{date:"2026.09.13",summary:`증상: 에러는 없는데 아무것도 안 잡힌다 YOLO 모델을 TensorRT 엔진으로 변환해서 추론 코드에 물렸다. 변환도 성공, 엔진 로드도 되고, 실행하면 프로세스가 멀쩡히 돈다. 로그에 예외도 없다. 그런데 검출 결과가 0개다. 분명 화면엔 객체가 있는데 하나도 안 잡힌다.
이런 종류의 버그가 제일 고약하다. 에러가 나면 스택 트레이스라도 따라가는데, 아무 일도 안 일어난 것처럼 조용히 틀린 결과가 나오면 어디부터 봐야 할지 막막하다.
결론부터 말하면, 원인은 ONNX export 때 출력 텐서 레이아웃이 바뀌었는데 후처리 코드가 옛날 레이아웃을 그대로 가정하고 있던 것이었다. 그리고 그 잘못된 가정이 에러조차 안 내고 통과해버린 게 문제를 어렵게 만들었다.
`,thumb:"/images/book-default.svg",title:"[YOLO] TensorRT로 바꿨더니 검출이 0개? — 출력 레이아웃 함정",url:"/posts/yolo-tensorrt-output-layout/"},{date:"2026.09.13",summary:`문제: RTSP는 브라우저가 못 읽는다 앞 글에서 IP 카메라의 RTSP 스트림을 받아오는 데는 성공했다. 이제 이걸 웹 화면에서 실시간으로 보여주고 싶었다. 관리자용 CMS든 모니터링 대시보드든, 결국 사용자는 브라우저에서 영상을 본다.
처음엔 순진하게 이렇게 생각했다.
1 <video src="rtsp://.../stream" controls></video> 안 된다. 브라우저의 <video> 태그는 RTSP를 지원하지 않는다. HTTP(S)로 서빙되는 MP4나, HLS/DASH 같은 HTTP 기반 스트리밍, 아니면 WebRTC로만 영상을 받을 수 있다. RTSP는 태생이 브라우저용이 아니다.. 그래서 RTSP를 브라우저가 알아듣는 형식으로 중간에서 변환해주는 서버가 반드시 필요하다.
`,thumb:"/images/book-default.svg",title:"[WebRTC] RTSP를 브라우저에서 실시간으로 보기 — HLS를 거쳐 WebRTC까지",url:"/posts/rtsp-to-browser-webrtc/"},{date:"2026.09.13",summary:`왜 RTSP를 그냥 쓰면 안 됐나 IP 카메라 영상을 받아올 때 제일 흔히 쓰는 게 RTSP(Real-Time Streaming Protocol)다. 그동안 나도 별생각 없이 써왔는데, 이번에 보안 요건이 걸리면서 한 가지 사실을 마주했다. 표준 RTSP에는 요즘 당연하게 여기는 게 하나 빠져 있다. 전송 구간 암호화다.
RTSP 자체는 스트림을 “제어"하는 프로토콜이다. DESCRIBE, OPTIONS, SETUP, PLAY 같은 명령을 주고받아 세션을 열고, 실제 영상은 RTP로 흘려보낸다. 문제는 이 제어 채널과 인증 정보가 기본적으로 평문으로 오간다는 것.. 카메라 계정 자격증명이 네트워크에 그대로 노출될 수 있고, 중간자 공격에도 취약하다.

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const BOOKS = Array.isArray(window.__BOOKS) ? window.__BOOKS : [];
const loadingEl = document.getElementById('loading');
const labelEl = document.getElementById('label');

if (BOOKS.length === 0) {
  loadingEl.style.display = 'none';
  document.getElementById('empty').style.display = 'grid';
}


const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth||1, window.innerHeight||1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const bgCanvas = document.createElement('canvas'); bgCanvas.width = bgCanvas.height = 512;
(() => { const g=bgCanvas.getContext('2d');
  const gr=g.createRadialGradient(256,210,40,256,256,380);
  gr.addColorStop(0,'#3d3025'); gr.addColorStop(0.55,'#271d14'); gr.addColorStop(1,'#120c07');
  g.fillStyle=gr; g.fillRect(0,0,512,512); })();
scene.background = new THREE.CanvasTexture(bgCanvas);

const camera = new THREE.PerspectiveCamera(42, (window.innerWidth||1)/(window.innerHeight||1), 0.1, 200);


scene.add(new THREE.HemisphereLight(0xfff1da, 0x40342a, 0.85));
const key = new THREE.DirectionalLight(0xffe6bd, 1.7);
key.position.set(5, 11, 9); key.castShadow = true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=0.5; key.shadow.camera.far=60;
key.shadow.camera.left=-16; key.shadow.camera.right=16; key.shadow.camera.top=16; key.shadow.camera.bottom=-16;
key.shadow.bias=-0.0004; scene.add(key);
const fill = new THREE.PointLight(0xffcaa0, 0.5, 40); fill.position.set(-6,6,10); scene.add(fill);


const wood  = (c,r=0.72)=>new THREE.MeshStandardMaterial({color:c, roughness:r, metalness:0.02});
const PER_SHELF = 9;
const SLOT = 0.62;                 
const ROW_GAP = 2.1;               
const ROWS = Math.max(3, Math.ceil(BOOKS.length / PER_SHELF));
const INNER_W = PER_SHELF * SLOT + 0.5;
const SHELF_H = ROWS * ROW_GAP + 0.6;
const BOTTOM_Y = 1.0;              

const shelfGroup = new THREE.Group(); scene.add(shelfGroup);

const backPanel = new THREE.Mesh(new THREE.BoxGeometry(INNER_W+0.6, SHELF_H, 0.25), wood(0x6f5137,0.85));
backPanel.position.set(0, BOTTOM_Y + SHELF_H/2 - 0.4, -0.75); backPanel.receiveShadow=true; shelfGroup.add(backPanel);

for (const sx of [-(INNER_W/2+0.25), (INNER_W/2+0.25)]) {
  const side = new THREE.Mesh(new THREE.BoxGeometry(0.3, SHELF_H, 1.5), wood(0x7a5a3c));
  side.position.set(sx, BOTTOM_Y + SHELF_H/2 - 0.4, -0.1); side.castShadow=side.receiveShadow=true; shelfGroup.add(side);
}

for (let r=0; r<=ROWS; r++) {
  const board = new THREE.Mesh(new THREE.BoxGeometry(INNER_W+0.6, 0.18, 1.5), wood(0x86643f));
  board.position.set(0, BOTTOM_Y + r*ROW_GAP - 0.09, -0.1); board.castShadow=board.receiveShadow=true; shelfGroup.add(board);
}


const SPINE_PALETTE = [0xb5493f,0x3f6fa8,0x4a8c63,0xb98336,0x7a5aa0,0xc06a86,0x2f8a8a,0x8a6d3b,0x556b8d,0xa0553f];
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }

function wrapText(ctx, text, maxW){
  const out=[]; let line='';
  for (const ch of text){
    if (ch==='\n'){ out.push(line); line=''; continue; }
    const t=line+ch;
    if (ctx.measureText(t).width > maxW && line){ out.push(line); line=ch; }
    else line=t;
  }
  if (line) out.push(line);
  return out;
}

function makeSpineTexture(title, color){
  const c=document.createElement('canvas'); c.width=140; c.height=420; const g=c.getContext('2d');
  const col='#'+color.toString(16).padStart(6,'0');
  g.fillStyle=col; g.fillRect(0,0,140,420);
  
  g.fillStyle='rgba(255,255,255,.16)'; g.fillRect(0,26,140,7); g.fillRect(0,387,140,7);
  g.fillStyle='rgba(0,0,0,.14)'; g.fillRect(0,0,10,420); g.fillRect(130,0,10,420);
  
  g.save(); g.translate(70,210); g.rotate(-Math.PI/2);
  g.fillStyle='rgba(255,248,236,.96)'; g.font='700 30px "Malgun Gothic", sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  const lines = wrapText(g, title, 300).slice(0,2);
  const lh=34, y0=-(lines.length-1)*lh/2;
  lines.forEach((ln,i)=> g.fillText(ln, 0, y0 + i*lh));
  g.restore();
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4; return tex;
}

const bookMeshes = [];
BOOKS.forEach((b, i) => {
  const row = Math.floor(i / PER_SHELF);
  const col = i % PER_SHELF;
  const color = SPINE_PALETTE[hashStr(b.title) % SPINE_PALETTE.length];
  const h = 1.55 + ((hashStr(b.title)>>3)%5)*0.06;   
  const depth = 1.15;
  const spineTex = makeSpineTexture(b.title, color);
  const plain = wood(color, 0.55);
  const spineMat = new THREE.MeshStandardMaterial({ map:spineTex, roughness:0.5 });
  
  const mats = [plain, plain, wood(0xf3ead9,0.9), plain, spineMat, plain];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(SLOT-0.08, h, depth), mats);
  const x = -INNER_W/2 + SLOT/2 + col*SLOT;
  const y = BOTTOM_Y + (ROWS-1-row)*ROW_GAP + h/2;   
  const z = 0.0;
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData = { book:b, base:mesh.position.clone(), hover:0, mats, color };
  scene.add(mesh); bookMeshes.push(mesh);
});


const shelfCenterY = BOTTOM_Y + (SHELF_H-0.4)/2;
const SHELF_POSE = { pos:new THREE.Vector3(0, shelfCenterY+1.2, INNER_W*1.35 + 6), tgt:new THREE.Vector3(0, shelfCenterY, 0) };

const READ_Z = 5.6, READ_ROT_X = -0.06;
const READ_POS  = new THREE.Vector3(0, shelfCenterY, READ_Z);
const READ_POSE = { pos:new THREE.Vector3(0, shelfCenterY+0.15, READ_Z + 5.8), tgt:new THREE.Vector3(0, shelfCenterY, READ_Z) };
camera.position.copy(SHELF_POSE.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(SHELF_POSE.tgt);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
controls.minDistance = 5; controls.maxDistance = INNER_W*1.6 + 12;
controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.5;
controls.update();




const PAGE_W = 2.4, PAGE_H = 3.2;
const openBook = new THREE.Group();
openBook.position.copy(READ_POS);
openBook.rotation.x = READ_ROT_X;
openBook.visible = false;
scene.add(openBook);


const coverBoard = new THREE.Mesh(new THREE.BoxGeometry(PAGE_W*2+0.3, PAGE_H+0.22, 0.16), wood(0x5b4a34,0.6));
coverBoard.position.z = -0.12; openBook.add(coverBoard);

function makePageMat(){ const c=document.createElement('canvas'); c.width=512; c.height=680;
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4;
  const mat=new THREE.MeshStandardMaterial({ map:tex, roughness:0.9 });
  return { c, tex, mat }; }
const leftPage = makePageMat(), rightPage = makePageMat();
const lMesh = new THREE.Mesh(new THREE.PlaneGeometry(PAGE_W, PAGE_H), leftPage.mat);
lMesh.position.set(-PAGE_W/2 - 0.02, 0, 0.02); openBook.add(lMesh);
const rMesh = new THREE.Mesh(new THREE.PlaneGeometry(PAGE_W, PAGE_H), rightPage.mat);
rMesh.position.set( PAGE_W/2 + 0.02, 0, 0.02); openBook.add(rMesh);


const turnPivot = new THREE.Group(); openBook.add(turnPivot);
const turnPage = new THREE.Mesh(new THREE.PlaneGeometry(PAGE_W, PAGE_H),
  new THREE.MeshStandardMaterial({ color:0xf3ead9, roughness:0.9, side:THREE.DoubleSide }));
turnPage.position.set(PAGE_W/2 + 0.02, 0, 0.04); turnPivot.add(turnPage); turnPivot.visible=false;


const closedProxy = new THREE.Mesh(new THREE.BoxGeometry(PAGE_W+0.14, PAGE_H+0.18, 0.5),
  new THREE.MeshStandardMaterial({ color:0x8a5a3c, roughness:0.6 }));
closedProxy.visible=false; openBook.add(closedProxy);


function drawPage(ctx, page, book, img){
  ctx.clearRect(0,0,512,680);
  ctx.fillStyle='#f4ecda'; ctx.fillRect(0,0,512,680);
  ctx.fillStyle='rgba(120,95,60,.10)'; ctx.fillRect(0,0,512,14); ctx.fillRect(0,666,512,14);
  ctx.fillStyle='#5a4732';
  if (page.type==='title'){
    ctx.textAlign='left';
    ctx.font='700 40px "Malgun Gothic", sans-serif';
    const lines = wrapText(ctx, book.title, 400).slice(0,5);
    let y=180; lines.forEach(ln=>{ ctx.fillText(ln, 56, y); y+=52; });
    ctx.font='400 22px "Malgun Gothic", sans-serif'; ctx.fillStyle='#8a7355';
    ctx.fillText(book.date, 56, y+26);
    ctx.fillStyle='#b6a483'; ctx.font='400 18px "Malgun Gothic", sans-serif';
    ctx.fillText('brotherwook · blog', 56, 636);
  } else if (page.type==='thumb'){
    
    const fx=46, fy=90, fw=420, fh=500;
    ctx.strokeStyle='#c9b48f'; ctx.lineWidth=3; ctx.strokeRect(fx,fy,fw,fh);
    if (img && img.complete && img.naturalWidth){
      const s=Math.min(fw/img.naturalWidth, fh/img.naturalHeight);
      const w=img.naturalWidth*s, h=img.naturalHeight*s;
      ctx.drawImage(img, fx+(fw-w)/2, fy+(fh-h)/2, w, h);
    } else {
      ctx.fillStyle='#e5d8bf'; ctx.fillRect(fx+2,fy+2,fw-4,fh-4);
      ctx.fillStyle='#a48f6b'; ctx.font='400 20px "Malgun Gothic", sans-serif'; ctx.textAlign='center';
      ctx.fillText('이미지 불러오는 중…', 256, fy+fh/2);
    }
    ctx.textAlign='center'; ctx.fillStyle='#8a7355'; ctx.font='600 20px "Malgun Gothic", sans-serif';
    ctx.fillText('표지', 256, 636);
  } else if (page.type==='text'){
    ctx.textAlign='left'; ctx.font='400 25px "Malgun Gothic", sans-serif'; ctx.fillStyle='#5a4732';
    const lines = wrapText(ctx, page.text, 400);
    let y=120; for (const ln of lines){ if (y>600) break; ctx.fillText(ln, 56, y); y+=40; }
  } else if (page.type==='end'){
    ctx.textAlign='center';
    ctx.font='60px serif'; ctx.fillText('🔖', 256, 300);
    ctx.font='600 26px "Malgun Gothic", sans-serif'; ctx.fillStyle='#5a4732';
    ctx.fillText('전체 글을 이어서 보시려면', 256, 380);
    ctx.fillText('아래 "글 보러가기"를 누르세요', 256, 420);
  }
  
}


let current = null;      
function buildSpreads(book){
  const pages = [{type:'title'}, {type:'thumb'}];
  const sum = (book.summary||'').trim();
  if (sum){
    
    const chunks=[]; let s=sum;
    while (s.length>0){ chunks.push(s.slice(0,150)); s=s.slice(150); }
    chunks.slice(0,4).forEach(t=> pages.push({type:'text', text:t}));
  }
  pages.push({type:'end'});
  const spreads=[];
  for (let i=0;i<pages.length;i+=2) spreads.push({ left:pages[i], right:pages[i+1]||{type:'blank'} });
  return spreads;
}

function renderSpread(){
  if (!current) return;
  const sp = current.spreads[current.idx];
  drawPage(leftPage.c.getContext('2d'),  sp.left,  current.book, current.img);
  drawPage(rightPage.c.getContext('2d'), sp.right, current.book, current.img);
  leftPage.tex.needsUpdate = true; rightPage.tex.needsUpdate = true;
  document.getElementById('pageno').textContent = (current.idx+1)+' / '+current.spreads.length;
  document.getElementById('prevBtn').disabled = current.idx===0;
  document.getElementById('nextBtn').disabled = current.idx>=current.spreads.length-1;
}




let mode='shelf';                 
let camTween=null;                
let bookAnim=null;                
let closeSeq=null;                
let selectedMesh=null;            
const readerEl=document.getElementById('reader');
const hintEl=document.getElementById('hint');

function tweenCamera(pose, dur, onDone){
  camTween = { fromP:camera.position.clone(), toP:pose.pos.clone(),
               fromT:controls.target.clone(), toT:pose.tgt.clone(), t:0, dur, onDone };
}

function openBookFor(mesh){
  selectedMesh = mesh;
  const book = mesh.userData.book;
  const img = new Image();
  img.onload = ()=>{ renderSpread(); };
  img.src = book.thumb;
  current = { book, img, spreads: buildSpreads(book), idx:0 };
  renderSpread();
  
  lMesh.visible=true; rMesh.visible=true; coverBoard.visible=true; closedProxy.visible=false; turnPivot.visible=false;
  openBook.visible = true;
  mesh.visible = false;                       
  const slotPos = mesh.position.clone();
  openBook.position.copy(slotPos); openBook.rotation.x=0; openBook.scale.setScalar(0.14);
  document.getElementById('goBtn').href = book.url;
  mode='anim'; controls.enabled=false;
  hintEl.classList.add('hide');
  
  bookAnim = { kind:'open', t:0, dur:0.7, fromP:slotPos.clone(), toP:READ_POS.clone(),
               fromS:0.14, toS:1, fromRX:0, toRX:READ_ROT_X,
               onDone:()=>{ mode='reading'; readerEl.classList.add('show'); } };
  tweenCamera(READ_POSE, 0.7);
}

function closeBook(){
  if (mode!=='reading' || !selectedMesh) return;
  readerEl.classList.remove('show');
  mode='anim'; controls.enabled=false;
  const col = selectedMesh.userData.color || 0x8a5a3c;
  closedProxy.material.color.setHex(col);
  turnPage.material.color.setHex(col);        
  turnPivot.visible=true; turnPivot.rotation.y=0;
  closeSeq = { phase:'fold', t:0 };           
}


let flip=null;    
function startFlip(dir){
  if (flip || mode!=='reading' || !current) return;
  if (dir>0 && current.idx>=current.spreads.length-1) return;
  if (dir<0 && current.idx<=0) return;
  turnPage.material.color.setHex(0xf3ead9);   
  turnPivot.visible=true;
  turnPivot.rotation.y = dir>0 ? 0 : -Math.PI;
  flip={ dir, t:0, swapped:false };
}


const raycaster=new THREE.Raycaster(); const pointer=new THREE.Vector2();
let downPos=null, movedFar=false, hoveredMesh=null;
function setPointer(e){ const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; }
function pickBook(e){ setPointer(e); raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(bookMeshes,false); return hits.length?hits[0].object:null; }

function onMove(e){
  if (downPos){ if (Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y)>6) movedFar=true; }
  if (mode!=='shelf'){ labelEl.style.display='none'; renderer.domElement.style.cursor='default'; return; }
  const m=pickBook(e);
  if (m!==hoveredMesh){ hoveredMesh=m; renderer.domElement.style.cursor = m?'pointer':'grab'; }
  if (m){
    labelEl.textContent=m.userData.book.title;
    labelEl.style.display='block';
    labelEl.style.left=e.clientX+'px'; labelEl.style.top=e.clientY+'px';
  } else labelEl.style.display='none';
}
function onDown(e){ downPos={x:e.clientX,y:e.clientY}; movedFar=false; }
function onUp(e){
  const click = downPos && !movedFar; downPos=null;
  if (!click || mode!=='shelf') return;
  const m=pickBook(e); if (m) openBookFor(m);
}
renderer.domElement.addEventListener('pointermove', onMove);
renderer.domElement.addEventListener('pointerdown', onDown);
renderer.domElement.addEventListener('pointerup', onUp);
renderer.domElement.addEventListener('pointerleave', ()=>{ labelEl.style.display='none'; });
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());

document.getElementById('nextBtn').addEventListener('click', ()=>startFlip(+1));
document.getElementById('prevBtn').addEventListener('click', ()=>startFlip(-1));
document.getElementById('closeBtn').addEventListener('click', closeBook);
window.addEventListener('keydown', e=>{
  if (mode==='reading'){ if(e.key==='ArrowRight') startFlip(+1); else if(e.key==='ArrowLeft') startFlip(-1); else if(e.key==='Escape') closeBook(); }
});


let composer;
(function(){ composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
  const w=window.innerWidth||1,h=window.innerHeight||1;
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(w,h), 0.28, 0.5, 0.9));
  composer.addPass(new OutputPass()); composer.setSize(w,h); })();


const clock=new THREE.Clock();
function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function tick(dt){
  
  for (const m of bookMeshes){
    const want = (m===hoveredMesh && mode==='shelf') ? 1 : 0;
    m.userData.hover += (want - m.userData.hover) * Math.min(1, dt*10);
    const pop = m.userData.hover;
    m.position.z = m.userData.base.z + pop*0.7;
    const em = pop*0.35;
    for (const mat of m.userData.mats){ if(mat.emissive){ mat.emissive.setRGB(em*1.0, em*0.85, em*0.55); } }
  }

  
  if (camTween){
    camTween.t += dt/camTween.dur;
    const k=easeInOut(Math.min(1,camTween.t));
    camera.position.lerpVectors(camTween.fromP, camTween.toP, k);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, k);
    if (camTween.t>=1){ const cb=camTween.onDone; camTween=null; if(cb) cb(); }
  }

  
  if (bookAnim){
    bookAnim.t += dt/bookAnim.dur;
    const k=easeInOut(Math.min(1,bookAnim.t));
    openBook.position.lerpVectors(bookAnim.fromP, bookAnim.toP, k);
    const s=bookAnim.fromS + (bookAnim.toS-bookAnim.fromS)*k; openBook.scale.setScalar(s);
    openBook.rotation.x = bookAnim.fromRX + (bookAnim.toRX-bookAnim.fromRX)*k;
    if (bookAnim.t>=1){ const cb=bookAnim.onDone; bookAnim=null; if(cb) cb(); }
  }

  
  if (closeSeq && closeSeq.phase==='fold'){
    closeSeq.t += dt/0.45;
    const k=easeInOut(Math.min(1,closeSeq.t));
    turnPivot.rotation.y = -Math.PI*k;
    if (closeSeq.t>=1){
      lMesh.visible=false; rMesh.visible=false; turnPivot.visible=false; coverBoard.visible=false;
      closedProxy.visible=true;                       
      const slotPos = selectedMesh.position.clone();
      bookAnim = { kind:'return', t:0, dur:0.6, fromP:openBook.position.clone(), toP:slotPos,
                   fromS:openBook.scale.x, toS:0.14, fromRX:openBook.rotation.x, toRX:0,
                   onDone:()=>{ openBook.visible=false; closedProxy.visible=false;
                     coverBoard.visible=true; lMesh.visible=true; rMesh.visible=true;
                     if(selectedMesh) selectedMesh.visible=true; selectedMesh=null; current=null;
                     mode='shelf'; controls.enabled=true; hintEl.classList.remove('hide'); } };
      tweenCamera(SHELF_POSE, 0.6);                    
      closeSeq=null;
    }
  }

  
  if (flip){
    flip.t += dt/0.5;
    const k=easeInOut(Math.min(1,flip.t));
    turnPivot.rotation.y = flip.dir>0 ? -Math.PI*k : -Math.PI*(1-k);
    if (!flip.swapped && flip.t>=0.5){ current.idx += flip.dir; renderSpread(); flip.swapped=true; }
    if (flip.t>=1){ turnPivot.visible=false; flip=null; }
  }

  controls.update();
}
function animate(){ requestAnimationFrame(animate); tick(Math.min(clock.getDelta(),0.05)); composer.render(); }
animate();
setTimeout(()=>{ loadingEl.style.display='none'; }, 400);

function resizeNow(){ const w=window.innerWidth||1,h=window.innerHeight||1;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); composer.setSize(w,h); }
window.addEventListener('resize', resizeNow);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resizeNow(); });
</script></body></html>
