</div>
</div><h2 id="직접-다-만들-필요는-없었다-mediamtx-같은-변환-서버">직접 다 만들 필요는 없었다: MediaMTX 같은 변환 서버</h2>
<p>여기까지 오면 &ldquo;RTSP 받기 + WebRTC 변환 + 시그널링 + STUN&quot;을 전부 직접 짜야 하나 싶어 아득해진다. 다행히 이 파이프라인을 상당 부분 해결해주는 오픈소스 미디어 서버들이 있다. 대표적인 게 <strong>MediaMTX</strong>다.</p>
<p>MediaMTX 같은 서버가 하는 일을 정리하면:</p>
<ul>
<li><strong>입력</strong>으로 RTSP/RTMP 등 다양한 프로토콜 스트림을 받아들이고</li>
<li><strong>출력</strong>으로 같은 스트림을 RTSP, HLS, <strong>WebRTC</strong> 등 여러 형식으로 동시에 내보내고</li>
<li>WebRTC 재생에 필요한 시그널링 엔드포인트를 자체 제공한다</li>
</ul>
<p>즉 &ldquo;카메라의 RTSP를 받아서, 브라우저가 WebRTC로 바로 붙을 수 있게&rdquo; 중간 변환을 담당한다. 덕분에 저수준 변환을 매번 직접 짜는 대신, 이런 서버를 파이프라인의 변환 계층으로 두는 선택이 가능해진다. 나처럼 &ldquo;실시간 재생이 목표지 WebRTC 구현 자체가 목표는 아닌&rdquo; 경우라면, 이걸 먼저 검토해보길 추천한다.</p>
<h2 id="전체-파이프라인-카메라--서버--브라우저">전체 파이프라인: 카메라 → 서버 → 브라우저</h2>
<p>정리하면 그림은 이렇게 된다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">[IP 카메라]
</span></span><span class="line"><span class="cl">   │  RTSP (필요시 TLS로 암호화)
</span></span><span class="line"><span class="cl">   ▼
</span></span><span class="line"><span class="cl">[미디어 서버 (예: MediaMTX)]
</span></span><span class="line"><span class="cl">   │  - RTSP 입력을 수신
</span></span><span class="line"><span class="cl">   │  - WebRTC로 변환, 시그널링 제공
</span></span><span class="line"><span class="cl">   │  - (STUN/TURN 연동으로 NAT 통과)
</span></span><span class="line"><span class="cl">   ▼
</span></span><span class="line"><span class="cl">[브라우저]
</span></span><span class="line"><span class="cl">   - WebRTC로 접속
</span></span><span class="line"><span class="cl">   - &lt;video&gt; 요소에 실시간 스트림 재생 (1초 미만 지연)
</span></span></code></pre></td></tr></table>
</div>
</div><ul>
<li><strong>카메라 → 서버</strong>: RTSP로 영상을 끌어온다. 보안이 필요하면 앞 글처럼 TLS로 감싼다.</li>
<li><strong>서버</strong>: 프로토콜 변환의 핵심. RTSP를 브라우저 친화적인 WebRTC로 바꾸고, 연결 협상(시그널링)과 NAT 통과(STUN/TURN)를 처리한다.</li>
<li><strong>서버 → 브라우저</strong>: 브라우저는 WebRTC로 붙어 저지연 재생. 이제야 <code>&lt;video&gt;</code>에 실시간 영상이 뜬다.</li>
</ul>
<h2 id="정리하며">정리하며</h2>
<p>브라우저에서 RTSP를 실시간으로 보여주는 일은 &ldquo;태그에 URL만 넣으면 되겠지&quot;에서 시작해 프로토콜 변환의 세계로 끌려 들어가는 여정이었다. 배운 걸 압축하면:</p>
<ul>
<li>브라우저는 RTSP를 직접 못 읽는다. <strong>중간 변환 서버가 반드시 필요</strong>하다.</li>
<li><strong>HLS</strong>는 안정적이고 자료가 많지만 <strong>구조적 지연</strong> 때문에 실시간 감시엔 부적합하다.</li>
<li><strong>WebRTC</strong>는 저지연 실시간에 강하지만, **ICE/STUN/TURN(NAT 통과)**과 <strong>시그널링(Offer/Answer/candidate 교환)</strong> 개념을 이해해야 한다. 특히 시그널링 경로는 개발자가 직접 마련해야 한다.</li>
<li><strong>MediaMTX 같은 미디어 서버</strong>를 쓰면 이 변환·시그널링 상당 부분을 위임할 수 있어 파이프라인을 훨씬 현실적으로 구성할 수 있다.</li>
</ul>
<p>프로토콜 하나를 브라우저에 얹는 일이 이렇게 많은 개념을 요구할 줄은 몰랐다.. 그래도 덕분에 실시간 스트리밍이 어떤 조각들로 이뤄지는지 전체 그림을 얻었다. 다음에 비슷한 요구가 오면 이제 어디서부터 손대야 할지는 안다.</p>
`,date:"2026.09.13",summary:`문제: RTSP는 브라우저가 못 읽는다 앞 글에서 IP 카메라의 RTSP 스트림을 받아오는 데는 성공했다. 이제 이걸 웹 화면에서 실시간으로 보여주고 싶었다. 관리자용 CMS든 모니터링 대시보드든, 결국 사용자는 브라우저에서 영상을 본다.
처음엔 순진하게 이렇게 생각했다.
1 <video src="rtsp://.../stream" controls></video> 안 된다. 브라우저의 <video> 태그는 RTSP를 지원하지 않는다. HTTP(S)로 서빙되는 MP4나, HLS/DASH 같은 HTTP 기반 스트리밍, 아니면 WebRTC로만 영상을 받을 수 있다. RTSP는 태생이 브라우저용이 아니다.. 그래서 RTSP를 브라우저가 알아듣는 형식으로 중간에서 변환해주는 서버가 반드시 필요하다.
`,thumb:"/images/book-default.svg",title:"[WebRTC] RTSP를 브라우저에서 실시간으로 보기 — HLS를 거쳐 WebRTC까지",url:"/posts/rtsp-to-browser-webrtc/"},{content:`<h2 id="왜-rtsp를-그냥-쓰면-안-됐나">왜 RTSP를 그냥 쓰면 안 됐나</h2>
<p>IP 카메라 영상을 받아올 때 제일 흔히 쓰는 게 RTSP(Real-Time Streaming Protocol)다. 그동안 나도 별생각 없이 써왔는데, 이번에 보안 요건이 걸리면서 한 가지 사실을 마주했다. 표준 RTSP에는 요즘 당연하게 여기는 게 하나 빠져 있다. <strong>전송 구간 암호화</strong>다.</p>
<p>RTSP 자체는 스트림을 &ldquo;제어&quot;하는 프로토콜이다. <code>DESCRIBE</code>, <code>OPTIONS</code>, <code>SETUP</code>, <code>PLAY</code> 같은 명령을 주고받아 세션을 열고, 실제 영상은 RTP로 흘려보낸다. 문제는 이 제어 채널과 인증 정보가 <strong>기본적으로 평문</strong>으로 오간다는 것.. 카메라 계정 자격증명이 네트워크에 그대로 노출될 수 있고, 중간자 공격에도 취약하다.</p>
<p>평소엔 넘어갈 수 있어도, 제품이 보안 인증(전송 구간 암호화 여부를 보는 항목)을 통과해야 하는 상황이면 평문 RTSP는 선택지가 아니다. 그래서 RTSP 세션 전체를 <strong>TLS 위에 얹는</strong> 방식, URL 스킴으로는 <code>rtsps://</code> 라 부르는 방식을 쓰게 됐다. HTTP가 HTTPS 되는 거랑 정확히 같은 발상이다. TCP로 열던 소켓을, TLS 핸드셰이크 먼저 하고 그 위에서 RTSP 메시지를 주고받게 바꾸는 것.</p>
<p>개념은 이렇게 간단하다. &ldquo;TLS 소켓 위에서 하던 RTSP 그대로 하면 되는 거 아냐?&rdquo; 맞다. 그런데 <strong>라이브러리에 안 기대고 직접</strong> 구현하려니 생각보다 걸리는 데가 많았다. 아래는 막혔던 지점을 순서대로 적어둔 것이다. 나처럼 직접 짜야 하는 상황이 아니라면 그냥 성숙한 라이브러리를 쓰는 걸 추천한다.. 이건 어디까지나 &ldquo;직접 해봐야 했던&rdquo; 기록이다.</p>
<h2 id="1-tls-소켓-위에서-요청-보내기--ssl-에러의-늪">1. TLS 소켓 위에서 요청 보내기 — SSL 에러의 늪</h2>
<p>Python으로 TLS 소켓 열고 그 위로 요청 보내는 것 자체는 <code>ssl</code> 모듈로 쉬워 보였다. 실제로는 SSL 에러부터 꽤 만났다.</p>
<p>전형적으로 만나는 것들:</p>
<ul>
<li><strong>인증서 검증 실패</strong> — 카메라·장비는 자체 서명(self-signed) 인증서를 쓰는 경우가 많다. 기본 검증 모드에서는 <code>CERTIFICATE_VERIFY_FAILED</code>가 뜬다. 신뢰할 수 있는 내부망 장비라는 전제가 있다면 검증 모드를 조정하거나 인증서를 신뢰 목록에 넣어야 한다.</li>
<li><strong>호스트네임 불일치</strong> — 인증서의 CN/SAN과 접속 IP가 안 맞을 때. <code>check_hostname</code>과 충돌한다.</li>
<li><strong>프로토콜/사이퍼 협상 실패</strong> — 장비가 오래된 TLS 버전이나 특정 사이퍼만 받을 때.</li>
</ul>
<p>대략 이런 뼈대였다. (실제 서비스 코드가 아니라 개념용 예제다.)</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt"> 1
</span><span class="lnt"> 2
</span><span class="lnt"> 3
</span><span class="lnt"> 4
</span><span class="lnt"> 5
</span><span class="lnt"> 6
</span><span class="lnt"> 7
</span><span class="lnt"> 8
</span><span class="lnt"> 9
</span><span class="lnt">10
</span><span class="lnt">11
</span><span class="lnt">12
</span><span class="lnt">13
</span><span class="lnt">14
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-python" data-lang="python"><span class="line"><span class="cl"><span class="kn">import</span> <span class="nn">socket</span>
</span></span><span class="line"><span class="cl"><span class="kn">import</span> <span class="nn">ssl</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="n">context</span> <span class="o">=</span> <span class="n">ssl</span><span class="o">.</span><span class="n">create_default_context</span><span class="p">()</span>
</span></span><span class="line"><span class="cl"><span class="c1"># 자체 서명 인증서를 쓰는 내부망 장비 대상: 검증 정책은 환경에 맞게 결정</span>
</span></span><span class="line"><span class="cl"><span class="n">context</span><span class="o">.</span><span class="n">check_hostname</span> <span class="o">=</span> <span class="kc">False</span>
</span></span><span class="line"><span class="cl"><span class="n">context</span><span class="o">.</span><span class="n">verify_mode</span> <span class="o">=</span> <span class="n">ssl</span><span class="o">.</span><span class="n">CERT_NONE</span>  <span class="c1"># 신뢰된 폐쇄망 전제일 때의 선택. 공개망이면 이렇게 하면 안 된다.</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="n">raw</span> <span class="o">=</span> <span class="n">socket</span><span class="o">.</span><span class="n">create_connection</span><span class="p">((</span><span class="n">host</span><span class="p">,</span> <span class="n">port</span><span class="p">),</span> <span class="n">timeout</span><span class="o">=</span><span class="mi">5</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="n">tls</span> <span class="o">=</span> <span class="n">context</span><span class="o">.</span><span class="n">wrap_socket</span><span class="p">(</span><span class="n">raw</span><span class="p">,</span> <span class="n">server_hostname</span><span class="o">=</span><span class="n">host</span><span class="p">)</span>
</span></span><span class="line"><span class="cl">
</span></span><span class="line"><span class="cl"><span class="c1"># 이제 tls 소켓 위로 RTSP 텍스트 메시지를 write/read 하면 된다</span>
</span></span><span class="line"><span class="cl"><span class="n">tls</span><span class="o">.</span><span class="n">sendall</span><span class="p">(</span><span class="n">request_bytes</span><span class="p">)</span>
</span></span><span class="line"><span class="cl"><span class="n">data</span> <span class="o">=</span> <span class="n">tls</span><span class="o">.</span><span class="n">recv</span><span class="p">(</span><span class="mi">4096</span><span class="p">)</span>
</span></span></code></pre></td></tr></table>
</div>
</div><p>여기서 배운 것.. <code>verify_mode</code>를 끄는 건 &ldquo;폐쇄망 + 장비 신뢰&quot;라는 전제가 명확할 때의 트레이드오프다. 왜 껐는지 근거를 안 남기면 나중에 보안 관점에서 지적받기 딱 좋은 부분이라, <strong>결정 이유를 주석과 문서로 남기는 게 맞다.</strong></p>
<h2 id="2-digest-인증-직접-만들기--rfc-7616-읽기">2. Digest 인증 직접 만들기 — RFC 7616 읽기</h2>
<p>TLS 소켓이 열리면 다음은 인증이다. RTSP는 HTTP의 인증 방식을 그대로 가져다 쓴다. 카메라에 명령을 처음 보내면 <code>401 Unauthorized</code>와 함께 <code>WWW-Authenticate</code> 헤더가 오고, 여기에 Digest 인증에 필요한 파라미터(<code>realm</code>, <code>nonce</code>, <code>qop</code>, <code>algorithm</code> 등)가 들어 있다.</p>
<p>Basic 인증이면 <code>base64(user:pass)</code>로 끝인데, 보안상 Digest(특히 SHA-256)를 요구하는 경우가 있다. 이때 봐야 하는 문서가 **RFC 7616 (HTTP Digest Access Authentication)**이다. 여기 명세대로 응답 해시를 만들어야 한다.</p>
<p>핵심 계산 흐름은 이렇다 (<code>algorithm=SHA-256</code> 기준):</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">HA1 = SHA256(username : realm : password)
</span></span><span class="line"><span class="cl">HA2 = SHA256(method : digestURI)
</span></span><span class="line"><span class="cl">response = SHA256(HA1 : nonce : nc : cnonce : qop : HA2)
</span></span></code></pre></td></tr></table>
</div>
</div><ul>
<li><code>method</code>는 RTSP 메서드(<code>OPTIONS</code>, <code>DESCRIBE</code>, <code>PLAY</code> 등)</li>
<li><code>nc</code>(nonce count), <code>cnonce</code>(client nonce)는 <code>qop=auth</code>일 때 포함</li>
<li>이 <code>response</code>를 다시 <code>Authorization</code> 헤더에 규격대로 조립해서 보낸다</li>
</ul>
<p>직접 만들 때 헷갈렸던 건, MD5 시절 예제가 인터넷에 훨씬 많아서 SHA-256으로 바꿀 때 어디까지 그대로 두고 어디를 고쳐야 하는지였다. 결론은 <strong>해시 함수만 교체</strong>하면 구조는 동일하다. 그리고 <code>algorithm</code>이 <code>SHA-256</code>인지 <code>SHA-256-sess</code>인지에 따라 HA1 계산이 달라지니 <strong>서버가 보낸 값을 그대로 따라야</strong> 한다.</p>
<p>하나 더 — 요청마다 <code>CSeq</code>를 1씩 올려 보내야 하고, 인증이 필요한 모든 후속 명령에 <code>Authorization</code>을 계속 붙여야 한다. 한 번 인증했다고 세션이 자동으로 유지되는 게 아니다.</p>
<h2 id="3-명령을-어디에-실어야-하나--헤더냐-바디냐">3. 명령을 &ldquo;어디에&rdquo; 실어야 하나 — 헤더냐 바디냐</h2>
<p>여기서 개념적으로 한참 헤맸다. 인증을 통과한 뒤 <code>OPTIONS</code>, <code>DESCRIBE</code>, <code>SETUP</code>, <code>PLAY</code>를 보내는데, 이걸 <strong>HTTP처럼 바디에 넣는 건지, 헤더에 넣는 건지, 아예 다른 형식인지</strong>가 처음엔 감이 안 왔다.</p>
<p>정리하고 나니 답은 명확했다. RTSP 메시지는 <strong>HTTP와 아주 닮은 텍스트 기반 요청/응답 구조</strong>다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span><span class="lnt">2
</span><span class="lnt">3
</span><span class="lnt">4
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">PLAY rtsp://.../stream RTSP/1.0
</span></span><span class="line"><span class="cl">CSeq: 4
</span></span><span class="line"><span class="cl">Session: 12345678
</span></span><span class="line"><span class="cl">Authorization: Digest username=&#34;...&#34;, realm=&#34;...&#34;, ...
</span></span></code></pre></td></tr></table>
</div>
</div><ul>
<li>첫 줄이 요청 라인: <code>&lt;메서드&gt; &lt;URI&gt; RTSP/1.0</code></li>
<li>그 아래로 헤더들 (<code>CSeq</code>, <code>Session</code>, <code>Authorization</code>, 필요시 <code>Range</code> 등)</li>
<li>헤더 끝은 빈 줄(<code>\\r\\n\\r\\n</code>)로 구분</li>
<li>대부분의 제어 명령은 <strong>바디가 없다.</strong> 대상과 옵션은 요청 라인과 헤더로 표현된다</li>
</ul>
<p>즉 &ldquo;명령을 바디에 넣는다&quot;는 발상 자체가 틀렸던 것.. 메서드가 곧 명령이고, 세부 옵션은 헤더로 간다. 바디(SDP 등)가 등장하는 건 <code>DESCRIBE</code>의 응답이나 <code>ANNOUNCE</code> 같은 특정 경우다. 이 구조를 이해하고 나서는 메시지 조립이 훨씬 수월해졌다.</p>
<h2 id="4-play-이후-데이터-파싱--rfc-2326과-wireshark">4. PLAY 이후 데이터 파싱 — RFC 2326과 Wireshark</h2>
<p><code>PLAY</code>를 보내면 이제 실제 미디어(RTP로 감싼 H.264 스트림)가 흘러 들어온다. 그런데 이걸 어떻게 잘라 읽어야 하는지가 또 벽이었다.</p>
<p>TCP 인터리브 모드에서는 제어 응답과 미디어 데이터가 <strong>같은 연결 위에 섞여서</strong> 온다. 이걸 구분하는 규칙이 **RFC 2326의 10.12절 (Embedded (Interleaved) Binary Data)**에 있다.</p>
<p>핵심은 미디어 데이터 앞에 붙는 4바이트 헤더다.</p>
<div class="highlight"><div class="chroma">
<table class="lntable"><tr><td class="lntd">
<pre tabindex="0" class="chroma"><code><span class="lnt">1
</span></code></pre></td>
<td class="lntd">
<pre tabindex="0" class="chroma"><code class="language-fallback" data-lang="fallback"><span class="line"><span class="cl">$ (0x24) | channel(1 byte) | length(2 bytes, big-endian)
</span></span></code></pre></td></tr></table>
</div>
</div><ul>
<li><code>0x24</code>(<code>$</code>)로 시작하면 그 뒤는 인터리브된 바이너리 데이터라는 신호</li>
<li>다음 1바이트는 채널 ID</li>
<li>그다음 2바이트가 뒤따르는 데이터 길이</li>
</ul>
<p>이 규칙을 알기 전엔 바이트 스트림이 그냥 뭉텅이로 보여서 어디서 끊어야 할지 몰랐다. <strong>Wireshark로 실제 패킷을 뜯어보면서</strong> <code>$</code> 마커와 length 필드를 눈으로 확인하고 나서야 파서를 제대로 짤 수 있었다. RFC 문서만으로 이해가 안 되던 게, 실제 패킷과 대조하니 한 번에 잡혔다.</p>
<h3 id="이어붙이기--length만큼-안-왔을-때">이어붙이기 — length만큼 안 왔을 때</h3>
<p>실무에서 중요한 함정이 하나 더 있다. <strong>헤더에 적힌 length만큼 데이터가 한 번에 안 오는 경우</strong>다.</p>
<p>TCP는 스트림이라 &ldquo;메시지 경계&quot;를 보장하지 않는다. length가 1400바이트라고 적혀 있어도 <code>recv()</code> 한 번에 900바이트만 올 수 있다. 이걸 모르고 한 번 읽은 걸 한 프레임으로 처리하면 데이터가 깨진다.</p>
<p>그래서 파서는 이렇게 동작해야 한다.</p>
<ol>
<li>4바이트 헤더를 읽어 length 확인</li>
<li>버퍼에 length만큼 쌓일 때까지 계속 <code>recv()</code> 해서 이어붙이기</li>
<li>다 모이면 그 덩어리를 한 단위(RTP 패킷)로 넘기고, 남은 바이트는 다음 파싱을 위해 버퍼에 보관</li>
</ol>
<p>이것도 Wireshark로 &ldquo;한 length가 여러 TCP 세그먼트에 걸쳐 오는&rdquo; 걸 직접 보고 나서야 확신을 갖고 구현했다. 패킷 분석 없이 코드만 봤으면 &ldquo;가끔 영상이 깨지는&rdquo; 원인을 한참 못 찾았을 거다.</p>
<h2 id="정리">정리</h2>
<p>라이브러리 하나면 될 걸 왜 직접 했나 싶지만, 이 과정에서 얻은 게 컸다.</p>
<ul>
<li><strong>RTSP over TLS</strong>는 &ldquo;HTTPS와 같은 발상&quot;이지만, 자체 서명 인증서·사이퍼 협상 때문에 소켓 레벨에서 손볼 게 있다.</li>
<li>**Digest 인증(RFC 7616)**은 해시 함수만 바꾸면 구조가 같고, 요청마다 <code>CSeq</code>·<code>Authorization</code>을 계속 관리해야 한다.</li>
<li>RTSP 제어 명령은 <strong>HTTP 유사 텍스트 구조</strong>라 메서드가 곧 명령, 옵션은 헤더. 대부분 바디가 없다.</li>
<li>인터리브 스트림 파싱은 <strong>RFC 2326 10.12절의 <code>$</code>+channel+length 규칙</strong>을 따르고, <strong>TCP 특성상 length만큼 이어붙이는 로직이 필수</strong>다.</li>
</ul>
<p>무엇보다 이번 삽질의 진짜 수확은 <strong>RFC를 읽고 Wireshark로 실제 패킷과 대조하는 습관</strong>이었다. 명세만으로 안 잡히던 게 패킷을 보면 잡혔고, 반대로 패킷만 봐선 헷갈리던 게 명세를 보면 정리됐다. 저수준 프로토콜을 다룰 땐 이 둘을 오가는 게 제일 확실한 길인 것 같다.</p>
<p>다음 글에서는 이렇게 받아온 RTSP 스트림을 <strong>브라우저에서 실시간으로 보여주려고 WebRTC까지 가게 된 과정</strong>을 정리한다.</p>

  mesh.userData = { book:b, base:mesh.position.clone(), hover:0, mats, color };
  scene.add(mesh); bookMeshes.push(mesh);
});


const shelfCenterY = BOTTOM_Y + (SHELF_H-0.4)/2;
const SHELF_POSE = { pos:new THREE.Vector3(0, shelfCenterY+1.2, INNER_W*1.35 + 6), tgt:new THREE.Vector3(0, shelfCenterY, 0) };

const READ_Z = 5.6, READ_ROT_X = -0.06;
const READ_POS  = new THREE.Vector3(0, shelfCenterY, READ_Z);
const READ_POSE = { pos:new THREE.Vector3(0, shelfCenterY+0.15, READ_Z + 5.8), tgt:new THREE.Vector3(0, shelfCenterY, READ_Z) };
camera.position.copy(SHELF_POSE.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(SHELF_POSE.tgt);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
controls.minDistance = 5; controls.maxDistance = INNER_W*1.6 + 12;
controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.5;
controls.update();




let mode = 'shelf';                 
let pageFlip = null;

const overlay    = document.getElementById('flip-overlay');
const flipbookEl = document.getElementById('flipbook');
const measureEl  = document.getElementById('flip-measure');
const pagenoEl   = document.getElementById('fb-pageno');
const goBtn      = document.getElementById('fb-go');
const hintEl     = document.getElementById('hint');

function escHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }



function isPortrait(){ return (window.innerWidth||1) < 700; }
function computePageSize(portrait){
  const vw = window.innerWidth||1, vh = window.innerHeight||1;
  const across = portrait ? 1 : 2;          
  let ph = Math.min(vh - 150, 760);
  let pw = Math.round(ph / 1.4);
  if (pw*across > vw - 40){ pw = Math.floor((vw - 40)/across); ph = Math.round(pw*1.4); }
  pw = Math.max(pw, 220); ph = Math.max(ph, 308);
  document.documentElement.style.setProperty('--pw', pw+'px');
  document.documentElement.style.setProperty('--ph', ph+'px');
  return { pw, ph };
}

function coverPage(book){
  const p=document.createElement('div'); p.className='page cover'; p.setAttribute('data-density','hard');
  p.innerHTML = '<div class="page-inner">'
    + '<div class="cover-kicker">brotherwook · blog</div>'
    + '<div class="cover-thumb"><img src="'+escHtml(book.thumb)+'" alt=""></div>'
    + '<div class="cover-ttl">'+escHtml(book.title)+'</div>'
    + '<div class="cover-date">'+escHtml(book.date)+'</div>'
    + '</div>';
  return p;
}
function backPage(book){
  const p=document.createElement('div'); p.className='page cover back'; p.setAttribute('data-density','hard');
  p.innerHTML = '<div class="page-inner">'
    + '<div class="back-emoji">🔖</div>'
    + '<div class="back-msg">여기까지 미리보기예요.<br>전체 글은 실제 페이지에서 더 편하게 읽을 수 있어요.</div>'
    + '<a class="back-go" href="'+escHtml(book.url)+'" target="_self">글 전체 페이지로 →</a>'
    + '</div>';
  return p;
}
function contentPage(innerHTML){
  const p=document.createElement('div'); p.className='page';
  p.innerHTML = '<div class="page-inner"><div class="page-content">'+innerHTML+'</div></div>';
  return p;
}


function paginate(contentHTML){
  const holder=document.createElement('div'); holder.innerHTML = contentHTML || '';
  const measure = contentPage(''); measureEl.innerHTML=''; measureEl.appendChild(measure);
  const area = measure.querySelector('.page-content');
  const maxH = area.clientHeight || 500;
  const pages=[];
  const flush = ()=>{ if (area.innerHTML.trim()){ pages.push(area.innerHTML); area.innerHTML=''; } };
  const fits  = ()=> area.scrollHeight <= maxH + 1;
  const isText= (n)=> n.nodeType===1 && /^(P|LI|BLOCKQUOTE|H1|H2|H3|H4|H5|H6)$/.test(n.tagName);

  function splitText(node){
    const tag=node.tagName.toLowerCase();
    const mk=()=>{ const el=document.createElement(tag); if(node.className) el.className=node.className; return el; };
    const words=(node.textContent||'').split(/(\s+)/);
    let el=mk(); area.appendChild(el);
    for (const w of words){
      el.appendChild(document.createTextNode(w));
      if (!fits()){ el.removeChild(el.lastChild); flush(); el=mk(); area.appendChild(el); el.appendChild(document.createTextNode(w)); }
    }
  }
  function addWhole(node){
    area.appendChild(node.cloneNode(true));
    if (fits()) return;
    const last=area.lastChild; area.removeChild(last);
    if (area.childNodes.length===0){
      if (isText(node)) splitText(node);
      else { area.appendChild(last); flush(); }
    } else {
      flush();
      area.appendChild(node.cloneNode(true));
      if (!fits()){
        const l2=area.lastChild; area.removeChild(l2);
        if (isText(node)) splitText(node);
        else { area.appendChild(l2); flush(); }
      }
    }
  }

  for (const node of Array.from(holder.childNodes)){
    if (node.nodeType===8) continue;                                  
    if (node.nodeType===3){ if(!node.textContent.trim()) continue;    
      const p=document.createElement('p'); p.textContent=node.textContent; addWhole(p); continue; }
    addWhole(node);
  }
  flush();
  measureEl.innerHTML='';
  return pages;
}

function openFlipbook(book){
  if (mode!=='shelf') return;
  if (!window.St || !St.PageFlip){ location.href = book.url; return; }   
  mode='reading'; controls.enabled=false; hintEl.classList.add('hide');
  const portrait = isPortrait();                                        
  const sz = computePageSize(portrait);
  overlay.classList.add('show');                                        

  const built=[ coverPage(book) ];
  let bodyPages = paginate(book.content);
  if (bodyPages.length===0) bodyPages=['<p style="color:#8a7355">(내용을 불러올 수 없어요)</p>'];
  bodyPages.forEach(html=> built.push(contentPage(html)));
  built.push(backPage(book));

  
  
  if (pageFlip){ try{ pageFlip.destroy(); }catch(e){} pageFlip=null; }
  flipbookEl.innerHTML='';
  const root = document.createElement('div');
  built.forEach(el=> root.appendChild(el));
  flipbookEl.appendChild(root);

  pageFlip = new St.PageFlip(root, {
    width: sz.pw, height: sz.ph, size:'fixed',
    showCover:true, usePortrait:portrait, mobileScrollSupport:false,   
    maxShadowOpacity:0.5, drawShadow:true, flippingTime:650, useMouseEvents:true
  });
  pageFlip.loadFromHTML(root.querySelectorAll('.page'));
  goBtn.href = book.url;
  const total = pageFlip.getPageCount();
  const upd = (n)=>{ pagenoEl.textContent = (n+1)+' / '+total; };
  pageFlip.on('flip', (e)=> upd(e.data));
  upd(0);
}

function closeFlipbook(){
  if (mode!=='reading') return;
  overlay.classList.remove('show');
  if (pageFlip){ try{ pageFlip.destroy(); }catch(e){} pageFlip=null; }
  flipbookEl.innerHTML='';
  mode='shelf'; controls.enabled=true; hintEl.classList.remove('hide');
}


const raycaster=new THREE.Raycaster(); const pointer=new THREE.Vector2();
let downPos=null, movedFar=false, hoveredMesh=null;
function setPointer(e){ const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; }
function pickBook(e){ setPointer(e); raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObjects(bookMeshes,false); return hits.length?hits[0].object:null; }

function onMove(e){
  if (downPos){ if (Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y)>6) movedFar=true; }
  if (mode!=='shelf'){ labelEl.style.display='none'; return; }
  const m=pickBook(e);
  if (m!==hoveredMesh){ hoveredMesh=m; renderer.domElement.style.cursor = m?'pointer':'grab'; }
  if (m){ labelEl.textContent=m.userData.book.title; labelEl.style.display='block';
    labelEl.style.left=e.clientX+'px'; labelEl.style.top=e.clientY+'px'; }
  else labelEl.style.display='none';
}
function onDown(e){ downPos={x:e.clientX,y:e.clientY}; movedFar=false; }
function onUp(e){
  const click = downPos && !movedFar; downPos=null;
  if (!click || mode!=='shelf') return;
  const m=pickBook(e); if (m) openFlipbook(m.userData.book);
}
renderer.domElement.addEventListener('pointermove', onMove);
renderer.domElement.addEventListener('pointerdown', onDown);
renderer.domElement.addEventListener('pointerup', onUp);
renderer.domElement.addEventListener('pointerleave', ()=>{ labelEl.style.display='none'; });
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());

document.getElementById('fb-next').addEventListener('click', ()=> pageFlip && pageFlip.flipNext());
document.getElementById('fb-prev').addEventListener('click', ()=> pageFlip && pageFlip.flipPrev());
document.getElementById('fb-close').addEventListener('click', closeFlipbook);
window.addEventListener('keydown', e=>{
  if (mode!=='reading') return;
  if (e.key==='ArrowRight') pageFlip && pageFlip.flipNext();
  else if (e.key==='ArrowLeft') pageFlip && pageFlip.flipPrev();
  else if (e.key==='Escape') closeFlipbook();
});


let composer;
(function(){ composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
  const w=window.innerWidth||1,h=window.innerHeight||1;
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(w,h), 0.28, 0.5, 0.9));
  composer.addPass(new OutputPass()); composer.setSize(w,h); })();


const clock=new THREE.Clock();
function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
function tick(dt){
  
  for (const m of bookMeshes){
    const want = (m===hoveredMesh && mode==='shelf') ? 1 : 0;
    m.userData.hover += (want - m.userData.hover) * Math.min(1, dt*10);
    const pop = m.userData.hover;
    m.position.z = m.userData.base.z + pop*0.7;
    const em = pop*0.35;
    for (const mat of m.userData.mats){ if(mat.emissive){ mat.emissive.setRGB(em*1.0, em*0.85, em*0.55); } }
  }

  controls.update();
}
function animate(){ requestAnimationFrame(animate); tick(Math.min(clock.getDelta(),0.05)); composer.render(); }
animate();
setTimeout(()=>{ loadingEl.style.display='none'; }, 400);

function resizeNow(){ const w=window.innerWidth||1,h=window.innerHeight||1;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); composer.setSize(w,h); }
window.addEventListener('resize', resizeNow);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resizeNow(); });
</script></body></html>
